fig-001-1: |
  青い円の中に白い図形を配したシンボルマーク。円の左側に縦長の三日月形の白い曲線があり、その右側から右上に向かって、扇状に広がる複数の白い曲線状の帯が描かれている。図の中に文字はない。
fig-023-1: |
  「育成する人財像」「育成する能力」「代表的な教育手法（例）」の見出しを持つ3つの枠が上から下へ並び、枠と枠の間に下向きの白抜き矢印がある。最上段の枠には、育成する人財像として「科学や技術を活用・応用発展させて人々や社会の幸せ（Well being)に貢献する人財」が大きく書かれている。中段の枠には「１．社会貢献への大きな志」から「７．継続的学習力」までの7項目が、左列に1〜3、右列に4〜7の2列で並ぶ。最下段の枠には1〜5の番号付きの教育手法が文章で列挙され、「プロジェクトベース学習」などの語句が太字で強調されている。
fig-023-2: |
  上段に緑の枠「MCC(モデル)：創造性・デザイン能力」があり、その中に「創造性」と「エンジニアリングデザイン能力」の2つの箱が左右に並び、それぞれ箇条書きの項目を持つ。中段は、左にオレンジの枠「MCC(モデル)：基盤的資質・能力（汎用的技能）」（「対人関係スキル」と「個人的スキル」の点線の区画を含む）、右に青い枠「MCC(コア)（知識・技能）」（「基礎的能力」の4項目と「分野別専門能力」の2項目を含む）があり、下段には黄色の枠「MCC(モデル)：基盤的資質・能力（態度・志向性）」が横に広がる。図の最上部には「解決すべき問題」と「解の創造，実現」の2つの箱があり、左上の「解決すべき問題」の側から、中央の帯「各分野の知識・技能，汎用的技能，態度・志向性を問題解決に適用」の下側を通って弧を描く太い矢印が、右上の「解の創造，実現」へ上向きに伸びている。汎用的技能の枠内では、「コミュニケーションスキル」から「チームワークとリーダーシップ」へ、「情報収集・活用発信力」と「思考力」から「課題発見力」「問題解決力」の箱へ矢印が向かう。態度・志向性の枠内では、下中央の「自己理解」から、上に並ぶ「主体性」「自己管理と責任ある行動」「倫理観」「キャリアデザイン」「継続的な学習と学びの目的」の5つへ黄色の矢印が伸びている。
fig-024-1: |
  左側に「MCC到達目標の全体構成」と題した大きな枠があり、その中に、上部の緑の枠「MCC(モデル)：創造性・デザイン能力」（「創造性」「エンジニアリングデザイン能力」）、左下のオレンジの枠「MCC(モデル)：基盤的資質・能力」、右側の青い枠「MCC(コア)（知識・技能）」が配置されている。オレンジの枠は「汎用的技能」と「態度・志向性」の2つの点線の区画に分かれ、「態度・志向性」の区画は青い枠の下まで横に広がっている。青い枠は「基礎的能力」（「数学」「自然科学」「人文・社会科学」「工学基礎」）と「分野別専門能力」（「分野別専門工学」「分野別実験実習能力」）の2つの点線の区画からなる。図の右側には緑・青・オレンジの枠線を持つ3つの説明の箱が上から並び、それぞれ線で左側の同じ色の枠に結ばれて、各区分の位置づけを文章で説明している。
fig-026-1: |
  左に「改訂版ブルーム・タキソノミー」の表があり、「Level 1 知識・記憶」から「Level 6 創造」までが下から上へ6段に積まれ、各段に説明文が付いている。中央には「MCCにおける到達水準」の表があり、「Level 1 知識・記憶」「Level 2 理解」「Level 3 適用」「Level 4 実践」が下から上へ4段に積まれ、Level 4 は黄色、Level 1〜3 は青系の色で塗られている。左の表の Level 4〜6 の3段から引かれた線が、中央の表の Level 4 に集まっている。中央の表の上には上向きの白抜き矢印があり、その先に「卒業後の人財像」の箱がある。中央の表の右側には上向きの矢印が3本あり、それぞれ「基礎的能力」「分野別専門的能力」「本科卒業生が到達すべき水準」と書かれ、最も短い「基礎的能力」は Level 3 の高さまで、他の2本は Level 4 の高さまで達している。最下部には、高専が改訂版ブルームタキソノミーのレベル4〜6を射程に入れた到達目標水準を設定していることを述べる注記がある。
fig-028-1: |
  中段に横一列で、「MCC(コア)到達水準イメージ」のラベル、「Level 1 知識・記憶」から「Level 4 実践」までの4つの箱、右端の「育成を目指す人財像」の箱が並ぶ。Level 2 と Level 3 は青い枠で囲まれて上の「基礎的能力 本科の到達水準」のラベルから下向きの矢印が指し、Level 4 は緑の枠で囲まれて「分野別専門的能力 本科の到達水準」のラベルから下向きの矢印が指している。左上の「MCC(コア)到達目標」の箱（「レベル2，3相当の到達水準として規定」、「分野別専門的能力」「基礎的能力」）は青い線で青い枠に、右上の「MCC(モデル)到達目標」の箱（「創造性・デザイン能力」）は緑の線で緑の枠に結ばれている。Level 1〜4 の下にはオレンジの波括弧があり、その下に「MCC(モデル)到達目標」（「基盤的資質・能力」）の箱と「さまざまな学習機会を通して卒業までに到達水準への達成を図る。」の文が置かれ、人財像の箱の下には「高専卒業後の学習、実務経験を通して到達する水準」と書かれた括弧がある。最下部の「カリキュラム設計モデル」では、「講義 実験・実習等」（青）と「社会実装教育 PBL等」（緑）の凡例の右に、青の点線の区画で3つの青い円が矢印でつながり、緑の点線の区画が3つ目の青い円と、矢印でつながった2つの緑の円を囲んでいる。右側には赤い点線の枠の注記と、カリキュラム設計について説明する箱がある。
fig-029-1: |
  上部の青い点線の枠「各高専の質保証に向けた活動」の中に、「Plan」「Do」「Check」「Action」の4つの箱が左から右へ並んで右向きの矢印で順につながり、Action から上部を回って Plan に戻る太い青い矢印がある。Plan の箱には「育成する人財像」「ディプロマポリシー」「カリキュラムポリシー」「カリキュラム編成」「シラバス」が上から下へ矢印でつながって並ぶ。Do・Check・Action の箱にはそれぞれの取組みの項目（「各高専の教育実践」「学修成果の測定・評価」「DP、CPの見直し」など）が並び、各箱の下部に説明文がある。下部の赤い点線の枠「国立高専機構」の中には、「Webシラバス」「教材共有」「CBT」「各種研修等」などの箱が Plan〜Action の各列の下に置かれてオレンジの縦線で上の各箱と結ばれ、その下にある「MCC」の箱からは「Webシラバス」の列と「CBT」の列へ線が伸びている。右側の緑の枠「国立高専教育国際標準(KIS)」には評価・認定に関する説明があり、そこから伸びる緑の線の先に、上の青い点線の枠を指す矢印と「評価，認定を通した質保証の向上」の文字がある。
fig-031-1: |
  左上の「【各高専】」の枠の中に「育成する人財像」「ディプロマポリシー」「カリキュラムポリシー」の3つの箱が上から下へ並び、下向きの矢印で順につながっている。「育成する人財像」と「ディプロマポリシー」の2つの箱から出た線が1本にまとまり、右上の説明の箱に結ばれている。この説明の箱は、各高専がディプロマポリシーを具体的かつ明確に定めることを述べ、末尾に「（教学マネジメント指針）」と出典が記されている。下部には「具体的かつ明確な卒業認定方針策定の際にモデルコアカリキュラムを準拠基準，指針として活用する。」を見出しとする横長の箱があり、「≪MCC（コア）≫」と「≪MCC（モデル）≫」のそれぞれについて活用の仕方が箇条書きされている。下部の箱から右上の説明の箱へ上向きの白抜き矢印があり、その横に「各高専のDPが社会的妥当性を備えていることを担保」と書かれている。
fig-032-1: |
  右側に「高専DPの基本的考え方二次案」の枠があり、丸囲みの番号1〜4の4つの項目が上から並ぶ。左上には「高専DP：」の見出しで3つの箇条書きの注記があり、その下に MCC との対応を書いた5つの箱が上から並ぶ。各箱から右の項目へ線が引かれており、「MCC（コア）（基礎的能力）に対応」は項目1へ、「MCC（コア）（分野別専門能力）に対応」は項目2へ結ばれている。「MCC（モデル）（創造性・デザイン能力）に対応。」の箱は項目2のうち下線が引かれた「その知識を社会実装に応用・実践できる力を身に付けていること」の部分へ、「MCC（モデル）（基盤的資質・能力）に対応。」の箱は項目3と項目4へ線で結ばれている。最下段の「MCC（コア）（基礎的能力：工学基礎グローバリゼーション・異文化理解）に対応」の箱は、項目4のうち下線が引かれた「国際的素養も有し」の部分へ結ばれている。
fig-034-1: |
  左上の「【各高専】」の枠の中に「育成する人財像」「ディプロマポリシー」「カリキュラムポリシー」の3つの箱が上から下へ並び、下向きの矢印で順につながっている。「ディプロマポリシー」と「カリキュラムポリシー」の2つの箱から出た線が1本にまとまり、右上の説明の箱に結ばれている。この説明の箱は、カリキュラムポリシーに基づくカリキュラムの編成について述べ、カリキュラムマップやカリキュラムツリーに関する注記と「（教学マネジメント指針）」の出典が記されている。下部には「カリキュラム編成とモデルコアカリキュラム」を見出しとする横長の箱があり、「≪MCC（コア）≫」と「≪MCC（モデル）≫」のそれぞれについて、カリキュラム編成での扱いが箇条書きされている。
fig-036-1: |
  「各高専のディプロマポリシー、カリキュラムポリシー」と題した大きな枠の中に、「育成する人財像」（オレンジ）、「ディプロマポリシー」（緑）、「カリキュラムポリシー」（紺）の3つの箱が上から下へ並び、下向きの矢印でつながっている。「ディプロマポリシー」の下には、右に字下げした「学習教育到達目標」の箱が矢印で枝分かれして置かれ、この2つの箱は緑の点線で一緒に囲まれている。同じように「カリキュラムポリシー」の下には、右に字下げした「カリキュラム」の箱が矢印で枝分かれして置かれている。各箱には、それが何を示すかの説明文が入っている。枠の右側には赤い枠の注記が2つあり、上の注記は赤い線で「学習教育到達目標」の箱に、下の注記は「カリキュラム」の箱に結ばれている。
fig-037-1: |
  左側に「MCC到達目標の全体構成」の図があり、「MCC(モデル)：創造性・デザイン能力」「MCC(モデル)：基盤的資質・能力」「MCC(コア)（知識・技能）」の3つの枠とその中の要素が描かれている。右上には紺の枠「科目の到達目標」があり、「対象分野の知識・技能」と「汎用的技能や態度・志向性」の2つの区画を含む。「対象分野の知識・技能」の区画からは青い矢印が左の「MCC(コア)（知識・技能）」の枠へ、「汎用的技能や態度・志向性」の区画からはオレンジの矢印が左の「態度・志向性」の区画の右端へ向かっている。右下には、科目の到達目標として検討する内容として「汎用的技能」「態度・志向性」と、振り返り（メタ認知）を通して育成を検討する「自己理解」「キャリアデザイン」「継続的な学習と学びの目的」が箇条書きされている。
fig-038-1: |
  左側に「MCC到達目標の全体構成」の図があり、「MCC(モデル)：創造性・デザイン能力」「MCC(モデル)：基盤的資質・能力」「MCC(コア)（知識・技能）」の3つの枠とその中の要素が描かれている。右側の紺の枠「科目の到達目標」には3つの区画があり、上の2つはどちらも「対象分野の知識・技能」、3つ目は「汎用的技能や態度・志向性」という見出しを持つ。1つ目の区画（MCC(モデル)を指針とする到達目標）からは緑の矢印が左の「MCC(モデル)：創造性・デザイン能力」の枠へ、2つ目の区画（MCC(コア)を含む到達目標）からは青い矢印が「MCC(コア)（知識・技能）」の枠へ、3つ目の区画からはオレンジの矢印が「態度・志向性」の区画の右端へ向かっている。右下には、問題解決、課題達成に取り組む PBL 等を通して育成する到達目標の設定と、その際に参照する MCC(モデル) について説明する文がある。
fig-039-1: |
  左上の「知識の教育」と右上の「知恵の教育」の2つの札があり、中央下の「なっとく」と書かれた楕円（中に「分かる」の箱）に向かって両側から矢印が集まる構成の図。左側では、「知識の教育」から白抜き矢印が楕円「知る」を指し、青い曲線が雲形の「頭で使ってみる」の脇を通って楕円「考える」（「*AL-PBL」の添え書き）に至り、「なっとく」の楕円へ続いている。「考える」の下には「言葉で論理的に理解した知識」の箱があり、上向きの矢印が添えられている。右側には楕円「実物作業」と立方体「手で使ってみる」（「* PBL・実験」の添え書き）があり、オレンジの曲線と「実体験で見出した知恵」の箱からの矢印が「なっとく」の楕円へ向かい、「なっとく」の付近から太い青い矢印が立方体へ向かっている。「なっとく」の楕円からは右向きの白抜き矢印が、オレンジの円「広く深く理解して自由自在に使える」へ伸びている。「知る」から右へ伸びる灰色の帯など、一部の矢印のつながりは判読できない。
fig-039-2: |
  上部に「創造性の涵養への取組」の題と「（工場・実験室・教室・図書館・・・家でも可能）」の添え書きがあり、その下に「Problem Based Learning（PBL）」と「（技術者の日常の仕事）」が書かれている。中央には「課題」「発見」「総合」の3つの円が三角形に配置され、緑の曲線の矢印で「課題」→「発見」→「総合」→「課題」の順に循環している。「課題」の上には「start」の文字があり、短い矢印で「課題」を指している。「課題」から「発見」への矢印の脇には「既習知識での試行」と「不可能と判断」、「発見」の右下には「不足情報の探索（アイディアが必要）」、「発見」から「総合」への矢印の脇には「学習方法」、「総合」の左下には「情報の融合（着想・連想・想像）」、「総合」から「課題」への矢印の脇には「解決の喜び」が添えられている。
