    - 【教育領域の到達目標】
    - 1 目標
    - 実験・実習系領域では、電気電子に関する各種の計測、試験法等についての技術を習得するとともに、専門科
    - 目について学習した内容を、実験を通して理解し、整理することを目標とする。
    - (1) 実験装置・器具・情報機器等を利用して目的を達成する手法を実践できる。
    - (2) 実験を通じて工学の基礎に係わる知識を整理できる。
    - (3) 実験から得られたデータについて工学的に考察し、説明できる。
