  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 化学の基本知識を修得し、自らの工学分野に応用できる。さらに、その過程で、自然現象を系統的・論理的に
    - 考えていく能力を養い、広く自然の諸現象を科学的に解明するための化学的な見方、考え方を身に付ける。
    - 2 学習内容の取扱い
    - (1) 科学技術の進歩に対応し、その理解のために必要となる基礎的な知識を修得できるよう工夫する。
    - (2) 実験や観察を通して化学現象を理解し、考察する力を育てることにも留意する。
    - 3 一般的な科目名
    - 化学
