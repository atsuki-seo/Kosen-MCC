  name: 英語
  heading_raw: 2-3.1 III-B 英語
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - (1) 英語コミュニケーションの基礎となる知識や技能を習得し、目的や場面、状況に応じて適切に活用できる。
    - （1～5年次）
    - (2) 多様性や異文化への理解を深め、相手に配慮しながら英語を用いて主体的にコミュニケーションを図ろう
    - とすることができる。（1～5年次）
    - (3) 日常的な話題や社会的な話題について、情報や考えなどを適切かつ正確に理解、表現できる。（1～3年次）
    - (4) 自分の専門分野に関する基本的な情報や考えについて、適切かつ正確に理解、表現し、簡単な意見交換が
    - できる。(3～5年次)
    - 2 学習内容の取扱い
    - (1) 英語コミュニケーション能力の向上のためには「英語」とそれ以外の授業科目が連携すること、また、様々
    - な「実際のコミュニケーションの機会」を作り出すことが重要である。例えば、英文アブストラクトや実験報
    - 告の書式、及び報告すべき内容の整理などについては、専門科目と連携して教育内容を精査することで、より
    - 実際に近いコミュニケーションの場面が再現できるものと期待する。いずれにしても、実際の場面でのコミュ
    - ニケーションを目的にした学習が実現できるよう、他の科目も含めた総合的なカリキュラムデザインが望まれ
    - る。
    - (2) 口頭発表の質疑応答やディベート、ディスカッションは英語コミュニケーションの実践としては非常に高
    - い能力が要求される。本科卒業時にはその能力の「完成」というより「準備・基礎」が到達目標の意図すると
    - ころであると理解されたい。
    - (3) 英語を実際の場面でのコミュニケーションに応用するには、基礎的な知識を習得しておくことに加え、相
    - 手の文化や立場を尊重した上で積極的にコミュニケーションをとろうとする姿勢を持つことが重要である。今
    - 回の到達目標におけるそうした要素は教室の中だけでなく、短期・中期の国際交流の場面（機会）を有効利用
    - することでより効果が上がるものと考える。
    - (4) 到達目標はコアを示したものであり、それ以外の学習内容（例えば英会話やアカデミックライティング、
    - ビジネス英語など）も必要に応じて積極的に取り入れられたい。
    - 3 一般的な科目名
    - 英語（Ⅰ～Ⅴ）、英語コミュニケーション（Ⅰ～Ⅴ）、英語表現、総合英語等
    pages_pdf:
    - 60
