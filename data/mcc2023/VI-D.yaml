  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 実験・実習系領域では、情報工学に関する基本的な知識や技術を実験実習や机上での演習を通じて、体験的に
    - 習得することを目標とする。
    - (1) プログラミング基礎実習分野では、ソフトウェアの標準的な開発ツールや開発環境の利用経験を通じて、
    - 簡単なソフトウェアの生成とその動作確認ができる。
    - (2) 論理回路設計実習では、簡単な組合せ論理回路と順序回路を設計できる。
    - (3) 開発環境構築実習では、目的に合った開発環境の利用及び構築ができる。
    - (4) アプリケーションの設計と製作では、仕様に合ったプログラムを作成し、実行結果を得ることができる。
    - 2 一般的な科目名
    - 工学実験、ソフトウェア演習、論理回路
