  heading_raw: V-I-8 機械製図
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 専門分野の知識、技術を習得するため、演習と製図作業を中心に機械製図の基礎能力を身に付け、図面を正
    - しく読み作成する能力とを習得する。
    - 本領域では船舶機関士として必要な、図面から物の形状を把握する能力。作図する対象物の形状を把握して
    - 「迅速」「明瞭」「正確」に作図する能力を養う。
    - (1) 製図の基本を身につけ、図面上の線、記号、文字を用途に応じて正しく使い分けることができる。
    - (2) ボルト、歯車などの機械部品の製作図を作成できる。
    - (3) 立体図、文章から作図できる。
    - 2 一般的な科目名
    - 機械製図・設計製図
