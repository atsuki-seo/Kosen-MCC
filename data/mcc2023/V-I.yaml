  heading_raw: V-I-7 材料・船舶工学
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 材料・船舶工学系領域では、機械や構造物に外力が作用しているときに各部に生ずる応力や変形を明らかに
    - し、これらに見合う安全かつ経済的な材料の種類、形状や寸法を決定する知識・技術を習得し、それを実際
    - に船舶構造へ活用する能力を養うことを目標とする。さらに、機械や構造物の動的挙動に関する知識・技術
    - を習得し、それを実際に活用する能力を身に付けることも目標とする。
    - (1) 引張り、圧縮及びせん断について、応力やひずみ等を計算できる。
    - (2) はりの曲げについて、反力、せん断力、曲げモーメント、曲げ応力等を計算できる。
    - (3) 軸のねじりについて計算できる。
    - (4) 各種金属材料について機械的性質、材料試験の測定原理、熱処理を説明できる。
    - (5) 船体各部の名称、構造及び主要寸法などについて説明できる。
