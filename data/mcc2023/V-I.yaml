    - 【教育領域の到達目標】
    - 1 目標
    - 熱・流体工学系領域では、主機・補機・船体の運動など熱と流体が関連し合うシステムの諸原理を基礎とし
    - て理解することを目的とする。また、船体に働く流体による力と推進装置をコアとして説明できる能力の養
    - 成を目標とする。
    - (1) 熱力学に関する基礎概念について説明でき、応用分野に適用させることができる。
    - (2) 流体の性質について理解し、船体に働く諸作用について説明できる。
    - (3) 推進装置(船尾管含む)について理解し説明できる。
    - 2 一般的な科目名
    - 伝熱工学、熱工学、流体機械、流体力学、水力学
