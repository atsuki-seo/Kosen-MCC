- id: mcc2023:V-I-2
  type: area
  parent: mcc2023:V-I
  code: V-I-2
  name: 蒸気工学
  heading_raw: V-I-2 蒸気工学
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 蒸気工学系領域では、蒸気動力プラントに関する知識・技術を習得することを目標とする。特に、蒸気動力
    - プラントの中でも蒸気発生源及び動力発生源として用いられる「ボイラ」・「蒸気タービン」に着目し、ボ
    - イラ・蒸気タービン及び関連装置の構造、性能、保全など、蒸気動力プラントを安全に運転・管理するため
    - に必要な基礎的な能力を養うことを目標とする。
    - (1) ボイラ及び関連装置の構造及び作用を説明できる。
    - (2) ボイラの運転、保全及び安全な取扱いについて説明できる。
    - (3) 蒸気動力プラントの構成機器及びプラントの概要を説明できる。
    - (4) 蒸気動力プラントの熱サイクル及び熱効率を説明できる。
    - (5) 蒸気タービン及び関連装置の構造及び作用を説明できる。
    - (6) 蒸気タービン及び関連装置の運転、保全及び安全な取扱いについて説明できる。
    - 2 一般的な科目名
    - 蒸気工学、蒸気原動機工学、伝熱工学
    pages_pdf:
    - 121
  source:
    page_pdf: 121
    page_printed: 107
  verification: machine
