- id: mcc2023:V-I-3
  type: area
  parent: mcc2023:V-I
  code: V-I-3
  name: 補助機械工学
  heading_raw: V-I-3 補助機械工学
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 補助機械工学系領域では、船舶運航に携わる補助機械一般のうち、流体工学や熱工学を基礎とした流体機械
    - と冷凍機の取扱いを行うために必要な基礎的な能力を養うことを目標とする。
    - 船舶での補助機械は、推進に直接関わる主機や電気関係機器以外の機器を指し、種類は非常に多く、様々な
    - 機構を含む。これらの舶用補助機械全般を知識として理解した上で、コアとしてポンプ、冷凍機を取り扱う
    - ために必要な基礎的な能力を養うことを目標とする。
    - (1) ポンプや冷凍機などの流体機械の構造及び作用を説明できる。
    - (2) ポンプや冷凍機などの流体機械の運転、保全及び取扱いについて説明できる。
    - 2 一般的な科目名
    - 流体力学、水力学、流体機械
    pages_pdf:
    - 122
  source:
    page_pdf: 122
    page_printed: 108
  verification: machine
