  heading_raw: V-I-6 制御工学
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 制御工学による技術は航空機や船舶などの乗り物、製造業の機械装置など、社会や産業から家庭用の電気製
    - 品に至るまで、あらゆる分野に実用されている。
    - また、その制御技術には必ず測る、つまり計測技術が伴う。したがって、制御では計測が伴わなければ制御
    - は不可能である。そのため、自動制御の基礎概念、制御装置の仕組み（センサ、調節計、操作端）と原理
    - や、制御に必要となる計測に関する機器や数値処理について学び、計測制御に必要な力を身に付けることを
    - 目標としている。
    - (1) 物理量と単位系の構成を説明できる。
    - (2) 基本的な測定器の動作原理を説明できる。
    - (3) シーケンス図を読み解くことができる。
    - (4) フィードバック制御系の構成要素と基本的な働きが説明できる。
    - 2 一般的な科目名
