- id: mcc2023:V-G-4
  type: area
  parent: mcc2023:V-G
  code: V-G-4
  name: 計画・歴史
  heading_raw: V-G-4 計画・歴史
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 計画・歴史（建築）系領域は、西洋や日本における、原始から現代までの建築様式の変化を理解するととも
    - に、時代ごとの社会世情、交通手段、及び生活感の変化を前提として、社会の中の都市、都市の中の建築、建
    - 築の中の住生活という体系を理解する領域である。
    - (1) 都市計画分野では、社会構造変化（産業革命、交通の変化）に応じた都市形成の変遷・変化などについ
    - て、諸外国の例と日本における法制度について説明できる。
    - (2) 建築計画分野では、人の寸法（モジュール）について理解するとともに、建築の用途別に必要な機能、ゾ
    - ーニングや動線計画を理解しており、建築設計に活用できる。
    - (3) 歴史分野では、社会の変化に伴う建築への要求の変化と社会的課題に対する解決として、構法の発展及び
    - 建築構成の理論の側面から、各時代の建築様式を説明できる。
    - 2 一般的な科目名
    - 都市計画、地域計画、建築計画、建築史、都市史、近代建築論
    pages_pdf:
    - 113
  source:
    page_pdf: 113
    page_printed: 99
  verification: machine
