- id: mcc2023:V-G-5
  type: area
  parent: mcc2023:V-G
  code: V-G-5
  name: 施工・法規
  heading_raw: V-G-5 施工・法規
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 建築施工・法規系領域は、請負契約、準備工事、躯体工事、仕上げ（内外装）工事の流れについて理解すると
    - ともに、建築基準法及び関連法令の定義、運用方法などについて理解する領域である。
    - (1) 施工分野では、木造、鉄筋コンクリート造、鋼構造、及び鉄骨鉄筋コンクリート造の建築物を建設するた
    - めの、施工の手順（工種）、方法（構・工法）を理解し、Q（品質）、C（コスト）、D（工程）、S（安
    - 全）、E（環境）の各項目の管理、及び届出について説明できる。
    - (2) 法規分野では、法体系を理解し、建築基準法を中心とした関係法令を用い、建築物及び都市計画の設計又
    - は計画に活用することができる。
    - 2 一般的な科目名
    - 建築施工、建築法規、一般構造、建築概論、建築構造、都市計画
    pages_pdf:
    - 114
  source:
    page_pdf: 114
    page_printed: 100
  verification: machine
