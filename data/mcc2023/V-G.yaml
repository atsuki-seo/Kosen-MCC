  name: 材料
  heading_raw: V-G-1 材料
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 材料（建築）領域は、建築物に使用される主な材料の製造方法、組成、性質等を理解し、使用目的に応じて適
    - 切に材料を選定し、計画的、経済的に材料を活用することができる能力を養う領域である。
    - (1) 構造材料分野（木、コンクリート、金属）では、特に構造性能について理解するとともに、要求される性
    - 能を発揮するために必要な要因について説明できること。
    - (2) 仕上げ材料分野（内装、外装）では、多くの仕上げ材料を適切に選定するために、機能性と適用環境につ
    - いて説明できる。
    - 2 一般的な科目名
    - 建築材料、建築構造、建築概論、一般構造
    pages_pdf:
    - 110
  source:
    page_pdf: 110
    page_printed: 96
  verification: machine
