  code: V-G-2
  name: 構造
  heading_raw: V-G-2 構造
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 構造系領域は、力学などの科目を基礎に各種骨組構造物の設計を行うための計算理論を学ぶ領域である。
    - (1) 力学分野では、建築構造物に作用する荷重に対し、反力や構造物内部に生じる応力及び変形を計算でき
    - る。
    - (2) 各種構造分野（鋼構造、鉄筋コンクリート構造、木構造など）では、各種材料の力学的特性、及び、変形
    - 特性、各種構造物の仕組み、設計・計算手順を説明できる。
    - 2 一般的な科目名
    - 構造力学、基礎力学、材料力学、建築一般構造、建築構造計画、鉄筋コンクリート構造、鋼構造
    pages_pdf:
    - 110
  source:
    page_pdf: 110
    page_printed: 96
  verification: machine
