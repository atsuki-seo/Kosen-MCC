- id: mcc2023:V-G-3
  type: area
  parent: mcc2023:V-G
  code: V-G-3
  name: 環境・設備
  heading_raw: V-G-3 環境・設備
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 建築環境・設備系領域は、建築を取り巻く自然現象について理解し、健康で、快適な環境を得るための方策に
    - ついて習得し、建築設計に活用するための領域である。
    - (1) 建築環境分野では、日本又は建設地域の風土を理解し、環境に適応した建築について理解するとともに、
    - 熱・光・音・空気環境について、環境要素を用いることができ、環境共生型の社会を前提として、健康で、快
    - 適な住環境を得るための手法について説明できる。
    - (2) 建築設備分野では、環境共生型の社会を前提として、給排水、空調、電気などの方策を用い、健康で、快
    - 適な住環境を得るための手法について説明できる。
    - 2 一般的な科目名
    - 建築環境工学、建築設備、建築環境実習・演習
    pages_pdf:
    - 112
  source:
    page_pdf: 112
    page_printed: 98
  verification: machine
