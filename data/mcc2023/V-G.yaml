- id: mcc2023:V-G-6
  type: area
  parent: mcc2023:V-G
  code: V-G-6
  name: 設計・製図
  heading_raw: V-G-6 設計・製図
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 製図系領域は、製図用具の特性、各種線種の意味、縮尺の概念を理解した上で、各種建築物を自由な発想で設
    - 計・デザインし、関係者と情報を共有できるよう図面化する領域である。
    - (1) 図学分野では、製図用具を使用し、手書きにより線の描き分け、寸法・文字の記入方法、建築物の表現・
    - 投影方法について説明できる。
    - (2) CAD分野では、ソフトウェアの基本的な操作方法を理解し、図面の作成、修正、印刷ができる。
    - (3) 設計製図分野では、指定された条件に基づき、自由な発想で各種建築物の設計・デザインを行うことがで
    - き、設計趣旨などをプレゼンテーションできること。
    - 2 一般的な科目名
    - 図学、製図、設計製図、CAD・CG、設計演習
    pages_pdf:
    - 116
  notes:
  - label: 注１
    text: 上記以外の観点として、集合住宅、商業建築などの課題もあると良い。
    page: 116
  source:
    page_pdf: 116
    page_printed: 102
  verification: machine
