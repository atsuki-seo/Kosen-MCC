  name: ロボット
  heading_raw: 2-2.3 ロボット
  description:
    lines:
    - 【事業概要】
    - ロボット大国として発展してきたわが国では、慢性的な労働力不足が今後予測される状況で、
    - 多品種少量生産への生産形態シフト、ロボットへのニーズの多様化など生産の基盤となるロボッ
    - ト技術の難易度が高まっており、これを支える人財育成が喫緊の課題となっている。こうした社
    - 会的要請に応えるキーパーソンとなる SIer（システムインテグレータ）育成を図る教育内容、教
    - 育方法の開発を行う。
    - 【育成する人財像及び到達目標（スキルセット）】
    - デジタルものづくりができる人財（DX）、ロボットの社会実装ができる人財（RX）に必要な知
    - 識、技術を整理し、到達目標群（スキルセット）を定めている。
    - 【詳細情報】
    - （現在構築中）
    - 【ロボット分野の到達目標群（スキルセット）】
    pages_pdf:
    - 168
