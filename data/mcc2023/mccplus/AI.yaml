  name: AI・数理データサイエンス
  heading_raw: 2-2.1 COMPASS 5.0：AI・数理データサイエンス
  description:
    lines:
    - 【事業概要】
    - Society 5.0の実現に向け、社会全体のDXを加速させ、AIの社会実装をさらに進める必要があ
    - る。そのためにはAI・数理データサイエンスの素養を身に付けた人材の育成・確保が喫緊の課題
    - となっている。15歳からの早期専門教育、問題解決、課題達成を図る教育を通した、ICTのハー
    - ドウェアやソフトウェアに関するスキルを応用できる能力を修得した高専生を育成するために教
    - 育内容、教育方法の開発を行っている。
    - 【育成する人財像及び到達目標（スキルセット）】
    - あらゆる分野における人財がAI・数理データサイエンスに関する基本的な知識、能力を修得し
    - ていることを基盤として、AI・数理データを専門分野で活用できる人財、さらに研究者や起業家
    - などのトップレベルの人財に求められる到達目標群（スキルセット）を定めている。
    - 【詳細情報】
    - 高専発! 「Society 5.0型未来技術人財」育成事業 COMPASS 5.0 AI・数理データサイエンス分野
    - https://k-dash.nc-toyama.ac.jp/
    - 【AI・数理データサイエンス分野の到達目標群（スキルセット）】
    pages_pdf:
    - 158
  source:
    page_pdf: 158
    page_printed: 142
  verification: machine
