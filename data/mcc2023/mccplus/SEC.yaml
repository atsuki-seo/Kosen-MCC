  code_defined_by: this-repository
  name: サイバーセキュリティ
  heading_raw: 2-2.2 COMPASS 5.0：サイバーセキュリティ
  description:
    lines:
    - 【事業概要】
    - 個人の活動や企業活動、行政サービスなどあらゆる分野の基盤となるのがIT（インターネット・
    - テクノロジー）である。一方でこの社会基盤に対するサイバー攻撃は多様に進化し、その影響は
    - 極めて深刻な状況となっている。社会基盤であるITを悪質な攻撃や脅威から守るために、サイバ
    - ーセキュリティの高度なスキルを持つ人材が求められている。このような人財育成のために教育
    - 内容、教育方法の開発を行っている。
    - 【育成する人財像及び到達目標（スキルセット）】
    - あらゆる分野における人財がセキュリティ意識や基本的技術を修得しているということを基盤
    - として、それぞれの専門分野でセキュリティ技術を応用できる人財、社会で必要とされるサイバ
    - ーセキュリティ技術を修得した情報系技術者、さらにトップ人財としてのセキュリティ専門技術
    - 者に必要な到達目標群（スキルセット）を定めている。
    - 【詳細情報】
    - 独立行政法人国立高等専門学校機構サイバーセキュリティ人材育成事業
    - https://k-sec.kochi-ct.ac.jp/index.html
    - 【サイバーセキュリティ分野の到達目標群（スキルセット）】
    pages_pdf:
    - 163
  source:
    page_pdf: 163
    page_printed: 147
  verification: machine
