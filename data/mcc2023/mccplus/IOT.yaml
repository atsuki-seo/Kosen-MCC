  code: IOT
  code_defined_by: this-repository
  name: IoT
  heading_raw: 2-2.4 IoT
  description:
    lines:
    - 【事業概要】
    - IoT は蓄積データより創出された高付加価値サービスを社会へ還元するために重要な技術であ
    - る。IoT データの利活用を前提に、サイバー空間でのデータ分析・解析結果をフィジカル空間に
    - フィードバックするサイバーフィジカルシステムを理解し、かつビジネス的素養を備えた人財育
    - 成を促進するために教育内容、教材開発を行っている。
    - 【育成する人財像及び到達目標（スキルセット）】
    - あらゆる分野におけるIoT に関する基本的知識、スキルの修得を基盤として、電気・電子・情
    - 報系専門分野の人財が修得すべき能力についてIoT データを収集・可視化・分析し、フィードバ
    - ックできる能力、IoT を活用して課題解決に繋げる能力、それぞれの専門分野で IoT を応用・競
    - 争し、CPSに適用できる視点と実践力と整理し、到達目標（スキルセット）を定めている。
    - 【詳細情報】
    - 高専発! 「Society 5.0型未来人財」育成事業 次世代基盤技術教育のカリキュラム化 IoT分野
    - https://www.sendai-nct.ac.jp/compass5/
    - 【IoT分野の到達目標群（スキルセット）】
    pages_pdf:
    - 174
  source:
    page_pdf: 174
    page_printed: 158
  verification: machine
