  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 工学の基本的問題を解決するために必要な数学の知識、計算技術及び応用能力を習得し、この知識及び技術等
    - を工学における現象と関連づけて活用する能力を養う。
    - 2 学習内容の取扱い
    - 学習内容の取扱いに関しては、次の事項に配慮するものとする。
    - （１）中学校の学習の成果を活用するとともに、専攻科数学及び物理・専門科目との連携を密にし、スムーズ
    - にカリキュラムが展開するように指導計画を作成する。
    - （２）学習内容の履修学年については特に指定せず、高専毎の独自のカリキュラム設計に沿って柔軟に運用す
    - る。
    - （３）学習内容の専門科目での履修を妨げるものではない。
    - （４）下記以外の学習内容を取り扱うことを妨げるものではない。
    pages_pdf:
    - 49
