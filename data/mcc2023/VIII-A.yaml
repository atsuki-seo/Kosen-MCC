  name: 自己理解
  heading_raw: 4-2.1 VIII-A 自己理解
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 知識だけでなく、判断や行動の根底にある学習者の価値観や態度、特性、傾向性に関わる領域を示している。
    - 「主体性」、「自己理解」、「自己管理と責任ある行動」、「倫理観」、「キャリアデザイン」及び「継続的な学修と
    - 学びの目的」を内容とする。様々な学修活動を通して、自分自身の価値観や態度、特性、傾向性等を把握し、
    - 学びや内省による変容を目標とする。
    - 2 授業設計の考え方
    - 汎用的技能と同様に、あらゆる科目で、その分野の知識・技能に加え、到達目標として望ましい行動特性など
    - を提示した上で、それを促進する学習内容を設定することを想定している。学生の学修活動や学修成果を反省
    - 的に認知させ、自らの特性を理解した上で、望ましい状態へと志向することを支援、促進する授業設計が望ま
    - れる。
    - 特に高等学校学習指導要領において学力の三要素として「知識・技能」「思考力・判断力・表現力」「学習に向
    - かう態度」が挙げられ、各科目においてこれらの学力の発達を促す授業設計が要求されていることを踏まえ、
    - 高等専門学校においても「基礎的能力」及び「分野別専門的能力」の各項目とこの領域に示す汎用的技能の伸
    - 長を図る授業設計を行うことが求められる。
