- id: mcc2023:V-B-7
  type: area
  parent: mcc2023:V-B
  code: V-B-7
  name: 無機材料
  heading_raw: V-B-7 無機材料
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 無機化学領域は原子の構造や結合状態などの物質の性質を理解し、無機材料、錯体化学などの基本的な事柄に
    - ついて説明できることを目標とする。
    - (1) 物質を構成する様々な元素の性質を理解し、それらの性質が電子の振る舞いによることを周期表と関連付
    - けて説明できる。
    - (2) 元素の組合せからなる無機元素及び化合物の構造、結合状態、性質について説明できる。
    - (3) 化学反応について理解し、反応熱、反応速度、電池反応を説明できる。
    - (4) 基本的な無機材料に関して用途、構造、合成反応等を説明できる。
    - ※無機材料領域のモデルコアカリキュラムについては、化学系無機化学領域の学習内容を参照してもよい。
    - 2 一般的な科目名
    - 化学、無機化学、無機材料、セラミックス材料、表面化学、電気化学
    pages_pdf:
    - 81
  source:
    page_pdf: 81
    page_printed: 67
  verification: machine
