    - 【教育領域の到達目標】
    - 1 目標
    - 材料物性領域は、材料の様々な物理現象を理解する上で必須となる電子の量子力学的挙動、それを反映した原
    - 子の構造、結晶構造に関する基礎知識を習得することを目標とする。
