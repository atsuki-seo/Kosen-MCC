- id: mcc2023:V-B-6
  type: area
  parent: mcc2023:V-B
  code: V-B-6
  name: 金属材料
  heading_raw: V-B-6 金属材料
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 金属材料領域は、工業分野で一般的に使用されている鉄鋼材料、非鉄金属材料及びそれら合金の基礎的性質並
    - びに熱処理による組織変化及び加工が性質に及ぼす影響を理解することを目標とする。
    - (1) 製銑及び製鋼工程について、原料並びに主設備、主な炉内反応を説明できる。
    - (2) 炭素鋼の状態図を理解して標準組織について説明できる。
    - (3) 炭素鋼や合金鋼の熱処理の目的及び熱処理に伴う組織と機械的性質の変化について説明できる。
    - (4) 非鉄金属材料の代表である銅、アルミニウム及びその合金の特徴を説明できる。
    - 2 一般的な科目名
    - 鉄鋼材料、非鉄材料、構成材料、材料組織学
    pages_pdf:
    - 80
  source:
    page_pdf: 80
    page_printed: 66
  verification: machine
