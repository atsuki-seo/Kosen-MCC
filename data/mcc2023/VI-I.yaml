  name: 商船系分野（機関）
  heading_raw: 3-2.9 VI-I 商船系分野（機関）
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 実験・実習系領域では、船舶機関士に必要な基礎知識・技術を習得し、船内機器の運転や保守管理に活用する
    - ために必要な基本的な能力を養うことを目標とする。
    - (1) 舶用諸機関及び各種工作機器の基本原理と操作方法を理解し、実験・実習を遂行できる。
    - (2) 実験・実習内容を理解し、レポートにまとめることができる。
    - (3) 航海当直、機関当直を通して船員としての基本を身につけること。
    - (4) 機関室内の主機及び補機器の取扱い等を理解して操作できる。
    - (5) 自ら（グループ）船舶を安全に運航できる。
    - 2 一般的な科目名
    - 実験実習、機関工学実験、校内練習船実習、漕艇通信
    pages_pdf:
    - 133
  source:
    page_pdf: 133
    page_printed: 119
  verification: machine
