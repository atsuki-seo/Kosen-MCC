  parent: mcc2023:IV-A:01
  text: 目的に応じて適切な実験手法を選択し、実験手順や実験装置・測定器等の使用方法を理解した上で、安全に実験を行うことができる。
  supplement:
    kind: 学習の目安となる項目
    raw: 自らの工学分野に関する基礎的な原理や現象を明らかにするための実験手法・実験手順の説明、実験装置や測定器の操作、実験器具・試薬・材料の正しい取扱い、安全な実験の実施
    items:
    - 自らの工学分野に関する基礎的な原理や現象を明らかにするための実験手法・実験手順の説明
    - 実験装置や測定器の操作
    - 実験器具・試薬・材料の正しい取扱い
    - 安全な実験の実施
