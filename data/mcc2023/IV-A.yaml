  name: 工学実験技術
  heading_raw: 2-4.1 IV-A 工学実験技術
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 工学実験技術は実験計画、安全にも配慮した実験実施、結果の整理と考察までの基本的かつ必須の到達目標で
    - ある。また、工学実験を実施する上で基本的な態度を身に付け実践できることも目標とする。
    - 工学分野における現象の観測や装置の性能評価を行う上で必要となる実験技術を身に付ける。併せて、安全な
    - 実験遂行、結果の整理と考察、報告書の作成方法を修得する。
    - (1) それぞれの工学分野に応じた各種測定器具の使用方法を理解した上で、適切に活用して安全に実験を行う
    - ことができる。
    - (2) 取得したデータを適切な方法で整理し、その結果に基づいた定量的・論理的な考察ができる。
    - (3) 実験目的・手法・結果及び考察した成果を報告書にまとめることができる。
    - (4) 実験を通して課題を解決する上で、基本的ルール（主体性・協調性・提出期限など）を守ることができる。
    - 2 一般的な科目名
    - 工学実験
