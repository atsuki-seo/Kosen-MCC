  text: 実験テーマの目的を理解し、適切な手法により取得したデータから近似曲線を求めるなど、グラフや図、表を用いて分かり易く効果的に表現することができる。
  supplement:
    kind: 学習の目安となる項目
    raw: 実験データの分析、誤差解析、有効桁数の評価、整理の仕方（最小二乗法などの近似曲線を含む）に配慮したデータ整理、情報技術のツールを活用した実験データの適切な形式での表現
    items:
