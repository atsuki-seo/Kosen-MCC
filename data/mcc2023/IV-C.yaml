  code: IV-C
  name: 情報リテラシー
  heading_raw: 2-4.3 IV-C 情報リテラシー
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 専門分野によらずセキュリティに配慮して情報を正しく取り扱い、情報技術を活用し、課題解決のための基本
    - 的なアルゴリズムを考えてプログラムを作成できることを目標とする。また、数理・データサイエンス・AI
    - を日常の生活、仕事等の場で使いこなすことができる基礎的素養を身に付け、自らの専門分野に応じてこれら
    - の知識・技能を説明し、活用できるようになることを目標とする。
    - (1) 情報を収集、処理、発信するための基本的なハードウェア、ソフトウェア、ネットワークに関する知識を
    - 活用できる。
    - (2) 特定の課題に対し、アルゴリズムを考え、記述できる。
    - (3) 情報セキュリティに配慮して情報を正しく取扱うことができる。
    - (4) 自らの専門分野に応じて情報技術の知識・技能を説明し、活用できる。
    - (5) 数理・データサイエンス・AIを使う素養を身に付ける。
    - 2 一般的な科目名
    - 情報リテラシー、プログラミング、情報、情報セキュリティ、情報基礎、基礎情報工学、情報・数理基礎、確
    - 率・統計、数理・データサイエンス、技術者倫理
    - ※その他の科目（数学、国語、社会、倫理系の科目など）での実践も十分考えられる。
    pages_pdf:
    - 66
  source:
    page_pdf: 66
    page_printed: 52
  verification: machine
