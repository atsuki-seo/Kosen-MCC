- id: mcc2023:IV-C:01.01
  type: goal
  parent: mcc2023:IV-C:01
  text: 社会の情報化の進展と課題について理解し説明できる。
  supplement:
    kind: 学習の目安となる項目
    raw: 社会基盤としての情報技術（社会のネットワーク化、デジタル化、IoT、移動体通信の発達、ビッグデータの蓄積と利用、知識のオープン化など、社会課題：サイバー犯罪、事故・不具合の影響、情報格差、法整備など）、情報化社会と個人（情報伝達共有の速さ、情報発信の容易性、個人情報のデジタル化運用など、課題：情報・知識の信頼性、情報漏洩、消去困難性、ネット依存、名誉棄損など）、社会構造の変化（Society 5.0、情報技術による産業形態の変化、デジタルものづくり、スマート農業など）
    items:
    - 社会基盤としての情報技術（社会のネットワーク化、デジタル化、IoT、移動体通信の発達、ビッグデータの蓄積と利用、知識のオープン化など、社会課題：サイバー犯罪、事故・不具合の影響、情報格差、法整備など）
    - 情報化社会と個人（情報伝達共有の速さ、情報発信の容易性、個人情報のデジタル化運用など、課題：情報・知識の信頼性、情報漏洩、消去困難性、ネット依存、名誉棄損など）
    - 社会構造の変化（Society 5.0、情報技術による産業形態の変化、デジタルものづくり、スマート農業など）
  note: null
  source:
