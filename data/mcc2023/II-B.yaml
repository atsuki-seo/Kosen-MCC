  name: 物理実験
  heading_raw: 2-2.2 II-B 物理実験
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 実験により自ら現象に触れることで、物理法則が実際に成り立っていることを確認するとともに、結果に対す
    - る考察を通して座学などで学習した知識を体系的に理解する。併せて、データ処理に関する基礎知識を身に付
    - ける。
    - (1) 実験の目的や原理、装置の取扱い方を理解した上で、手順に従って安全に実験を行い、測定結果を正確に
    - 記録できる。
    - (2) 実験データから、最確値や誤差などを求めることができる。
    - (3) 観察や実験結果から物理現象の特徴や規則性を見出し、座学などで学んだ内容と関連付けて説明できる。
    - 2 学習内容の取扱い
    - (1) 下に示す6分野の実験のうち、3分野以上の実験（演示実験を含む）を行う。
    - (2) ICTなどの活用や、少人数グループでの探究活動、発表などを積極的に取り入れることが推奨される。
    - (3) 実験の実施及び報告書の作成に際しては、IV-A工学実験技術（各種測定方法、データ処理、考察方法）の
    - 学習内容も考慮する。
    - 3 一般的な科目名
    - 物理、応用物理、物理実験、応用物理実験
