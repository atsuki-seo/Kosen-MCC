  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 観察・実験により座学などで学習した知識を確認し理解を深め、化学的な事物・現象についての関心や探究心
    - を高める。
    - (1) 実験器具や試薬などの取扱い方を理解した上で、安全に実験を行うことができる。
    - (2) 実験を正確に記録し、実験データを適切な有効数字及び単位などを用いて取り扱うことができる。
    - (3) 観察・実験結果を座学などで学んだ内容と関連付けて説明できる。
    - 2 学習内容の取扱い
    - (1) ICTなどの活用や、少人数グループでの探究活動、発表などを積極的に取り入れることが推奨される。
    - (2) 実験の実施及び報告書の作成に際しては、IV-A工学実験技術（各種測定方法、データ処理、考察方法）の
    - 学習内容も考慮する。
    - 3 一般的な科目名
    - 化学実験
