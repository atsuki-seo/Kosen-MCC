  name: 物理
  heading_raw: 2-2.1 II-A 物理
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 物理学の基本知識を習得し、自らの工学分野に応用できる。さらに、その過程で、自然現象を系統的・論理的
    - に考えていく能力を養い、広く自然の諸現象を科学的に解明するための物理的な見方、考え方を身に付ける。
    - (1) 物体の運動及びエネルギーに関する基礎的な計算をすることができる。
    - (2) 熱や波、電気に関する様々な現象を物理法則と関連付けて考えることができる。
    - 2 学習内容の取扱い
    - (1) 数学や専門科目との連携を密にして、各学習内容の履修学年及び順番を十分考慮し、スムーズにカリキュ
    - ラムが展開できるよう指導計画を作成する。
    - (2) 科学技術の進歩に対応し、その理解のために必要となる基礎的な知識を習得できるよう工夫する。
    - (3) 実験や観察を通して物理現象を理解し、考察する力を育てることにも留意する。
    - 3 一般的な科目名
    - 物理、応用物理
