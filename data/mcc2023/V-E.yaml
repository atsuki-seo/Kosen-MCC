  parent: mcc2023:V-E
  code: V-E-3
  name: 分析化学
  heading_raw: V-E-3 分析化学
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 化学、環境、材料開発、生物などあらゆる分野において必要な物質（原子、イオン、分子、単体、化合物な
    - ど）を分析するための理論や方法を学ぶ科目からなる教育領域である。
    - (1) 物理量の表現方法としての単位計算ができる。
    - (2) 化学反応（沈殿形成、錯体形成、電離など）や物理現象による状態変化について説明でき、必要な定量計
    - 算ができる。
    - (3) 標準的な機器分析の目的や特徴を理解し、分析対象に応じて選択できる。
    - なお、いくつかの達成目標は、分析実験や機器分析実験で、あるいはそれを併用することが理解（実践力の獲
    - 得）に有効である。
    - 2 一般的な科目名
    - 分析化学、機器分析
    pages_pdf:
    - 97
  source:
    page_pdf: 97
    page_printed: 83
  verification: machine
