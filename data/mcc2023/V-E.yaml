- id: mcc2023:V-E-4
  type: area
  parent: mcc2023:V-E
  code: V-E-4
  name: 物理化学
  heading_raw: V-E-4 物理化学
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 理論化学として物理化学の３本柱の構造・物性、平衡、速度論について理解する科目である。
    - 本科では熱力学を中心に物理化学の基本を学ぶ。
    - (1) 気体の性質を理解し、関連する計算ができる。
    - (2) 凝固点降下、沸点上昇、浸透圧等から溶質の分子量を計算できる。
    - (3) 熱力学の第一、第二、第三法則が説明でき、関連する計算ができる。
    - (4) 化学平衡が説明でき、関連する計算ができる。
    - (5) 反応速度が説明でき、関連する計算ができる。
    - (6) 代表的な化学電池について説明ができる。
    - (7) 量子化学の意義を理解し、役割を説明できる。
    - 2 一般的な科目名
    - 物理化学
    pages_pdf:
    - 98
  source:
    page_pdf: 98
    page_printed: 84
  verification: machine
