- id: mcc2023:V-E-6
  type: area
  parent: mcc2023:V-E
  code: V-E-6
  name: 生物化学
  heading_raw: V-E-6 生物化学
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 生物化学は生命現象と生体物質を化学によって説明する分野であり、近年発展の著しいバイオテクノロジーの
    - みならず、広く生物の関わる工業技術の基礎となる。生物化学は、生体物質の生物化学と、酵素と代謝に関す
    - る内容を含み、両方を関連付けて理解できることが必要である。以下の項目を達成することを目標とする。
    - (1) 炭水化物、タンパク質、核酸、脂質について、生体内での機能と化学構造・性質を結びつけて説明できる。
    - (2) 酵素の役割・性質、生体内における役割を理解するとともに、酵素反応速度論を基にミカエリス・メンテン
    - 式について説明できる。
    - (3) 代謝における物質の変化とエネルギーの出入りを結びつけて説明できる。
    - 2 一般的な科目名
    - 生物化学、生化学、基礎生物学
    pages_pdf:
    - 100
  source:
    page_pdf: 100
    page_printed: 86
  verification: machine
