- id: mcc2023:V-E-7
  type: area
  parent: mcc2023:V-E
  code: V-E-7
  name: 生物工学
  heading_raw: V-E-7 生物工学
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 生物工学の基礎として、細胞の構造、微生物の性質とその取扱い、代謝とその利用法、遺伝子工学について学
    - 習することを目標とする。
    - (1) 細胞小器官の種類と特徴を理解し、細胞の構造を説明できる。
    - (2) 生体の恒常性を維持するための仕組みを理解し、その応用技術について説明できる。
    - (3) 微生物の生育について理解し、培養方法について説明できる。
    - (4) 微生物や動植物細胞等の利用方法について説明できる
    - (5) 遺伝子工学の原理について理解し、その応用方法について説明できる。
    - 2 一般的な科目名
    - 基礎微生物学、生物工学、バイオテクノロジー
    pages_pdf:
    - 101
  source:
    page_pdf: 101
    page_printed: 87
  verification: machine
