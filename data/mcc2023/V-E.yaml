  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 有機材料となる化合物の性質や生命科学の現象を理解するための基礎となる有機化合物の構造とその性質・反
    - 応を学ぶ領域である。
    - (1) 有機化合物に関して、IUPACの命名法を使い、構造と名前を結びつけることができる。
    - (2) 代表的な官能基の性質を説明でき、その反応及び導入法を示すことができる。
    - (3) 代表的な高分子化合物の性質や合成法を説明できる。
    - 2 一般的な科目名
    - 有機化学、高分子化学
    pages_pdf:
    - 95
