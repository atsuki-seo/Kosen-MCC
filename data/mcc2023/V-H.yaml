- id: mcc2023:V-H-3
  type: area
  parent: mcc2023:V-H
  code: V-H-3
  name: 法規
  heading_raw: V-H-3 法規
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 法規系領域では、海上交通三法（海上衝突予防法・海上交通安全法・港則法）で定められる船舶を安全に運航
    - するために必要な法体系と、「船舶法」や「船舶安全法」のように船舶そのものに係る法、「船員法」のよう
    - に船員に係る法等に関する知識を習得し、法の知識を活用して船舶の安全運航及び船舶を運用管理する基礎能
    - 力を養うことを目標とする。
    - (1) 海上交通三法を総合的に理解し、海難衝突事例について関連する適用法規・条文を判断できる。
    - (2) 船舶法、船舶安全法等、船舶に関する法体系と規定について説明できる。
    - (3) 船員法等、船員に関する法体系と規定について説明できる。
    - (4) SOLAS条約やMARPOL条約等、海事関係条約について説明できる。
    - 2 一般的な科目名
    - 航海法規、海事法規
    pages_pdf:
    - 120
  source:
    page_pdf: 120
    page_printed: 106
  verification: machine
