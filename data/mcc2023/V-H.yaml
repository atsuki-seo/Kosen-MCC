- id: mcc2023:V-H-2
  type: area
  parent: mcc2023:V-H
  code: V-H-2
  name: 運用
  heading_raw: V-H-2 運用
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 運用系領域では、船舶運航者として必要な船舶の構造や設備、気象及び海象、操縦性能、貨物の積付けについ
    - て習得し、操船者として必要な能力を養うことを目標とする。
    - また、専門的な知識として、「船体構造」、「抵抗・推進」について習得することを目標とする。
    - (1) 船体要目船体を構成する構造・部材を説明できる。
    - (2) 船体の復原性について説明でき、復原性の観点から船体の安全性を評価できる。
    - (3) 気象及び海象にかかる用語及び現象について説明できる。
    - (4) 船舶の操縦性能及び外力や海域が及ぼす操船への影響を説明できる。
    - (5) 危険物輸送における安全上の留意点について説明できる。
    - 2 一般的な科目名
    - 船舶工学、 造船工学、 材料力学、 海事工学基礎、載貨論、 船舶安全工学、操船論、船体運動、海洋気象、
    - 海洋環境論、ライフサイエンス・アースサイエンス
    pages_pdf:
    - 118
  source:
    page_pdf: 118
    page_printed: 104
  verification: machine
