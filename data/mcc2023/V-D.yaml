  name: プログラミング
  heading_raw: V-D-1 プログラミング
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - プログラミング系領域は、プログラムの書き方、書かれたプログラムの読み方、ソフトウェア生成に必要なツ
    - ール類の仕組みと使い方を学習する領域である。
    - (1) プログラミング分野では、ソフトウェア作成に必要な基礎概念及びソフトウェアの作成工程を理解し、少
    - なくとも一つのプログラミング言語（言語処理系）を用いて簡単なソフトウェアを生成できること。
    - (2) プログラミング言語分野では、言語処理系を構成する各種ツールの役割や機能を理解しており、各種プロ
    - グラミング言語が意味付けに使われる計算モデルの違いにより分類されることを説明できる。
    - 2 一般的な科目名
    - プログラミング、プログラミング演習、プログラミング言語
    pages_pdf:
    - 90
  source:
