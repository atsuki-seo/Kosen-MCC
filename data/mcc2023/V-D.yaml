  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - ソフトウェア系領域は、問題を解決する手順という視点でソフトウェアを抽象化した概念であるアルゴリズム
    - とデータ構造について学ぶ領域である。
    - (1) アルゴリズム分野とデータ構造分野では、問題解決を効率よく行うにはアルゴリズムとデータ構造の選択
    - が重要であると説明できる
    - (2) 数値処理分野では、コンピュータ上で数値を表現したりする際に発生する誤差が処理結果に悪影響を与え
    - ることを説明できる。
    - 2 一般的な科目名
    - プログラミング、アルゴリズムとデータ構造、数値解析、数値計算
