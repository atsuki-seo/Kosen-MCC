- id: mcc2023:V-C-1
  type: area
  parent: mcc2023:V-C
  code: V-C-1
  name: 電気回路
  heading_raw: V-C-1 電気回路
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 電気回路系領域では、直流回路と交流回路の取扱い方や電気回路の過渡現象の解析方法を習得し、電気・電子
    - 工学を履修するのに必要な基本的な能力を養うことを目標とする。
    - (1) 抵抗、コイル、コンデンサ素子における電圧と電流の関係を理解し、電気回路の計算に用いることができ
    - る。
    - (2) キルヒホッフの法則や重ねの理等の定理を理解し、電気回路の計算に用いることができる。
    - (3) 瞬時値、フェーザ、複素数表示を理解し、これらを正弦波交流回路の計算に用いることができる。
    - (4) 共振回路や結合回路等を計算できる。
    - (5) 電気回路の過渡応答を計算し、過渡応答の特徴を説明できる。
    - 2 一般的な科目名
    - 電気回路、交流回路、過渡現象論
