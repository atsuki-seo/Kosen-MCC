  type: area
  parent: mcc2023:V-C
  code: V-C-5
  name: 電力
  heading_raw: V-C-5 電力
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 電力系領域では、様々なエネルギー源より電気エネルギーに変換する方法とその電気エネルギーを適切に輸送・
    - 利用する方法について説明できること、また、電気エネルギーの発生・輸送・利用と環境問題との関わりにつ
    - いて説明できることを目標とする。
    - (1) 電力の基本原理である三相交流の基本事項について説明できる。
    - (2) 電力の発生、変換及び利用に用いられる回転機と静止器の動作原理と構造を説明できる。
    - (3) 様々なエネルギー源から発電する方法と特徴、環境問題への対応と有効性についても説明できる。
    - (4) 日本における電力輸送システムの構成要素の働きと、電力品質や安定供給を維持する方法について説明で
    - きる。
    - 2 一般的な科目名
    - 電気回路、電気機器、発変電工学、送配電工学、電力系統工学、エネルギー変換工学
    pages_pdf:
    - 87
  source:
    page_pdf: 87
    page_printed: 73
  verification: machine
