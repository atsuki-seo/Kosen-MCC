- id: mcc2023:rel:guideline:III-B-001
  type: curriculum-guideline
  row_kind: objective
  section: Ⅲ-B 英語
  content:
    raw: Ⅲ-B 英語
    id: mcc2023:III-B
    method: code+name
  targets: []
  mcc_raw: 【教育領域の到達目標】(1) 英語コミュニケーションの基礎となる知識や技能を習得し、目的や場面、状況に応じて適切に活用できる。（1～5年次）(2) 多様性や異文化への理解を深め、相手に配慮しながら英語を用いて主体的にコミュニケーションを図ろうとすることができる。（1～5年次）(3) 日常的な話題や社会的な話題について、情報や考えなどを適切かつ正確に理解、表現できる。（1～3年次）(4) 自分の専門分野に関する基本的な情報や考えについて、適切かつ正確に理解、表現し、簡単な意見交換ができる。(3～5年次)
  goals_shared: false
  guideline_raw: 外国語によるコミュニケーションにおける見方・考え方を働かせ、英語による聞くこと、読むこと、話すこと、書くことの言語活動及びこれらを結び付けた統合的な言語活動を通して、情報や考えなどを的確に理解したり適切に表現したり伝え合ったりするコミュニケーションを図る資質・能力を次のとおり育成することを目指す。（1）英語の音声や語彙、表現、文法、言語の働きなどの理解を深めるとともに、これらの知識を、聞くこと、読むこと、話すこと、書くことによる実際のコミュニケーションにおいて、目的や場面、状況などに応じて適切に活用できる技能を身に付けるようにする。（2）コミュニケーションを行う目的や場面、状況などに応じて、日常的な話題や社会的な話題について、英語で情報や考えなどの概要や要点、詳細、話し手や書き手の意図などを的確に理解したり、これらを活用して適切に表現したり伝え合ったりすることができる力を養う。（3）英語の背景にある文化に対する理解を深め、聞き手、読み手、話し手、書き手に配慮しながら、主体的、自律的に英語を用いてコミュニケーションを図ろうとする態度を養う。
  guideline_shared: false
  source:
    page_pdf: 200
    page_printed: 182
  verification: machine
- id: mcc2023:rel:guideline:III-B-002
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-B 英語
  content:
    raw: 音声
    id: mcc2023:III-B:01
    method: content-name-in-section
  mcc_raw: 聞き手に正しく伝わるよう、語・句・文における強勢、文におけるリズム・イントネーション、音のつながり・区切りを意識しながら明瞭に音読あるいは発話できる。
  goals_shared: false
  guideline_raw: 第１ 英語コミュニケーションⅠ〔知識及び技能〕(1)英語の特徴やきまりに関する事項実際に英語を用いた言語活動を通して、小学校学習指導要領（平成二十九年文部科学省告示第六十三号）第２章第10節の第２の２の(1)、中学校学習指導要領（平成二十九年文部科学省告示第六十四号）第２章第９節の第２の２の(1)及び次に示す言語材料のうち、五つの領域別の目標を達成するのにふさわしいものについて理解するとともに、言語材料と言語活動とを効果的に関連付け、実際のコミュニケーションにおいて活用できる技能を身に付けることができるよう指導する。ア 音声(ｱ) 語や句、文における強勢(ｲ) 文におけるイントネーション(ｳ) 文における区切り
  guideline_shared: false
  targets:
  - raw: 聞き手に正しく伝わるよう、語・句・文における強勢、文におけるリズム・イントネーション、音のつながり・区切りを意識しながら明瞭に音読あるいは発話できる。
