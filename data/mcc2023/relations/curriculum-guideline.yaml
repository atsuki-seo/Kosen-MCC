- id: mcc2023:rel:guideline:III-B-021
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-B 英語
  content:
    raw: 英語コミュニケーション（英語運用能力向上のための学習）
    id: mcc2023:III-B:05
    method: content-name-in-section
  mcc_raw: 英語でのディスカッション（必要に応じてディベート）を想定して、意見や主張、課題の解決策などをやり取りできる。
  goals_shared: false
  guideline_raw: 第５ 論理・表現Ⅱ(3)言語活動及び言語の働きに関する事項①言語活動に関する事項イ 話すこと［やり取り］(ｲ) 日常的な話題や社会的な話題に関して聞いたり読んだりした内容について、必要に応じて、使用する語句や文、やり取りの具体的な進め方が示される状況で、課題を明確に説明し、その解決策を提案し合ったり、意見や主張、課題の解決策などを適切な理由や根拠とともに詳しく伝え合ったりするディベートやディスカッションをする活動。また、やり取りした内容を踏まえて、自分自身の考えなどを整理して発表したり、文章を書いたりする活動。第６ 論理・表現Ⅲ(3)言語活動及び言語の働きに関する事項①言語活動に関する事項イ 話すこと［やり取り］(ｲ)日常的な話題や社会的な話題に関して聞いたり読んだりした内容について、質疑応答をしたり、聞き手を説得することができるようニュースや新聞記事などの複数の資料を活用して、意見や主張、課題の解決策などを効果的な理由や根拠とともに詳しく伝え合ったりするディベートやディスカッションをする活動。また、やり取りした内容を踏まえて、自分自身の考えなどを、整理して発表したり、文章を書いたりする活動。
  guideline_shared: false
  targets:
  - raw: 英語でのディスカッション（必要に応じてディベート）を想定して、意見や主張、課題の解決策などをやり取りできる。
    id: mcc2023:III-B:05.02
    method: text-exact-in-scope
  source:
    page_pdf: 203
    page_printed: 185
  verification: machine
