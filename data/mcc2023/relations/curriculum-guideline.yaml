- id: mcc2023:rel:guideline:II-A-014
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: 温度と熱（熱分野）仕事と熱（熱分野）エネルギー（熱分野）
    id: null
    reason: mcc2023:II-A の下に同じ名称の学習内容がない
  mcc_raw: ･ 原子や分子の熱運動と絶対温度との関連について説明できる。･ 時間の推移とともに、熱の移動によって熱平衡状態に達することを説明できる。･ 物体の熱容量と比熱に関する計算ができる。･ 熱量保存の法則を用いて、熱容量、比熱及び熱平衡後の物体の温度を求めることができる。･ ボイル・シャルルの法則や理想気体の状態方程式を用いて、気体の圧力、温度、体積を求めることができる。･ 理想気体における分子の運動エネルギーと内部エネルギーの関係について説明できる。･ 熱力学第一法則を用いて、気体の状態変化（定積変化、定圧変化、等温変化、断熱変化）に関する計算ができる。･ エネルギーには多くの形態があり、互いに変換できることを具体例を挙げて説明できる。･ 不可逆変化について、具体例を挙げて説明できる。･ 熱機関の熱効率に関する計算ができる。
  goals_shared: false
  guideline_raw: '[物理基礎] (2) (ｲ) ㋐ 熱と温度について、原子や分子の熱運動の観点から理解すること。（熱現象を微視的に捉え、原子や分子の熱運動と温度との関係を定性的に扱うこと。また、内部エネルギーや物質の三態にも触れること。）(2) (ｲ) ㋑ 熱に関する実験などを行い、熱の移動及び熱と仕事の変換について理解すること。（熱現象における不可逆性にも触れること。）[物理] (1) (ｵ) ㋐ 気体分子の運動と圧力の関係について理解すること。（理想気体の状態方程式、気体分子の速さ、平均の運動エネルギーなどを扱うこと。）(1) (ｵ) ㋑ 気体の内部エネルギーについて、気体分子の運動と関連付けて理解すること。（理想気体を扱うこと。）(1) (ｵ) ㋒ 気体の状態変化に関する実験などを行い、熱、仕事及び内部エネルギーの関係を理解すること。（熱力学第一法則を扱うこと。）'
  guideline_shared: false
  targets:
  - raw: 原子や分子の熱運動と絶対温度との関連について説明できる。
    id: mcc2023:II-A:11.01
    method: text-exact-in-scope
  - raw: 時間の推移とともに、熱の移動によって熱平衡状態に達することを説明できる。
    id: mcc2023:II-A:11.02
    method: text-exact-in-scope
  - raw: 物体の熱容量と比熱に関する計算ができる。
    id: mcc2023:II-A:11.03
    method: text-exact-in-scope
  - raw: 熱量保存の法則を用いて、熱容量、比熱及び熱平衡後の物体の温度を求めることができる。
    id: mcc2023:II-A:11.04
    method: text-exact-in-scope
  - raw: ボイル・シャルルの法則や理想気体の状態方程式を用いて、気体の圧力、温度、体積を求めることができる。
    id: mcc2023:II-A:12.01
    method: text-exact-in-scope
  - raw: 理想気体における分子の運動エネルギーと内部エネルギーの関係について説明できる。
    id: mcc2023:II-A:12.02
    method: text-exact-in-scope
  - raw: 熱力学第一法則を用いて、気体の状態変化（定積変化、定圧変化、等温変化、断熱変化）に関する計算ができる。
    id: mcc2023:II-A:12.03
    method: text-exact-in-scope
  - raw: エネルギーには多くの形態があり、互いに変換できることを具体例を挙げて説明できる。
    id: mcc2023:II-A:13.01
    method: text-exact-in-scope
  - raw: 不可逆変化について、具体例を挙げて説明できる。
    id: mcc2023:II-A:13.02
    method: text-exact-in-scope
  - raw: 熱機関の熱効率に関する計算ができる。
    id: mcc2023:II-A:13.03
    method: text-exact-in-scope
  source:
    page_pdf: 190
    page_printed: 172
  verification: image
