    method: content-name-in-section
  mcc_raw: 新たな発想や他者の視点の理解に努め、自分の思いや考えを整理するための手法を実践できる。
  goals_shared: false
  guideline_raw: '[国語表現 〔知識及び技能〕(1)]イ 話し言葉と書き言葉の特徴や役割、表現の特色について理解を深め、伝え合う目的や場面、相手、手段に応じた適切な表現や言葉遣いを理解し、使い分けること。[国語表現 A 話すこと・聞くこと(1)]キ 互いの主張や論拠を吟味したり、話合いの進行や展開を助けたりするために発言を工夫するなど、考えを広げたり深めたりしながら、話合いの仕方や結論の出し方を工夫すること。[国語表現 A 話すこと・聞くこと(2)]オ 設定した題材について調べたことを、図表や画像なども用いながら発表資料にまとめ、聴衆に対して説明する活動。[国語表現 B 書くこと(1)]オ 自分の思いや考えを明確にし、事象を的確に描写したり説明したりするなど、表現の仕方を工夫すること。カ 読み手に対して自分の思いや考えが効果的に伝わるように書かれているかなどを吟味して、文章全体を整えたり、読み手からの助言などを踏まえて、自分の文章の特長や課題を捉え直したりすること。[国語表現 B 書くこと(2)]ア 社会的な話題や自己の将来などを題材に、自分の思いや考えについて、文章の種類を選んで書く活動。カ 異なる世代の人や初対面の人にインタビューをするなどして聞いたことを、報告書などにまとめる活動。'
  guideline_shared: false
  targets:
  - raw: 新たな発想や他者の視点の理解に努め、自分の思いや考えを整理するための手法を実践できる。
    id: mcc2023:III-A:03.07
