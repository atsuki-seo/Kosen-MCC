- id: mcc2023:rel:guideline:III-A-012
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-A 国語
  content:
    raw: 表現・コミュニケーション
    id: mcc2023:III-A:03
    method: content-name-in-section
  mcc_raw: 整理した情報を基にして、主張が効果的に伝わるように論理の構成や展開、表現方法を工夫し、報告・論文を作成できる。
  goals_shared: false
  guideline_raw: '[現代の国語 A 話すこと・聞くこと(1)]イ 自分の考えが的確に伝わるよう、自分の立場や考えを明確にするとともに、相手の反応を予想して論理の展開を考えるなど、話の構成や展開を工夫すること。[現代の国語 B 書くこと(1)]イ 読み手の理解が得られるよう、論理の展開、情報の分量や重要度などを考えて、文章の構成や展開を工夫すること。[現代の国語 B 書くこと(2)]ウ 調べたことを整理して、報告書や説明資料などにまとめる活動。[論理国語 〔知識及び技能〕(1)]エ 文章の種類に基づく効果的な段落の構造や論の形式など、文章の構成や展開の仕方について理解を深めること。[論理国語 A 書くこと(1)]イ 情報の妥当性や信頼性を吟味しながら、自分の立場や論点を明確にして、主張を支える適切な根拠をそろえること。エ 多面的・多角的な視点から自分の考えを見直したり、根拠や論拠の吟味を重ねたりして、主張を明確にすること。オ 個々の文の表現の仕方や段落の構造を吟味するなど、文章全体の論理の明晰さを確かめ、自分の主張が的確に伝わる文章になるよう工夫すること。カ 文章の構成や展開、表現の仕方などについて、自分の主張が的確に伝わるように書かれているかなどを吟味して、文章全体を整えたり、読み手からの助言などを踏まえて、自分の文章の特長や課題を捉え直したりすること。[論理国語 A 書くこと(2)]ウ 社会的な話題について書かれた論説文やその関連資料を参考にして、自分の考えを短い論文にまとめ、批評し合う活動。[論理国語 B 読むこと(2)]エ 同じ事柄について異なる論点をもつ複数の文章を読み比べ、それらを比較して論じたり批評したりする活動。オ 関心をもった事柄について様々な資料を調べ、その成果を発表したり報告書や短い論文などにまとめたりする活動。[国語表現 〔知識及び技能〕(1)]エ 実用的な文章などの種類や特徴、構成や展開の仕方などについて理解を深めること。[国語表現 A 話すこと・聞くこと(1)]イ 自分の主張の合理性が伝わるよう、適切な根拠を効果的に用いるとともに、相手の反論を想定して論理の展開を考えるなど、話の構成や展開を工夫すること。ウ 自分の思いや考えが伝わるよう、具体例を効果的に配置するなど、話の構成や展開を工夫すること。[国語表現 B 書くこと(1)]イ
    読み手の同意が得られるよう、適切な根拠を効果的に用いるとともに、反論などを想定して論理の展開を考えるなど、文章の構成や展開を工夫すること。ウ 読み手の共感が得られるよう、適切な具体例を効果的に配置するなど、文章の構成や展開を工夫すること。[国語表現 B 書くこと(2)]イ 文章と図表や画像などを関係付けながら、企画書や報告書などを作成する活動。ウ 説明書や報告書の内容を、目的や読み手に応じて再構成し、広報資料などの別の形式に書き換える活動。'
  guideline_shared: false
  targets:
  - raw: 整理した情報を基にして、主張が効果的に伝わるように論理の構成や展開、表現方法を工夫し、報告・論文を作成できる。
    id: mcc2023:III-A:03.03
    method: text-exact-in-scope
  source:
    page_pdf: 197
    page_printed: 179
    pages_pdf:
    - 197
