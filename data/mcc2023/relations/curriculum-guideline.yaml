- id: mcc2023:rel:guideline:I-015
  type: curriculum-guideline
  row_kind: content
  section: Ⅰ 数学
  content:
    raw: 積分法
    id: mcc2023:I:14
    method: content-name-in-section
  mcc_raw: ･ 導関数の公式を利用して不定積分を求めることができる。･ 微分積分の基本定理を理解し、不定積分を利用して定積分を求めることができる。･ 置換積分及び部分積分を利用して、不定積分や定積分を求めることができる。･ 三角関数・指数関数・対数関数・分数関数・無理関数などを含む関数の不定積分・定積分を求めることができる。
  goals_shared: false
  guideline_raw: 数学Ⅱ(5）微分・積分の考えア(ウ) 不定積分及び定積分の意味について理解し、関数の定数倍、和及び差の不定積分や定積分の値を求めること。数学Ⅲ(3) 積分法ア(ア) 不定積分及び定積分の基本的な性質についての理解を深め、それらを用いて不定積分や定積分を求めること。ア(イ) 置換積分法及び部分積分法について理解し、簡単な場合について、それらを用いて不定積分や定積分を求めること。ア(ウ) 定積分を利用して、いろいろな曲線で囲まれた図形の面積や立体の体積及び曲線の長さなどを求めること。数C (2) 平面上の曲線と複素数平面ア(ウ) 極座標の意味及び曲線が極方程式で表されることについて理解すること。
  guideline_shared: false
  targets:
  - raw: 導関数の公式を利用して不定積分を求めることができる。
    id: mcc2023:I:14.01
    method: text-exact-in-scope
  - raw: 微分積分の基本定理を理解し、不定積分を利用して定積分を求めることができる。
    id: mcc2023:I:14.02
    method: text-exact-in-scope
  - raw: 置換積分及び部分積分を利用して、不定積分や定積分を求めることができる。
    id: mcc2023:I:14.03
    method: text-exact-in-scope
  - raw: 三角関数・指数関数・対数関数・分数関数・無理関数などを含む関数の不定積分・定積分を求めることができる。
