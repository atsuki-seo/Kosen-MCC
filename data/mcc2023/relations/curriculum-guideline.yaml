- id: mcc2023:rel:guideline:I-021
  type: curriculum-guideline
  row_kind: content
  section: Ⅰ 数学
  content:
    raw: 確率
    id: mcc2023:I:20
    method: content-name-in-section
  mcc_raw: ･ 確率の加法定理、排反事象、余事象について理解し、確率の計算ができる。･ 条件付き確率、確率の乗法定理、独立事象について理解し、確率の計算ができる。･ 確率変数と確率分布について理解し、二項分布と正規分布の性質や特徴を説明できる。
  goals_shared: false
  guideline_raw: 数学 I (1) 数と式ア(イ） 集合と命題に関する基本的な概念を理解すること。数学A (2) 場合の数と確率ア(ア) 集合の要素の個数に関する基本的な関係や和の法則、積の法則などの数え上げの原則について理解すること。ア(イ) 具体的な事象を基に順列及び組合せの意味を理解し、順列の総数や組合せの総数を求めること。ア(ウ） 確率の意味や基本的な法則についての理解を深め、それらを用いて事象の確率や期待値を求めること。ア(エ） 独立な試行の意味を理解し、独立な試行の確率を求めること。ア(オ） 条件付き確率の意味を理解し、簡単な場合について条件付き確率を求めること。数学 B (2) 統計的な推測ア(イ） 確率変数と確率分布について理解すること。ア(ウ） 二項分布と正規分布の性質や特徴について理解すること。数学 B (3) 数学と社会生活ア(イ） 日常の事象や社会の事象などを数学化し、数理的に問題を解決する方法を知ること。
  guideline_shared: false
  targets:
  - raw: 確率の加法定理、排反事象、余事象について理解し、確率の計算ができる。
    id: mcc2023:I:20.01
    method: text-exact-in-scope
  - raw: 条件付き確率、確率の乗法定理、独立事象について理解し、確率の計算ができる。
    id: mcc2023:I:20.02
    method: text-exact-in-scope
  - raw: 確率変数と確率分布について理解し、二項分布と正規分布の性質や特徴を説明できる。
    id: mcc2023:I:20.03
    method: text-exact-in-scope
  source:
    page_pdf: 188
    page_printed: 170
  verification: machine
- id: mcc2023:rel:guideline:I-022
