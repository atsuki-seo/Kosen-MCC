    method: content-name-in-section
  mcc_raw: ･ 導関数を利用してグラフの概形を把握し、関数の極値や最大値・最小値を求めることができる。･ 接線の方程式を求めることができる。･ 第二次導関数を利用してグラフの凹凸を判定できる。･ 媒介変数表示された関数に対して導関数の計算ができる。
