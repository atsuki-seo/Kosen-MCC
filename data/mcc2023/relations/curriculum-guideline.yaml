- id: mcc2023:rel:guideline:III-C-039
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-C 社会
  content:
    raw: 公民的分野
    id: mcc2023:III-C:02
    method: content-name-in-section
  mcc_raw: これまでの哲学者や先人の考え方を手掛かりにしつつ、より良いキャリア構築を含む生涯にわたる多様な自己形成に関する考え方、他者と共に生きていくことの重要性、及び望ましい社会や世界のあり方について考察できる。
  goals_shared: false
  guideline_raw: '[公共]Ａ 公共の扉（1）公共的な空間を作る私たち公共的な空間と人間との関わり、個人の尊厳と自主・自律、人間と社会の多様性と共通性などに着目して、社会に参画する自立した主体とは何かを問い、現代社会に生きる人間としての在り方生き方を探究する活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識を身に付けること。（ｱ） 自らの体験などを振り返ることを通して、自らを成長させる人間としての在り方生き方について理解すること。（ｲ） 人間は、個人として相互に尊重されるべき存在であるとともに、対話を通して互いの様々な立場を理解し高め合うことのできる社会的な存在であること、伝統や文化、先人の取組や知恵に触れたりすることなどを通して、自らの価値観を形成するとともに他者の価値観を尊重することができるようになる存在であることについて理解すること。（ｳ） 自分自身が、自主的によりよい公共的な空間を作り出していこうとする自立した主体になることが、自らのキャリア形成とともによりよい社会の形成に結び付くことについて理解すること。'
  guideline_shared: false
  targets:
  - raw: これまでの哲学者や先人の考え方を手掛かりにしつつ、より良いキャリア構築を含む生涯にわたる多様な自己形成に関する考え方、他者と共に生きていくことの重要性、及び望ましい社会や世界のあり方について考察できる。
    id: mcc2023:III-C:02.01
    method: text-exact-in-scope
  source:
    page_pdf: 211
    page_printed: 193
  verification: machine
- id: mcc2023:rel:guideline:III-C-040
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-C 社会
  content:
    raw: 公民的分野
    id: mcc2023:III-C:02
    method: content-name-in-section
  mcc_raw: これまでの哲学者や先人の考え方を手掛かりにしつつ、より良いキャリア構築を含む生涯にわたる多様な自己形成に関する考え方、他者と共に生きていくことの重要性、及び望ましい社会や世界のあり方について考察できる。
  goals_shared: true
  guideline_raw: '[公共]Ａ 公共の扉（2）公共的な空間における人間としての在り方生き方主体的に社会に参画し、他者と協働することに向けて、幸福、正義、公正などに着目して、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識及び技能を身に付けること。（ｱ） 選択・判断の手掛かりとして、行為の結果である個人や社会全体の幸福を重視する考え方や、行為の動機となる公正などの義務を重視する考え方などについて理解すること。（ｲ） 現代の諸課題について自らも他者も共に納得できる解決方法を見いだすことに向け、（ｱ）に示す考え方を活用することを通して、行為者自身の人間としての在り方生き方について探究することが、よりよく生きていく上で重要であることについて理解すること。（ｳ） 人間としての在り方生き方に関わる諸資料から、よりよく生きる行為者として活動するために必要な情報を収集し、読み取る技能を身に付けること。'
  guideline_shared: false
  targets:
  - raw: これまでの哲学者や先人の考え方を手掛かりにしつつ、より良いキャリア構築を含む生涯にわたる多様な自己形成に関する考え方、他者と共に生きていくことの重要性、及び望ましい社会や世界のあり方について考察できる。
    id: mcc2023:III-C:02.01
    method: text-exact-in-scope
  source:
    page_pdf: 211
    page_printed: 193
  verification: machine
- id: mcc2023:rel:guideline:III-C-041
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-C 社会
  content:
    raw: 公民的分野
    id: mcc2023:III-C:02
    method: content-name-in-section
  mcc_raw: これまでの哲学者や先人の考え方を手掛かりにしつつ、より良いキャリア構築を含む生涯にわたる多様な自己形成に関する考え方、他者と共に生きていくことの重要性、及び望ましい社会や世界のあり方について考察できる。
  goals_shared: true
  guideline_raw: '[倫理]Ａ 現代に生きる自己の課題と人間としての在り方生き方（1）人間としての在り方生き方の自覚人間の存在や価値に関わる基本的な課題について思索する活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識及び技能を身に付けること。（ｱ） 個性、感情、認知、発達などに着目して、豊かな自己形成に向けて、他者と共によりよく生きる自己の生き方についての思索を深めるための手掛かりとなる様々な人間の心の在り方について理解すること。（ｲ） 幸福、愛、徳などに着目して、人間としての在り方生き方について思索するための手掛かりとなる様々な人生観について理解すること。その際、人生における宗教や芸術のもつ意義についても理解すること。（ｳ） 善、正義、義務などに着目して、社会の在り方と人間としての在り方生き方について思索するための手掛かりとなる様々な倫理観について理解すること。（ｴ） 真理、存在などに着目して、世界と人間の在り方について思索するための手掛かりとなる様々な世界観について理解すること。（ｵ） 古今東西の先哲の思想に関する原典の日本語訳などの諸資料から、人間としての在り方生き方に関わる情報を読み取る技能を身に付けること。'
  guideline_shared: false
  targets:
  - raw: これまでの哲学者や先人の考え方を手掛かりにしつつ、より良いキャリア構築を含む生涯にわたる多様な自己形成に関する考え方、他者と共に生きていくことの重要性、及び望ましい社会や世界のあり方について考察できる。
    id: mcc2023:III-C:02.01
    method: text-exact-in-scope
  source:
    page_pdf: 211
    page_printed: 193
  verification: machine
- id: mcc2023:rel:guideline:III-C-042
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-C 社会
  content:
    raw: 公民的分野
    id: mcc2023:III-C:02
    method: content-name-in-section
  mcc_raw: これまでの哲学者や先人の考え方を手掛かりにしつつ、より良いキャリア構築を含む生涯にわたる多様な自己形成に関する考え方、他者と共に生きていくことの重要性、及び望ましい社会や世界のあり方について考察できる。
  goals_shared: true
  guideline_raw: '[倫理]Ａ 現代に生きる自己の課題と人間としての在り方生き方（2）国際社会に生きる日本人としての自覚日本人としての在り方生き方について思索する活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識及び技能を身に付けること。（ｱ） 古来の日本人の心情と考え方や日本の先哲の思想に着目して、我が国の風土や伝統、外来思想の受容などを基に、国際社会に生きる日本人としての在り方生き方について思索するための手掛かりとなる日本人に見られる人間観、自然観、宗教観などの特質について、自己との関わりにおいて理解すること。（ｲ） 古来の日本人の心情と考え方や日本の先哲の思想に関する原典や原典の口語訳などの諸資料から、日本人としての在り方生き方に関わる情報を読み取る技能を身に付けること。'
  guideline_shared: false
  targets:
  - raw: これまでの哲学者や先人の考え方を手掛かりにしつつ、より良いキャリア構築を含む生涯にわたる多様な自己形成に関する考え方、他者と共に生きていくことの重要性、及び望ましい社会や世界のあり方について考察できる。
    id: mcc2023:III-C:02.01
    method: text-exact-in-scope
  source:
    page_pdf: 211
    page_printed: 193
  verification: machine
- id: mcc2023:rel:guideline:III-C-043
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-C 社会
  content:
    raw: 公民的分野
    id: mcc2023:III-C:02
    method: content-name-in-section
  mcc_raw: 自己が主体的に参画していく社会について、基本的人権や民主主義などの基本原理と基礎的な政治・法・経済の仕組みを理解し、現代社会の諸課題について考察できる。
  goals_shared: false
  guideline_raw: '[公共]Ａ 公共の扉（3）公共的な空間における基本的原理自主的によりよい公共的な空間を作り出していこうとする自立した主体となることに向けて、幸福、正義、公正などに着目して、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識を身に付けること。（ｱ） 各人の意見や利害を公平・公正に調整することなどを通して、人間の尊厳と平等、協働の利益と社会の安定性の確保を共に図ることが、公共的な空間を作る上で必要であることについて理解すること。（ｲ） 人間の尊厳と平等、個人の尊重、民主主義、法の支配、自由・権利と責任・義務など、公共的な空間における基本的原理について理解すること。'
  guideline_shared: false
  targets:
  - raw: 自己が主体的に参画していく社会について、基本的人権や民主主義などの基本原理と基礎的な政治・法・経済の仕組みを理解し、現代社会の諸課題について考察できる。
    id: mcc2023:III-C:02.02
    method: text-exact-in-scope
