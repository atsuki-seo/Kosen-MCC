  mcc_raw: ･ 酸・塩基の定義（アレニウスの定義、ブレンステッド・ローリーの定義）について説明できる。･ 酸・塩基の化学式と酸・塩基の価数について説明できる。･ 電離度と酸・塩基の強弱について説明できる。
