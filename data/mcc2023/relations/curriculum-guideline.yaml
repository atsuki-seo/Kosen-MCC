  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: 音波・発音体（波動分野）
    id: mcc2023:II-A:17
    method: content-name-in-section
  mcc_raw: ･ 弦の長さと弦を伝わる波の速さを用いて、弦の固有振動数を求めることができる。･ 気柱の長さと音速を用いて、開管、閉管の固有振動数を求めることができる（開口端補正は考えない）。･ うなり及び共振、共鳴現象について具体例を挙げて説明できる。･ 一直線上の運動において、ドップラー効果による音の振動数変化を求めることができる。
