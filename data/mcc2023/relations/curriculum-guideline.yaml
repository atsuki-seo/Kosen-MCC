- id: mcc2023:rel:guideline:III-C-025
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-C 社会
  content:
    raw: 地理歴史的分野
    id: mcc2023:III-C:01
    method: content-name-in-section
  mcc_raw: 第二次世界大戦以降、冷戦の展開と終結、その後現在に至る日本を含む世界の動向の概要を説明し、そこで生じた諸問題を歴史的に考察できる。
  goals_shared: true
  guideline_raw: '[日本史探究]Ｄ 近現代の地域・日本と世界（3）近現代の地域・日本と世界の画期と構造諸資料を活用し、（2）で表現した仮説を踏まえ、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識を身に付けること。（ｱ）明治維新、自由民権運動、大日本帝国憲法の制定、条約改正、日清・日露戦争、第一次世界大戦、社会運動の動向、政党政治などを基に、立憲体制への移行、国民国家の形成、アジアや欧米諸国との関係の変容を理解すること。（ｲ）文明開化の風潮、産業革命の展開、交通の整備と産業構造の変容、学問の発展や教育制度の拡充、社会問題の発生などを基に、産業の発展の経緯と近代の文化の特色、大衆社会の形成を理解すること。（ｳ）恐慌と国際関係、軍部の台頭と対外政策、戦時体制の強化と第二次世界大戦の展開などを基に、第二次世界大戦に至る過程及び大戦中の政治・社会、国民生活の変容を理解すること。（ｴ）占領政策と諸改革、日本国憲法の成立、平和条約と独立の回復、戦後の経済復興、アジア諸国との関係、高度経済成長、社会・経済・情報の国際化などを基に、我が国の再出発及びその後の政治・経済や対外関係、現代の政治や社会の枠組み、国民生活の変容を理解すること。'
  guideline_shared: false
  targets:
  - raw: 第二次世界大戦以降、冷戦の展開と終結、その後現在に至る日本を含む世界の動向の概要を説明し、そこで生じた諸問題を歴史的に考察できる。
    id: mcc2023:III-C:01.05
    method: text-exact-in-scope
