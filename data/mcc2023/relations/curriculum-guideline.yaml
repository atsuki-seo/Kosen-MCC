  guideline_raw: '[政治・経済]Ｂ グローバル化する国際社会の諸課題（1）現代の国際政治・経済国際平和と人類の福祉に寄与しようとする自覚を深めることに向けて、個人の尊厳と基本的人権の尊重、対立、協調、効率、公正などに着目して、現代の諸課題を追究したり解決に向けて構想したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識及び技能を身に付けること。（ｱ） 国際社会の変遷、人権、国家主権、領土（領海、領空を含む。）などに関する国際法の意義、国際連合をはじめとする国際機構の役割、我が国の安全保障と防衛、国際貢献について、現実社会の諸事象を通して理解を深めること。（ｲ） 貿易の現状と意義、為替相場の変動、国民経済と国際収支、国際協調の必要性や国際経済機関の役割について、現実社会の諸事象を通して理解を深めること。（ｳ） 現代の国際政治・経済に関する諸資料から、課題の解決に向けて考察、構想する際に必要な情報を適切かつ効果的に収集し、読み取る技能を身に付けること。'
