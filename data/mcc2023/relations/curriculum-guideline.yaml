  guideline_raw: '[世界史探究]Ｅ 地球世界の課題（3）科学技術の高度化と知識基盤社会諸資料を活用し、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識を身に付けること。（ｱ） 原子力の利用や宇宙探査などの科学技術、医療技術・バイオテクノロジーと生命倫理、人工知能と労働の在り方の変容、情報通信技術の発達と知識の普及などを基に、知識基盤社会の展開と課題を理解すること。'
