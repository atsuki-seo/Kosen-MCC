  - raw: 力学的エネルギー保存の法則について説明でき、その法則を用いて、物体の速度や変位などを求めることができる。
    id: mcc2023:II-A:06.05
    method: text-exact-in-scope
  source:
    page_pdf: 189
    page_printed: 171
  verification: machine
- id: mcc2023:rel:guideline:II-A-010
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: 運動量（力学分野）
    id: mcc2023:II-A:07
    method: content-name-in-section
  mcc_raw: ･ 物体の質量と速度を用いて、運動量を求めることができる。･ 物体の運動量変化が力積に等しいことを用いて、力積の大きさ、速度変化及び加わる平均の力などを求めることができる。･ 運動量保存の法則について説明でき、その法則や反発係数を用いて、物体の衝突、分裂及び合体に関して、速度変化などを求めることができる。
  goals_shared: false
  guideline_raw: '[物理] (1) (ｲ) ㋐ 運動量と力積との関係について理解すること。（運動量と力積がベクトルで表されること、運動量の変化が力積に等しいことを扱うこと。）(1) (ｲ) ㋑ 物体の衝突や分裂に関する実験などを行い、運動量保存の法則を理解すること。(1) (ｲ) ㋒ 衝突における力学的エネルギーの変化について理解すること。（はね返り係数も扱うこと。）'
  guideline_shared: false
  targets:
  - raw: 物体の質量と速度を用いて、運動量を求めることができる。
    id: mcc2023:II-A:07.01
    method: text-exact-in-scope
  - raw: 物体の運動量変化が力積に等しいことを用いて、力積の大きさ、速度変化及び加わる平均の力などを求めることができる。
    id: mcc2023:II-A:07.02
    method: text-exact-in-scope
  - raw: 運動量保存の法則について説明でき、その法則や反発係数を用いて、物体の衝突、分裂及び合体に関して、速度変化などを求めることができる。
    id: mcc2023:II-A:07.03
    method: text-exact-in-scope
  source:
    page_pdf: 190
    page_printed: 172
    page_top: true
  verification: image
- id: mcc2023:rel:guideline:II-A-011
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: 円運動と単振動（力学分野）
    id: mcc2023:II-A:08
    method: content-name-in-section
  mcc_raw: ･ 等速円運動をする物体の速度、角速度、周期、加速度、向心力に関する計算ができる。･ 単振動における変位、速度、加速度、復元力の関係を説明できる。･ 周期、振動数など単振動を特徴づける諸量を求めることができる。
  goals_shared: false
  guideline_raw: '[物理] (1) (ｳ) ㋐ 円運動をする物体の様子を表す方法やその物体に働く力などについて理解すること。（等速円運動の速度、周期、角速度、向心加速度及び向心力を扱うこと。また、遠心力にも触れること。）(1) (ｳ) ㋑ 振り子に関する実験などを行い、単振動の規則性を見いだして理解するとともに、単振動をする物体の様子を表す方法やその物体に働く力などについて理解すること。（単振動をする物体の変位、速度、加速度及び復元力を扱うこと。「単振動」については、ばね振り子と単振り子を扱うこと。）'
  guideline_shared: false
  targets:
  - raw: 等速円運動をする物体の速度、角速度、周期、加速度、向心力に関する計算ができる。
    id: mcc2023:II-A:08.01
    method: text-exact-in-scope
  - raw: 単振動における変位、速度、加速度、復元力の関係を説明できる。
    id: mcc2023:II-A:08.02
    method: text-exact-in-scope
  - raw: 周期、振動数など単振動を特徴づける諸量を求めることができる。
    id: mcc2023:II-A:08.03
    method: text-exact-in-scope
  source:
    page_pdf: 190
    page_printed: 172
  verification: machine
