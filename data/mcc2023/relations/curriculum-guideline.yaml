  section: Ⅲ-C 社会
  content:
    raw: 地理歴史的分野
    id: mcc2023:III-C:01
    method: content-name-in-section
  mcc_raw: 人間と自然環境との相互作用を前提としつつ、民族、宗教、生活文化の多様性を理解し、異なる文化・社会が共存することの重要性について考察できる。
  goals_shared: false
  guideline_raw: '[地理総合]Ｂ 国際理解と国際協力（1）生活文化の多様性と国際理解場所や人間と自然環境との相互依存関係などに着目して、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識を身に付けること。（ｱ） 世界の人々の特色ある生活文化を基に、人々の生活文化が地理的環境から影響を受けたり、影響を与えたりして多様性をもつことや、地理的環境の変化によって変容することなどについて理解すること。（ｲ） 世界の人々の特色ある生活文化を基に、自他の文化を尊重し国際理解を図ることの重要性などについて理解すること。'
  guideline_shared: false
  targets:
  - raw: 人間と自然環境との相互作用を前提としつつ、民族、宗教、生活文化の多様性を理解し、異なる文化・社会が共存することの重要性について考察できる。
