  guideline_raw: '[物理基礎] (2) (ｳ) ㋑ 発電、送電及び電気の利用について、基本的な仕組みを理解すること。（交流の直流への変換や電磁波の利用にも触れること。）[物理] (3) (ｲ) ㋐ 電流がつくる磁界の様子を理解すること。（直線電流と円電流がつくる磁界を中心に扱うこと。）(3) (ｲ) ㋑ 電流が磁界から受ける力について理解すること。（ローレンツ力にも触れること。）(3) (ｲ) ㋒ 電磁誘導に関する実験などを行い、磁束の変化と誘導起電力の向きや大きさとの関係を見いだして理解するとともに、電磁誘導の法則を理解すること。また、交流の発生について理解すること。（電磁誘導の法則を中心に扱い、自己誘導、相互誘導を扱うこと。また、交流回路の基本的な性質にも触れること。）(3) (ｲ) ㋓ 電磁波の性質とその利用を理解すること。（電気振動、電磁波の発生にも触れること。）'
  guideline_shared: false
