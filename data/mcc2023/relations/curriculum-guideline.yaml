  guideline_raw: '[現代の国語 A 話すこと・聞くこと(1)]ウ 話し言葉の特徴を踏まえて話したり、場の状況に応じて資料や機器を効果的に用いたりするなど、相手の理解が得られるように表現を工夫すること。[現代の国語 A 話すこと・聞くこと(2)]ア 自分の考えについてスピーチをしたり、それを聞いて、同意したり、質問したり、論拠を示して反論したりする活動。[現代の国語 A 話すこと・聞くこと(2)]エ 集めた情報を資料にまとめ、聴衆に対して発表する活動。[論理国語 A 書くこと(2)]エ 設定した題材について多様な資料を集め、調べたことを整理して、様々な観点から自分の意見や考えを論述する活動。[論理国語 B 読むこと(2)]エ 同じ事柄について異なる論点をもつ複数の文章を読み比べ、それらを比較して論じたり批評したりする活動。オ 関心をもった事柄について様々な資料を調べ、その成果を発表したり報告書や短い論文などにまとめたりする活動。[国語表現 A 話すこと・聞くこと(1)]エ 相手の反応に応じて言葉を選んだり、場の状況に応じて資料や機器を効果的に用いたりするなど、相手の同意や共感が得られるように表現を工夫すること。オ 論点を明確にして自分の考えと比較しながら聞き、話の内容や構成、論理の展開、表現の仕方を評価するとともに、聞き取った情報を吟味して自分の考えを広げたり深めたりすること。[国語表現 A 話すこと・聞くこと(2)]ア 聴衆に対してスピーチをしたり、面接の場で自分のことを伝えたり、それらを聞いて批評したりする活動。ウ 異なる世代の人や初対面の人にインタビューをしたり、報道や記録の映像などを見たり聞いたりしたことをまとめて、発表する活動。エ 話合いの目的に応じて結論を得たり、多様な考えを引き出したりするための議論や討論を行い、その記録を基に話合いの仕方や結論の出し方について批評する活動。[国語表現 B 書くこと(1)]エ 自分の考えを明確にし、根拠となる情報を基に的確に説明するなど、表現の仕方を工夫すること。[国語表現 B 書くこと(2)]オ 設定した題材について多様な資料を集め、調べたことを整理したり話し合ったりして、自分や集団の意見を提案書などにまとめる活動。'
  guideline_shared: false
  targets:
