- id: mcc2023:rel:guideline:III-A-001
  type: curriculum-guideline
  row_kind: objective
  section: Ⅲ-A 国語
  content:
    raw: Ⅲ-A 国語
    id: mcc2023:III-A
    method: code+name
  targets: []
  mcc_raw: 【教育領域の到達目標】人間性の基盤となる言語的・文化的教養を身に付け、自ら進んで効果的かつ対話的なコミュニケーションを実践することで、多様な他者を深く理解し、変化する状況にも柔軟に対応する言語能力や専門分野に関わる日本語の運用能力の向上を目指す。(1) 論理的な文章（論説や評論）に表された考えに対して、その論拠の妥当性の判断を踏まえて自分の意見を述べることができる。(2) 専門の分野に関する用語を思考や表現に活用できる。(3) 言語的・文化的教養に広く関心を持ち、そこで得られた知識や考え方を効果的な表現に活用できる。(4) 文学作品（小説・随筆・詩歌・古典等）を文脈に沿って鑑賞し、そこに描かれた人物やものの見方への理解をもとに、自己を客観的に捉えたり自分の意見を述べたりすることができる。(5) 情報を収集して分析整理し、構成を工夫して報告・論文を作成し、口頭発表できる。(6) 根拠に基づいて議論し、新たな発想や他者の視点の理解に努め、集団としての思いや考えをまとめることができる。
  goals_shared: false
  guideline_raw: 第１節 国語第１款 目標言葉による見方・考え方を働かせ、言語活動を通して、国語で的確に理解し効果的に表現する資質・能力を次のとおり育成することを目指す。(1) 生涯にわたる社会生活に必要な国語について、その特質を理解し適切に使うことができるようにする。(2) 生涯にわたる社会生活における他者との関わりの中で伝え合う力を高め、思考力や想像力を伸ばす。(3) 言葉のもつ価値への認識を深めるとともに、言語感覚を磨き、我が国の言語文化の担い手としての自覚をもち、生涯にわたり国語を尊重してその能力の向上を図る態度を養う。
  guideline_shared: false
  source:
    page_pdf: 195
    page_printed: 177
  verification: machine
- id: mcc2023:rel:guideline:III-A-002
  type: curriculum-guideline
  row_kind: content
