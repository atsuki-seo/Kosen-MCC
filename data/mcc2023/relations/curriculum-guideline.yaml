  mcc_raw: 論理的な文章（論説や評論）の構成や展開を的確にとらえ、要旨・要点をまとめることができる。
  goals_shared: false
  guideline_raw: '[現代の国語 Ｃ 読むこと(1)]ア 文章の種類を踏まえて、内容や構成、論理の展開などについて叙述を基に的確に捉え、要旨や要点を把握すること。[現代の国語 Ｃ 読むこと(2)]ア 論理的な文章や実用的な文章を読み、その内容や形式について、引用や要約などをしながら論述したり批評したりする活動。[論理国語 A 書くこと(2)]ア 特定の資料について、様々な観点から概要などをまとめる活動。[論理国語 B 読むこと(1)]ア 文章の種類を踏まえて、内容や構成、論理の展開などを的確に捉え、論点を明確にしながら要旨を把握すること。イ 文章の種類を踏まえて、資料との関係を把握し、内容や構成を的確に捉えること。ウ 主張を支える根拠や結論を導く論拠を批判的に検討し、文章や資料の妥当性や信頼性を吟味して内容を解釈すること。オ 関連する文章や資料を基に、書き手の立場や目的を考えながら、内容の解釈を深めること。'
  guideline_shared: false
  targets:
  - raw: 論理的な文章（論説や評論）の構成や展開を的確にとらえ、要旨・要点をまとめることができる。
