- id: mcc2023:rel:guideline:III-C-001
  type: curriculum-guideline
  row_kind: objective
  section: Ⅲ-C 社会
  content:
    raw: Ⅲ-C 社会
    id: mcc2023:III-C
    method: code+name
  targets: []
  mcc_raw: 【教育領域の到達目標】国際社会に生きる平和で民主的な国家・社会の形成者として主体的に社会に参画し、社会が抱える諸問題の解決のために人文・社会科学の知識・理論・情報を利用できる。
  goals_shared: false
  guideline_raw: '[地理総合、地理探究、歴史総合、日本史探究、世界史探究]社会的な見方・考え方を働かせ、課題を追究したり解決したりする活動を通して、広い視野に立ち、グローバル化する国際社会に主体的に生きる平和で民主的な国家及び社会の有為な形成者に必要な公民としての資質・能力を次のとおり育成することを目指す。(1) 現代世界の地域的特色と日本及び世界の歴史の展開に関して理解するとともに、調査や諸資料から様々な情報を適切かつ効果的に調べまとめる技能を身に付けるようにする。(2) 地理や歴史に関わる事象の意味や意義、特色や相互の関連を、概念などを活用して多面的・多角的に考察したり、社会に見られる課題の解決に向けて構想したりする力や、考察、構想したことを効果的に説明したり、それらを基に議論したりする力を養う。(3) 地理や歴史に関わる諸事象について、よりよい社会の実現を視野に課題を主体的に解決しようとする態度を養うとともに、多面的・多角的な考察や深い理解を通して涵養される日本国民としての自覚、我が国の国土や歴史に対する愛情、他国や他国の文化を尊重することの大切さについての自覚などを深める。'
  guideline_shared: false
  source:
    page_pdf: 205
    page_printed: 187
  verification: machine
- id: mcc2023:rel:guideline:III-C-002
  type: curriculum-guideline
  row_kind: objective
  section: Ⅲ-C 社会
  content:
    raw: Ⅲ-C 社会
    id: mcc2023:III-C
    method: code+name
  targets: []
  mcc_raw: 【教育領域の到達目標】国際社会に生きる平和で民主的な国家・社会の形成者として主体的に社会に参画し、社会が抱える諸問題の解決のために人文・社会科学の知識・理論・情報を利用できる。
  goals_shared: true
  guideline_raw: '[公共、倫理、政治・経済]社会的な見方・考え方を働かせ、現代の諸課題を追究したり解決したりする活動を通して、広い視野に立ち、グローバル化する国際社会に主体的に生きる平和で民主的な国家及び社会の有為な形成者に必要な公民としての資質・能力を次のとおり育成することを目指す。(1) 選択・判断の手掛かりとなる概念や理論及び倫理、政治、経済などに関わる現代の諸課題について理解するとともに、諸資料から様々な情報を適切かつ効果的に調べまとめる技能を身に付けるようにする。(2) 現代の諸課題について、事実を基に概念などを活用して多面的・多角的に考察したり、解決に向けて公正に判断したりする力や、合意形成や社会参画を視野に入れながら構想したことを議論する力を養う。(3) よりよい社会の実現を視野に、現代の諸課題を主体的に解決しようとする態度を養うとともに、多面的・多角的な考察や深い理解を通して涵養される、人間としての在り方生き方についての自覚や、国民主権を担う公民として、自国を愛し、その平和と繁栄を図ることや、各国が相互に主権を尊重し、各国民が協力し合うことの大切さについての自覚などを深める。'
  guideline_shared: false
  source:
    page_pdf: 205
    page_printed: 187
  verification: machine
- id: mcc2023:rel:guideline:III-C-003
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-C 社会
  content:
    raw: 地理歴史的分野
    id: mcc2023:III-C:01
    method: content-name-in-section
  mcc_raw: 世界各地の人口、資源、産業の分布や動向、並びにそれらをめぐる地域相互の結びつき等について理解し、現代社会を地理的観点から説明できる。
  goals_shared: false
  guideline_raw: '[地理総合]Ａ 地図や地理情報システムで捉える現代世界（1）地図や地理情報システムと現代世界位置や分布などに着目して、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識及び技能を身に付けること。（ｱ） 現代世界の地域構成を示した様々な地図の読図などを基に、方位や時差、日本の位置と領域、国内や国家間の結び付きなどについて理解すること。'
  guideline_shared: false
  targets:
  - raw: 世界各地の人口、資源、産業の分布や動向、並びにそれらをめぐる地域相互の結びつき等について理解し、現代社会を地理的観点から説明できる。
    id: mcc2023:III-C:01.01
    method: text-exact-in-scope
  source:
    page_pdf: 205
    page_printed: 187
  verification: machine
- id: mcc2023:rel:guideline:III-C-004
  type: curriculum-guideline
  row_kind: content
