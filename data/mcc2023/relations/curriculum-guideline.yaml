  mcc_raw: ･ ベクトルの和、差、実数倍の計算ができ、大きさを求めることができる。･ ベクトルの成分表示を利用した計算ができる。･ ベクトルの内積を求めることができる。･ ベクトルを使って平行や垂直を判定できる。･ 空間内の直線・平面・球の方程式を求めることができる。
  goals_shared: false
  guideline_raw: 数学 C (1) ベクトルア(ア) 平面上のベクトルの意味、相等、和、差、実数倍、位置ベクトル、ベクトルの成分表示について理解すること。ア(イ) ベクトルの内積及びその基本的な性質について理解すること。ア(ウ) 座標及びベクトルの考えが平面から空間に拡張できることを理解すること。数学A (1) 図形の性質ア(ア) 三角形に関する基本的な性質について理解すること。ア(イ) 円に関する基本的な性質について理解すること。ア(ウ) 空間図形に関する基本的な性質について理解すること。
  guideline_shared: false
