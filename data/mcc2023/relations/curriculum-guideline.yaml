- id: mcc2023:rel:guideline:II-A-022
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: 静電場（電気分野）
    id: mcc2023:II-A:19
    method: content-name-in-section
  mcc_raw: ･ 導体と不導体の違いについて、自由電子と関連させて説明できる。･ クーロンの法則を用いて、点電荷の間にはたらく静電気力を求めることができる。･ 電場、電位について説明でき、点電荷や単純な形状の帯電体の周りに作られる電場や電位に関する計算ができる。･ コンデンサの性質を理解し、電気容量などを求めることができる。
  goals_shared: false
  guideline_raw: '[物理基礎] (2) (ｳ) ㋐ 電気抵抗に関する実験などを行い、同じ物質からなる導体でも長さや断面積によって電気抵抗が異なることを見いだして理解すること。また、物質によって抵抗率が異なることを理解すること。（金属中の電流が自由電子の流れによることも扱うこと。また、半導体や絶縁体があることにも触れること。）[物理] (3) (ｱ) ㋐ 電荷が相互に及ぼし合う力を理解すること。また、電界の表し方を理解すること。（静電誘導も扱うこと。）(3) (ｱ) ㋑ 電界と電位との関係を静電気力による位置エネルギーと関連付けて理解すること。(3) (ｱ) ㋒ コンデンサーの性質を理解するとともに、電気容量を電界や電位差と関連付けて理解すること。(3) (ｱ) ㋓ 電気回路に関する実験などを行い、電気回路における基本的な法則を理解すること。'
  guideline_shared: false
  targets:
  - raw: 導体と不導体の違いについて、自由電子と関連させて説明できる。
    id: mcc2023:II-A:19.01
    method: text-exact-in-scope
  - raw: クーロンの法則を用いて、点電荷の間にはたらく静電気力を求めることができる。
    id: mcc2023:II-A:19.02
    method: text-exact-in-scope
  - raw: 電場、電位について説明でき、点電荷や単純な形状の帯電体の周りに作られる電場や電位に関する計算ができる。
    id: mcc2023:II-A:19.03
    method: text-exact-in-scope
