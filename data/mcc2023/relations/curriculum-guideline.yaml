- id: mcc2023:rel:guideline:II-A-016
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: 波の伝わり方と種類（波動分野）
    id: mcc2023:II-A:14
    method: content-name-in-section
  mcc_raw: ･ 波の振幅、波長、周期、振動数、速さに関する計算ができる。･ 横波と縦波の伝わり方について説明できる。･ 時刻と位置に対応した媒質の変位を正弦波の式で表現できる。
  goals_shared: false
  guideline_raw: '[物理基礎] (2) (ｱ) ㋐ 波の性質について、直線状に伝わる場合を中心に理解すること。（作図を用いる方法を中心に扱うこと。また、定在波も扱い、縦波や横波にも触れること。）[物理] (2) (ｱ) ㋐ 波の伝わり方とその表し方について理解すること。（ホイヘンスの原理、水面波の反射や屈折及び波の式を扱うこと。）(2) (ｱ) ㋑ 波の干渉と回折について理解すること。（水面波を扱うこと。）'
  guideline_shared: false
  targets:
  - raw: 波の振幅、波長、周期、振動数、速さに関する計算ができる。
    id: mcc2023:II-A:14.01
    method: text-exact-in-scope
  - raw: 横波と縦波の伝わり方について説明できる。
    id: mcc2023:II-A:14.02
    method: text-exact-in-scope
  - raw: 時刻と位置に対応した媒質の変位を正弦波の式で表現できる。
    id: mcc2023:II-A:14.03
    method: text-exact-in-scope
