    method: content-name-in-section
  mcc_raw: ･ 一次元のデータを整理して、平均・分散・標準偏差を求めることができる。･ 二次元のデータを整理して散布図を作成し、相関係数・回帰直線を求めることができる。
  goals_shared: false
  guideline_raw: 数学Ⅰ(4) データの分析ア(ア） 分散、標準偏差、散布図及び相関係数の意味やその用い方を理解すること。ア(イ） コンピュータなどの情報機器を用いるなどして、データを表やグラフに整理したり、分散や標準偏差などの基本的な統計量を求めたりすること。数学 B (3) 数学と社会生活ア(イ） 日常の事象や社会の事象などを数学化し、数理的に問題を解決する方法を知ること。数学C (3) 数学的な表現の工夫ア(ア) 日常の事象や社会の事象などを、図、表、統計グラフなどを用いて工夫して表現することの意義を理解すること。
  guideline_shared: false
  targets:
