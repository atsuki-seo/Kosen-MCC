- id: mcc2023:rel:guideline:III-B-020
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-B 英語
  content:
    raw: 英語コミュニケーション（英語運用能力向上のための学習）
    id: mcc2023:III-B:05
    method: content-name-in-section
  mcc_raw: 自分の専門分野などの予備知識のある事柄や関心のあるトピックについて、話の展開や話者の意図に注意しながら必要な情報を聞き取り、概要や要点を把握できる。
  goals_shared: false
  guideline_raw: 第３ 英語コミュニケーションⅢ(3) 言語活動及び言語の働きに関する事項① 言語活動に関する事項イ 聞くこと(ｱ) 日常的な話題について、インタビューやニュースなどから必要な情報を聞き取り、話の展開や話し手の意図を把握する活動。また、聞き取った内容について、質疑応答をしたり、意見や感想を伝え合ったりする活動。(ｲ) 社会的な話題について、複数のニュースや講演などから話の展開に注意しながら必要な情報を聞き取り、概要や要点、詳細を把握する活動。また、聞き取った内容について、質疑応答をしたり、意見や感想を伝え合ったりする活動。
  guideline_shared: false
  targets:
  - raw: 自分の専門分野などの予備知識のある事柄や関心のあるトピックについて、話の展開や話者の意図に注意しながら必要な情報を聞き取り、概要や要点を把握できる。
