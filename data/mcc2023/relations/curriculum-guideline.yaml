- id: mcc2023:rel:guideline:II-A-005
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: いろいろな力（力学分野）
    id: mcc2023:II-A:03
    method: content-name-in-section
  mcc_raw: ･ 物体に作用する力を図示できる。･ 力の合成と分解ができる。･ 質点にはたらく力のつりあいに関する計算ができる。･ 重力、弾性力、抗力、張力の概念を理解し、それぞれの力に関する計算ができる。･ 圧力、浮力について説明できる。
  goals_shared: false
  guideline_raw: '[物理基礎] (1) (ｲ) ㋐ 物体に様々な力が働くことを理解すること。（摩擦力、弾性力、圧力及び浮力を扱うこと。また、空間を隔てて働く力にも定性的に触れること。）(1) (ｲ) ㋑ 物体に働く力のつり合いを理解すること。（平面内で働く力のつり合いを中心に扱うこと。）'
  guideline_shared: false
  targets:
  - raw: 物体に作用する力を図示できる。
    id: mcc2023:II-A:03.01
    method: text-exact-in-scope
  - raw: 力の合成と分解ができる。
    id: mcc2023:II-A:03.02
    method: text-exact-in-scope
  - raw: 質点にはたらく力のつりあいに関する計算ができる。
    id: mcc2023:II-A:03.03
    method: text-exact-in-scope
  - raw: 重力、弾性力、抗力、張力の概念を理解し、それぞれの力に関する計算ができる。
    id: mcc2023:II-A:03.04
    method: text-exact-in-scope
  - raw: 圧力、浮力について説明できる。
    id: mcc2023:II-A:03.05
    method: text-exact-in-scope
  source:
    page_pdf: 189
    page_printed: 171
  verification: machine
