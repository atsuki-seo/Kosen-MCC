  content:
    raw: 地理歴史的分野
    id: mcc2023:III-C:01
    method: content-name-in-section
  mcc_raw: 世界各地の人口、資源、産業の分布や動向、並びにそれらをめぐる地域相互の結びつき等について理解し、現代社会を地理的観点から説明できる。
  goals_shared: true
  guideline_raw: '[地理総合]Ｂ 国際理解と国際協力（2）地球的課題と国際協力空間的相互依存作用や地域などに着目して、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識を身に付けること。（ｱ） 世界各地で見られる地球環境問題、資源・エネルギー問題、人口・食料問題及び居住・都市問題などを基に、地球的課題の各地で共通する傾向性や課題相互の関連性などについて大観し理解すること。（ｲ） 世界各地で見られる地球環境問題、資源・エネルギー問題、人口・食料問題及び居住・都市問題などを基に、地球的課題の解決には持続可能な社会の実現を目指した各国の取組や国際協力が必要であることなどについて理解すること。'
  guideline_shared: false
  targets:
  - raw: 世界各地の人口、資源、産業の分布や動向、並びにそれらをめぐる地域相互の結びつき等について理解し、現代社会を地理的観点から説明できる。
