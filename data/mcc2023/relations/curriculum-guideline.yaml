    id: mcc2023:II-A:20
    method: content-name-in-section
  mcc_raw: ･ オームの法則やキルヒホッフの法則を用いて、電圧、電流、抵抗を求めることができる。･ 抵抗を直列接続及び並列接続したときの合成抵抗を求めることができる。･ ジュール熱や電力に関する計算ができる。
  goals_shared: false
  guideline_raw: '[物理基礎] (2) (ｳ) ㋐ 電気抵抗に関する実験などを行い、同じ物質からなる導体でも長さや断面積によって電気抵抗が異なることを見いだして理解すること。また、物質によって抵抗率が異なることを理解すること。（金属中の電流が自由電子の流れによることも扱うこと。また、半導体や絶縁体があることにも触れること。）[物理] (3) (ｱ) ㋐ 電荷が相互に及ぼし合う力を理解すること。また、電界の表し方を理解すること。（静電誘導も扱うこと。）(3) (ｱ) ㋑ 電界と電位との関係を静電気力による位置エネルギーと関連付けて理解すること。(3) (ｱ) ㋒ コンデンサーの性質を理解するとともに、電気容量を電界や電位差と関連付けて理解すること。(3) (ｱ) ㋓ 電気回路に関する実験などを行い、電気回路における基本的な法則を理解すること。'
  guideline_shared: true
  targets:
  - raw: オームの法則やキルヒホッフの法則を用いて、電圧、電流、抵抗を求めることができる。
