  mcc_raw: 言語的・文化的教養（語彙・知識等）に広く関心を持ち、そこで得られた知識や考え方を効果的な表現に活用できる。
  goals_shared: false
  guideline_raw: '[現代の国語 〔知識及び技能〕(1)]エ 実社会において理解したり表現したりするために必要な語句の量を増すとともに、語句や語彙の構造や特色、用法及び表記の仕方などを理解し、話や文章の中で使うことを通して、語感を磨き語彙を豊かにすること。[言語文化 目標] (1) 生涯にわたる社会生活に必要な国語の知識や技能を身に付けるとともに、我が国の言語文化に対する理解を深めることができるようにする。[言語文化 〔知識及び技能〕(1)]ア 言葉には、文化の継承、発展、創造を支える働きがあることを理解すること。ウ 我が国の言語文化に特徴的な語句の量を増し、それらの文化的背景について理解を深め、文章の中で使うことを通して、語感を磨き語彙を豊かにすること。エ 文章の意味は、文脈の中で形成されることを理解すること。[論理国語 〔知識及び技能〕(1)]イ 論証したり学術的な学習の基礎を学んだりするために必要な語句の量を増し、文章の中で使うことを通して、語感を磨き語彙を豊かにすること。'
  guideline_shared: false
  targets:
  - raw: 言語的・文化的教養（語彙・知識等）に広く関心を持ち、そこで得られた知識や考え方を効果的な表現に活用できる。
