    id: mcc2023:II-C:07
    method: content-name-in-section
  mcc_raw: ･ イオン化エネルギーと電子親和力について説明できる。･ 代表的なイオンを化学式で表すことができる。
  goals_shared: false
  guideline_raw: 【化学基礎】㋐ イオンとイオン結合イオンの生成を電子配置と関連付けて理解すること。また、イオン結合及びイオン結合でできた物質の性質を理解すること。多原子イオンも扱うこと。「イオン結合でできた物質」については、代表的なものを扱い、その用途にも触れること。
