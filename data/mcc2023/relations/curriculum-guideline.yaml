- id: mcc2023:rel:guideline:III-A-011
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-A 国語
  content:
    raw: 表現・コミュニケーション
    id: mcc2023:III-A:03
    method: content-name-in-section
  mcc_raw: 報告・論文の目的に応じて、印刷物、インターネットから適切な情報を収集し、それを整理、分析できる。
  goals_shared: false
  guideline_raw: '[言語文化 A 書くこと(1)]ア 自分の知識や体験の中から適切な題材を決め、集めた材料のよさや味わいを吟味して、表現したいことを明確にすること。[論理国語 〔知識及び技能〕(2)]ア 主張とその前提や反証など情報と情報との関係について理解を深めること。イ 情報を重要度や抽象度などによって階層化して整理する方法について理解を深め使うこと。[論理国語 A 書くこと(1)]ア 実社会や学術的な学習の基礎に関する事柄について、書き手の立場や論点などの様々な観点から情報を収集、整理して、目的や意図に応じた適切な題材を決めること。[論理国語 A 書くこと(2)]イ 設定した題材について、分析した内容を報告文などにまとめたり、仮説を立てて考察した内容を意見文などにまとめたりする活動。[国語表現 A 話すこと・聞くこと(1)]ア 目的や場に応じて、実社会の問題や自分に関わる事柄の中から話題を決め、他者との多様な交流を想定しながら情報を収集、整理して、伝え合う内容を検討すること。[国語表現 B 書くこと(2)]ウ 説明書や報告書の内容を、目的や読み手に応じて再構成し、広報資料などの別の形式に書き換える活動。[言語文化 A 書くこと(1)]ア 自分の知識や体験の中から適切な題材を決め、集めた材料のよさや味わいを吟味して、表現したいことを明確にすること。[論理国語 〔知識及び技能〕(2)]ア 主張とその前提や反証など情報と情報との関係について理解を深めること。イ 情報を重要度や抽象度などによって階層化して整理する方法について理解を深め使うこと。[論理国語 A 書くこと(1)]ア 実社会や学術的な学習の基礎に関する事柄について、書き手の立場や論点などの様々な観点から情報を収集、整理して、目的や意図に応じた適切な題材を決めること。[論理国語 A 書くこと(2)]イ 設定した題材について、分析した内容を報告文などにまとめたり、仮説を立てて考察した内容を意見文などにまとめたりする活動。[国語表現 A 話すこと・聞くこと(1)]ア 目的や場に応じて、実社会の問題や自分に関わる事柄の中から話題を決め、他者との多様な交流を想定しながら情報を収集、整理して、伝え合う内容を検討すること。[国語表現 B 書くこと(2)]ウ 説明書や報告書の内容を、目的や読み手に応じて再構成し、広報資料などの別の形式に書き換える活動。'
  guideline_shared: false
  targets:
  - raw: 報告・論文の目的に応じて、印刷物、インターネットから適切な情報を収集し、それを整理、分析できる。
    id: mcc2023:III-A:03.02
    method: text-exact-in-scope
