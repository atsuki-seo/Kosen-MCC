  mcc_raw: ･ 原子の構造（原子核・電子）や原子番号、質量数について説明できる。･ 同位体・放射性同位体について説明できる。
  goals_shared: false
  guideline_raw: 【化学基礎】㋐ 原子の構造原子の構造及び陽子、中性子、電子の性質を理解すること。原子番号、質量数及び同位体を扱うこと。その際、放射性同位体とその利用にも触れること。
  guideline_shared: false
