- id: mcc2023:rel:guideline:IV-C-007
  type: curriculum-guideline
  row_kind: content
  section: Ⅳ-C 工学基礎（情報リテラシー）
  content:
    raw: データサイエンス・AI
    id: mcc2023:IV-C:06
    method: content-name-in-section
  mcc_raw: ･ データサイエンス・AI技術の概要を説明できる。･ データサイエンス・AI技術が社会や日常生活における課題解決の有用なツールであり、様々な専門領域の知見と組み合わせることによって価値を創造するものであることを、活用事例をもとに説明できる。･ データサイエンス・AI技術を利活用する際に求められるモラルや倫理について理解し、データを守るために必要な事項を説明できる。･ データサイエンス・AI技術の利活用に必要な基本的スキル（データの取得、可視化、分析）を使うことができる。･ 自らの専門分野において、データサイエンス・AI技術と社会や日常生活との関わり、活用方法について説明できる。
  goals_shared: false
  guideline_raw: 【情報Ⅱ(3) 情報とデータサイエンス】ア(ア) 多様かつ大量のデータの存在やデータ活用の有用性、データサイエンスが社会に果たす役割について理解し、目的に応じた適切なデータの収集や整理、整形について理解し技能を身に付けること。ア(イ) データに基づく現象のモデル化やデータの処理を行い解釈・表現する方法について理解し技能を身に付けること。ア(ウ) データ処理の結果を基にモデルを評価することの意義とその方法について理解し技能を身に付けること。イ(ア) 目的に応じて、適切なデータを収集し、整理し、整形すること。イ(イ) 将来の現象を予測したり、複数の現象間の関連を明らかにしたりするために、適切なモデル化や処理、解釈・表現を行うこと。イ(ウ) モデルやデータ処理の結果を評価し、モデル化や処理、解釈・表現の方法を改善すること。
  guideline_shared: false
  targets:
  - raw: データサイエンス・AI技術の概要を説明できる。
    id: mcc2023:IV-C:06.01
    method: text-exact-in-scope
  - raw: データサイエンス・AI技術が社会や日常生活における課題解決の有用なツールであり、様々な専門領域の知見と組み合わせることによって価値を創造するものであることを、活用事例をもとに説明できる。
    id: mcc2023:IV-C:06.02
    method: text-exact-in-scope
  - raw: データサイエンス・AI技術を利活用する際に求められるモラルや倫理について理解し、データを守るために必要な事項を説明できる。
    id: mcc2023:IV-C:06.03
    method: text-exact-in-scope
  - raw: データサイエンス・AI技術の利活用に必要な基本的スキル（データの取得、可視化、分析）を使うことができる。
    id: mcc2023:IV-C:06.04
    method: text-exact-in-scope
  - raw: 自らの専門分野において、データサイエンス・AI技術と社会や日常生活との関わり、活用方法について説明できる。
    id: mcc2023:IV-C:06.05
    method: text-exact-in-scope
