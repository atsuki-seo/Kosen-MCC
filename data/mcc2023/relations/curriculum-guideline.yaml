  mcc_raw: 自己が主体的に参画していく社会について、基本的人権や民主主義などの基本原理と基礎的な政治・法・経済の仕組みを理解し、現代社会の諸課題について考察できる。
  goals_shared: true
  guideline_raw: '[公共]Ｂ 自立した主体としてよりよい社会の形成に参画する私たち自立した主体としてよりよい社会の形成に参画することに向けて、現実社会の諸課題に関わる具体的な主題を設定し、幸福、正義、公正などに着目して、他者と協働して主題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識及び技能を身に付けること。（ｱ） 法や規範の意義及び役割、多様な契約及び消費者の権利と責任、司法参加の意義などに関わる現実社会の事柄や課題を基に、憲法の下、適正な手続きに則り、法や規範に基づいて各人の意見や利害を公平・公正に調整し、個人や社会の紛争を調停、解決することなどを通して、権利や自由が保障、実現され、社会の秩序が形成、維持されていくことについて理解すること。（ｲ） 政治参加と公正な世論の形成、地方自治、国家主権、領土（領海、領空を含む。）、我が国の安全保障と防衛、国際貢献を含む国際社会における我が国の役割などに関わる現実社会の事柄や課題を基に、よりよい社会は、憲法の下、個人が議論に参加し、意見や利害の対立状況を調整して合意を形成することなどを通して築かれるものであることについて理解すること。（ｳ） 職業選択、雇用と労働問題、財政及び租税の役割、少子高齢社会における社会保障の充実・安定化、市場経済の機能と限界、金融の働き、経済のグローバル化と相互依存関係の深まり（国際社会における貧困や格差の問題を含む。）などに関わる現実社会の事柄や課題を基に、公正かつ自由な経済活動を行うことを通して資源の効率的な配分が図られること、市場経済システムを機能させたり国民福祉の向上に寄与したりする役割を政府などが担っていること及びより活発な経済活動と個人の尊重を共に成り立たせることが必要であることについて理解すること。（ｴ） 現実社会の諸課題に関わる諸資料から、自立した主体として活動するために必要な情報を適切かつ効果的に収集し、読み取り、まとめる技能を身に付けること。'
  guideline_shared: false
  targets:
  - raw: 自己が主体的に参画していく社会について、基本的人権や民主主義などの基本原理と基礎的な政治・法・経済の仕組みを理解し、現代社会の諸課題について考察できる。
    id: mcc2023:III-C:02.02
    method: text-exact-in-scope
