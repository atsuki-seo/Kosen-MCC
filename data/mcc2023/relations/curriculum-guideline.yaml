- id: mcc2023:rel:guideline:II-C-021
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-C 化学
  content: null
  content_raw: （該当なし）
  mcc_raw: ''
  goals_shared: false
  guideline_raw: 【化学】㋒ 固体の構造結晶格子の概念及び結晶の構造を理解すること。「結晶の構造」については、体心立方格子、面心立方格子及び六方最密構造を扱うこと。また、アモルファスにも触れること。㋐ 溶解平衡溶解の仕組みを理解すること。また、溶解度を溶解平衡と関連付けて理解すること。固体及び気体の溶解度を扱うこと。㋑ 溶液とその性質溶液とその性質に関する実験などを行い、身近な現象を通して溶媒と溶液の性質の違いを理解すること。蒸気圧降下、沸点上昇、凝固点降下及び浸透圧を扱うこと。また、コロイド溶液も扱うこと。㋐ 化学反応と熱・光化学反応と熱や光に関する実験などを行い、化学反応における熱及び光の発生や吸収は、反応の前後における物質のもつ化学エネルギーの差から生じることを理解すること。ヘスの法則を扱うこと。また、結合エネルギーにも触れるとともに、吸熱反応が自発的に進む要因にも定性的に触れること。㋐ 反応速度反応速度の表し方及び反応速度に影響を与える要因を理解すること。簡単な反応を扱うこと。「要因」については、濃度、温度及び触媒の有無を扱うこと。㋑ 化学平衡とその移動可逆反応、化学平衡及び化学平衡の移動を理解すること。ルシャトリエの原理を中心に扱うこと。㋒ 典型元素典型元素に関する実験などを行い、典型元素の性質が周期表に基づいて整理できることを理解すること。性質が類似する同族元素の単体や化合物を中心に扱うこと㋓ 遷移元素遷移元素の単体と化合物の性質を理解すること。クロム、マンガン、鉄、銅、亜鉛及び銀を扱うこと。㋐ 炭化水素脂肪族炭化水素の性質や反応を構造と関連付けて理解すること。㋑ 官能基をもつ化合物官能基をもつ脂肪族化合物に関する実験などを行い、その構造、性質及び反応について理解すること。アルコール、エーテル、アルデヒド、ケトン、カルボン酸及びエステルを取り上げ、それらの性質は炭素骨格及び官能基により特徴付けられることを扱うこと。また、鏡像異性体にも触れること。㋒ 芳香族化合物芳香族化合物の構造、性質及び反応について理解すること。芳香族炭化水素、フェノール類、芳香族カルボン酸及び芳香族アミンを扱うこと。㋐ 合成高分子化合物合成高分子化合物の構造、性質及び合成について理解すること。代表的な合成繊維及びプラスチックを扱うこと。㋑ 天然高分子化合物天然高分子化合物の構造や性質について理解すること。繊維や食物を構成している代表的な天然高分子化合物を扱うこと。その際、単糖類、二糖類及びアミノ酸も扱うこと。
  guideline_shared: false
  targets: []
  source:
    page_pdf: 193
    page_printed: 175
    pages_pdf:
    - 193
    - 194
    page_top: true
  verification: image
- id: mcc2023:rel:guideline:II-E-001
  type: curriculum-guideline
  row_kind: objective
  section: Ⅱ-E ライフサイエンス・アースサイエンス
  content:
    raw: Ⅱ-E ライフサイエンス・アースサイエンス
    id: mcc2023:II-E
    method: code+name
  targets: []
  mcc_raw: 【教育領域の到達目標】工学系・理学系エンジニアとして今後必須である地球環境や生物環境に配慮した持続可能な社会を構築するために必要なライフサイエンス・アースサイエンスの基礎知識を身に付ける。(1) 生命の共通性と多様性地球上の生物は多様であり、かつ共通性があることを理解し、生命の起源について理解すること。(2) 生物の生命活動と生態系地球における生物の生命活動を理解するだけでなく、 生態系の構成要素も理解することで地球環境が人間活動と関わりが深いことを理解すること。(3) 惑星としての地球地球が太陽系における惑星のひとつであることを理解し、その活動が太陽の放射エネルギーを原動力としていることを理解すること。(4) 地球の歴史と地球環境地球の歴史を理解し、地球表層や内部に見られる地学的事象を理解すること。(5) 人間活動と地球環境人間活動によって、地球環境を改善する方法について考えることができる。
  goals_shared: false
  guideline_raw: 自然の事物・現象に関わり、理科の見方・考え方を働かせ、見通しをもって観察、実験を行うことなどを通して、自然の事物・現象を科学的に探究するために必要な資質・能力を次のとおり育成することを目指す。（1） 自然と人間生活との関わり及び科学技術と人間生活との関わりについての理解を深め、科学的に探究するために必要な観察、実験などに関する技能を身に付けるようにする。（2） 観察、実験などを行い、人間生活と関連付けて科学的に探究する力を養う。（3） 自然の事物・現象に進んで関わり、科学的に探究しようとする態度を養うとともに、科学に対する興味・関心を高める。
  guideline_shared: false
  source:
    page_pdf: 194
    page_printed: 176
