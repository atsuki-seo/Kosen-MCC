  guideline_raw: 数学Ⅰ(4) データの分析ア(ウ） 具体的な事象において仮説検定の考え方を理解すること。数学A (3) 数学と人間の活動ア(ア) 数量や図形に関する概念などと人間の活動との関わりについて理解すること。ア(イ) 数学史的な話題、数理的なゲームやパズルなどを通して、数学と文化との関わりについての理解を深めること。数学 B (1) 数列ア(ウ) 漸化式について理解し、事象の変化を漸化式で表したり、簡単な漸化式で表された数列の一般項を求めたりすること。ア(エ) 数学的帰納法について理解すること。数学 B (2) 統計的な推測ア(ア） 標本調査の考え方について理解を深めること。ア(エ） 正規分布を用いた区間推定及び仮説検定の方法を理解すること。数学 B (3) 数学と社会生活ア(ア） 社会生活などにおける問題を、数学を活用して解決する意義について理解すること。数学C (2) 平面上の曲線と複素数平面ア(エ) 複素数平面と複素数の極形式、複素数の実数倍、和、差、積及び商の図形的な意味を理解すること。ア(オ) ド・モワブルの定理について理解すること。数学C (3) 数学的な表現の工夫ア(イ) 日常の事象や社会の事象などを、離散グラフや行列を用いて工夫して表現することの意義を理解すること。
  guideline_shared: false
  targets: []
  source:
    page_pdf: 188
    page_printed: 170
  verification: machine
- id: mcc2023:rel:guideline:II-A-001
  type: curriculum-guideline
  row_kind: objective
  section: Ⅱ-A 物理
  content:
    raw: Ⅱ-A 物理
    id: mcc2023:II-A
    method: code+name
  targets: []
  mcc_raw: 【教育領域の到達目標】物理学の基本知識を習得し、自らの工学分野に応用できる。さらにその過程で、自然現象を系統的・論理的に考えていく能力を養い、広く自然の諸現象を科学的に解明するための物理的な見方、考え方を身に付ける。(1) 物体の運動及びエネルギーに関する基礎的な計算をすることができる。(2) 熱や波、電気に関する様々な現象を物理法則と関連付けて考えることができる。
  goals_shared: false
  guideline_raw: '[物理基礎]物体の運動と様々なエネルギーに関わり、理科の見方・考え方を働かせ、見通しをもって観察、実験を行うことなどを通して、物体の運動と様々なエネルギーを科学的に探究するために必要な資質・能力を次のとおり育成することを目指す。（1） 日常生活や社会との関連を図りながら、物体の運動と様々なエネルギーについて理解するとともに、科学的に探究するために必要な観察、実験などに関する基本的な技能を身に付けるようにする。（2） 観察、実験などを行い、科学的に探究する力を養う。（3） 物体の運動と様々なエネルギーに主体的に関わり、科学的に探究しようとする態度を養う。[物理]物理的な事物・現象に関わり、理科の見方・考え方を働かせ、見通しをもって観察、実験を行うことなどを通して、物理的な事物・現象を科学的に探究するために必要な資質・能力を次のとおり育成することを目指す。（1） 物理学の基本的な概念や原理・法則の理解を深め、科学的に探究するために必要な観察、実験などに関する技能を身に付けるようにする。（2） 観察、実験などを行い、科学的に探究する力を養う。（3） 物理的な事物・現象に主体的に関わり、科学的に探究しようとする態度を養う。'
  guideline_shared: false
  source:
    page_pdf: 189
    page_printed: 171
  verification: machine
- id: mcc2023:rel:guideline:II-A-002
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: 物体の運動（力学分野）
    id: mcc2023:II-A:01
    method: content-name-in-section
  mcc_raw: ･ 速度と加速度の概念を説明できる。･ 平均の速度、平均の加速度に関する計算ができる。･ 直線及び平面運動において、速度をベクトルとして捉え、速度の合成・分解及び相対速度に関する計算ができる。･ 等加速度直線運動の公式を用いて、物体の変位、時間、速度に関する計算ができる。･ 平面内を移動する質点の運動を位置ベクトルの変化として扱うことができる。･ 物体の変位、速度、加速度を微分・積分を用いて相互に計算できる。
  goals_shared: false
  guideline_raw: '[物理基礎] (1) (ｱ) ㋐ 身近な物理現象について、物理量の測定と表し方、分析の手法を理解すること。（「物理基礎」の学習全体に通じる手法などを扱うこと。）(1) (ｱ) ㋑ 物体の運動の表し方について、直線運動を中心に理解すること。(1) (ｱ) ㋒ 速度が変化する物体の直線運動に関する実験などを行い、速度と時間との関係を見いだして理解するとともに、物体が直線運動する場合の加速度を理解すること。[物理] (1) (ｱ) ㋐ 平面内を運動する物体の運動について理解すること。（物体の平面内の運動を表す変位、速度及び加速度はベクトルで表されることを扱うこと。）'
  guideline_shared: false
  targets:
  - raw: 速度と加速度の概念を説明できる。
    id: mcc2023:II-A:01.01
    method: text-exact-in-scope
  - raw: 平均の速度、平均の加速度に関する計算ができる。
    id: mcc2023:II-A:01.02
    method: text-exact-in-scope
  - raw: 直線及び平面運動において、速度をベクトルとして捉え、速度の合成・分解及び相対速度に関する計算ができる。
    id: mcc2023:II-A:01.03
    method: text-exact-in-scope
  - raw: 等加速度直線運動の公式を用いて、物体の変位、時間、速度に関する計算ができる。
    id: mcc2023:II-A:01.04
    method: text-exact-in-scope
  - raw: 平面内を移動する質点の運動を位置ベクトルの変化として扱うことができる。
    id: mcc2023:II-A:01.05
    method: text-exact-in-scope
  - raw: 物体の変位、速度、加速度を微分・積分を用いて相互に計算できる。
    id: mcc2023:II-A:01.06
    method: text-exact-in-scope
  source:
    page_pdf: 189
    page_printed: 171
  verification: machine
- id: mcc2023:rel:guideline:II-A-003
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: 落体の運動（力学分野）
    id: mcc2023:II-A:02
    method: content-name-in-section
  mcc_raw: ･ 自由落下及び鉛直投射した物体の変位、速度、時間に関する計算ができる。･ 水平投射及び斜方投射した物体の変位、速度、時間に関する計算ができる。
  goals_shared: false
  guideline_raw: '[物理基礎] (1) (ｲ) ㋓ 物体が落下する際の運動の特徴及び物体に働く力と運動との関係について理解すること。（自由落下、鉛直投射を扱い、水平投射にも定性的に触れること。）[物理] (1) (ｱ) ㋑ 水平投射及び斜方投射された物体の運動を直線運動と関連付けて理解すること。（物体の水平投射や斜方投射における速度、加速度、重力の働きなどを扱うこと。）'
  guideline_shared: false
  targets:
  - raw: 自由落下及び鉛直投射した物体の変位、速度、時間に関する計算ができる。
    id: mcc2023:II-A:02.01
    method: text-exact-in-scope
  - raw: 水平投射及び斜方投射した物体の変位、速度、時間に関する計算ができる。
    id: mcc2023:II-A:02.02
    method: text-exact-in-scope
  source:
    page_pdf: 189
    page_printed: 171
  verification: machine
