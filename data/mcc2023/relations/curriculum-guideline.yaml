    method: content-name-in-section
  mcc_raw: 日常的な話題や社会的な話題について、基本的な表現を用いて、情報や考え、気持ちなどを話すことができる。
  goals_shared: false
  guideline_raw: 第１ 英語コミュニケーションI (3)言語活動及び言語の働きに関する事項①言語活動に関する事項エ 話すこと[やり取り] (ｱ) 身近な出来事や家庭生活などの日常的な話題について、使用する語句や文、やり取りの具体的な進め方が十分に示される状況で、情報や考え、気持ちなどを即興で伝え合う活動。また、やり取りした内容を整理して発表したり、文章を書いたりする活動。(ｲ) 社会的な話題について、使用する語句や文、やり取りの具体的な進め方が十分に示される状況で、対話や説明などを聞いたり読んだりして、賛成や反対の立場から、情報や考え、気持ちなどを理由や根拠とともに伝え合う活動。また、やり取りした内容を踏まえて、自分自身の考えなどを整理して発表したり、文章を書いたりする活動。
  guideline_shared: false
  targets:
