  mcc_raw: 帝国主義諸国の抗争を経て二つの世界大戦に至る日本を含む世界の動向の概要を説明し、平和の意義について考察できる。
  goals_shared: false
  guideline_raw: '[歴史総合] B 近代化と私たち（3）国民国家と明治維新諸資料を活用し、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識を身に付けること。（ｱ） 18 世紀後半以降の欧米の市民革命や国民統合の動向、日本の明治維新や大日本帝国憲法の制定などを基に、立憲体制と国民国家の形成を理解すること。（ｲ） 列強の進出と植民地の形成、日清・日露戦争などを基に、列強の帝国主義政策とアジア諸国の変容を理解すること。'
