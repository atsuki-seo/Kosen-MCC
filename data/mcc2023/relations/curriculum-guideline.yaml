- id: mcc2023:rel:guideline:II-A-009
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-A 物理
  content:
    raw: 力学的エネルギー（力学分野）
    id: mcc2023:II-A:06
    method: content-name-in-section
  mcc_raw: ･ 仕事と仕事率に関する計算ができる。･ 物体の運動エネルギーに関する計算ができる。･ 重力による位置エネルギーに関する計算ができる。･ 弾性力による位置エネルギーに関する計算ができる。･ 力学的エネルギー保存の法則について説明でき、その法則を用いて、物体の速度や変位などを求めることができる。
  goals_shared: false
  guideline_raw: '[物理基礎] (1) (ｳ) ㋐ 運動エネルギーと位置エネルギーについて、仕事と関連付けて理解すること。（「位置エネルギー」については、重力による位置エネルギー、弾性力による位置エネルギーを扱うこと。）(1) (ｳ) ㋑ 力学的エネルギーに関する実験などを行い、力学的エネルギー保存の法則を仕事と関連付けて理解すること。（摩擦や空気抵抗がない場合は力学的エネルギーが保存されることを中心に扱うこと。）'
  guideline_shared: false
  targets:
  - raw: 仕事と仕事率に関する計算ができる。
    id: mcc2023:II-A:06.01
    method: text-exact-in-scope
  - raw: 物体の運動エネルギーに関する計算ができる。
    id: mcc2023:II-A:06.02
    method: text-exact-in-scope
  - raw: 重力による位置エネルギーに関する計算ができる。
    id: mcc2023:II-A:06.03
    method: text-exact-in-scope
  - raw: 弾性力による位置エネルギーに関する計算ができる。
    id: mcc2023:II-A:06.04
