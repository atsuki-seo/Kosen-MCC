- id: mcc2023:rel:guideline:III-A-006
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-A 国語
  content:
    raw: 言語・文化
    id: mcc2023:III-A:02
    method: content-name-in-section
  mcc_raw: 文学作品（小説・随筆・詩歌・古典等）を文脈に即して鑑賞し、そこに描かれたものの見方や登場人物の心情を説明できる。
  goals_shared: false
  guideline_raw: '[言語文化 目標] (1) 生涯にわたる社会生活に必要な国語の知識や技能を身に付けるとともに、我が国の言語文化に対する理解を深めることができるようにする。[言語文化 目標] (3) 言葉がもつ価値への認識を深めるとともに、生涯にわたって読書に親しみ自己を向上させ、我が国の言語文化の担い手としての自覚をもち、言葉を通して他者や社会に関わろうとする態度を養う。[言語文化 B 読むこと(1)]ア 文章の種類を踏まえて、内容や構成、展開などについて叙述を基に的確に捉えること。イ 作品や文章に表れているものの見方、感じ方、考え方を捉え、内容を解釈すること。ウ 文章の構成や展開、表現の仕方、表現の特色について評価すること。エ 作品や文章の成立した背景や他の作品などとの関係を踏まえ、内容の解釈を深めること。オ 作品の内容や解釈を踏まえ、自分のものの見方、感じ方、考え方を深め、我が国の言語文化について自分の考えをもつこと。[文学国語 目標] (2) 深く共感したり豊かに想像したりする力を伸ばすとともに、創造的に考える力を養い、他者との関わりの中で伝え合う力を高め、自分の思いや考えを広げたり深めたりすることができるようにする。[文学国語 B 読むこと(1)]イ 語り手の視点や場面の設定の仕方、表現の特色について評価することを通して、内容を解釈すること。オ 作品に表れているものの見方、感じ方、考え方を捉えるとともに、作品が成立した背景や他の作品などとの関係を踏まえ、作品の解釈を深めること。[古典探究 目標] (1) 生涯にわたる社会生活に必要な国語の知識や技能を身に付けるとともに、我が国の伝統的な言語文化に対する理解を深めることができるようにする。(2) 論理的に考える力や深く共感したり豊かに想像したりする力を伸ばし、古典などを通した先人のものの見方、感じ方、考え方との関わりの中で伝え合う力を高め、自分の思いや考えを広げたり深めたりすることができるようにする。[古典探究 A 読むこと(1)]ア 文章の種類を踏まえて、構成や展開などを的確に捉えること。エ 作品の成立した背景や他の作品などとの関係を踏まえながら古典などを読み、その内容の解釈を深め、作品の価値について考察すること。ク 古典の作品や文章を多面的・多角的な視点から評価することを通して、我が国の言語文化について自分の考えを広げたり深めたりすること。'
  guideline_shared: false
  targets:
  - raw: 文学作品（小説・随筆・詩歌・古典等）を文脈に即して鑑賞し、そこに描かれたものの見方や登場人物の心情を説明できる。
    id: mcc2023:III-A:02.01
    method: text-exact-in-scope
