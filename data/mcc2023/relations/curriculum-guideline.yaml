  guideline_raw: '*1［科学と人間生活]（1）科学技術の発展科学技術の発展について、次の事項を身に付けることができるよう指導する。ア 科学技術の発展が今日の人間生活に対してどのように貢献してきたかについて理解すること。イ 科学技術の発展と人間生活との関わりについて科学的に考察し表現すること。（2）人間生活の中の科学身近な自然の事物・現象及び日常生活や社会の中で利用されている科学技術を取り上げ、それらについての観察、実験などを通して、次の事項を身に付けることができるよう指導する。ア 光や熱の科学、物質の科学、生命の科学、宇宙や地球の科学と人間生活との関わりについて認識を深めるとともに、それらの観察、実験などに関する技能を身に付けること。イ 光や熱の科学、物質の科学、生命の科学、宇宙や地球の科学について、問題を見いだし見通しをもって観察、実験などを行い、人間生活と関連付けて、科学的に考察し表現すること。（3）これからの科学と人間生活自然と人間生活との関わり及び科学技術と人間生活との関わりについての学習を踏まえて、課題を設定し探究することで、次の事項を身に付けることができるよう指導する。ア これからの科学と人間生活との関わり方について認識を深めること。イ これからの科学と人間生活との関わり方について科学的に考察し表現すること。'
