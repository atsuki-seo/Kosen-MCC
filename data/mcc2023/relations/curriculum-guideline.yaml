  guideline_raw: '[現代の国語 目標] (2) 論理的に考える力や深く共感したり豊かに想像したりする力を伸ばし、他者との関わりの中で伝え合う力を高め、自分の思いや考えを広げたり深めたりすることができるようにする。[言語文化 目標] (3) 言葉がもつ価値への認識を深めるとともに、生涯にわたって読書に親しみ自己を向上させ、我が国の言語文化の担い手としての自覚をもち、言葉を通して他者や社会に関わろうとする態度を養う。[論理国語 B 読むこと(2)]イ 社会的な話題について書かれた論説文やその関連資料を読み、それらの内容を基に、自分の考えを論述したり討論したりする活動。ウ 学術的な学習の基礎に関する事柄について書かれた短い論文を読み、自分の考えを論述したり発表したりする活動。[国語表現 A 話すこと・聞くこと(1)]カ 視点を明確にして聞きながら、話の内容に対する共感を伝えたり、相手の思いや考えを引き出したりする工夫をして、自分の思いや考えを広げたり深めたりすること。[国語表現 A 話すこと・聞くこと(2)]イ 他者に連絡したり、紹介や依頼などをするために話をしたり、それらを聞いて批評したりする活動。[国語表現 B 書くこと(2)]オ 設定した題材について多様な資料を集め、調べたことを整理したり話し合ったりして、自分や集団の意見を提案書などにまとめる活動。'
  guideline_shared: false
