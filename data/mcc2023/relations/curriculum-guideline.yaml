  mcc_raw: 現代社会の特質や課題に関する適切な主題を設定し、資料を活用して探究し、その成果を論述したり討論したりするなどの活動を通して、世界の人々が協調し共存できる持続可能な社会の実現について人文・社会科学の観点から多面的・多角的に考察、構想し、表現できる。
  goals_shared: true
  guideline_raw: '[公共]Ｃ 持続可能な社会づくりの主体となる私たち持続可能な地域、国家・社会及び国際社会づくりに向けた役割を担う、公共の精神をもった自立した主体となることに向けて、幸福、正義、公正などに着目して、現代の諸課題を探究する活動を通して、次の事項を身に付けることができるよう指導する。ア 地域の創造、よりよい国家・社会の構築及び平和で安定した国際社会の形成へ主体的に参画し、共に生きる社会を築くという観点から課題を見いだし、その課題の解決に向けて事実を基に協働して考察、構想し、妥当性や効果、実現可能性などを指標にして、論拠を基に自分の考えを説明、論述すること。'
  guideline_shared: false
  targets:
  - raw: 現代社会の特質や課題に関する適切な主題を設定し、資料を活用して探究し、その成果を論述したり討論したりするなどの活動を通して、世界の人々が協調し共存できる持続可能な社会の実現について人文・社会科学の観点から多面的・多角的に考察、構想し、表現できる。
