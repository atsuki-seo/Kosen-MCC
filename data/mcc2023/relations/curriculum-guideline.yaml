  mcc_raw: ･ 情報通信ネットワークの仕組みや構成及び構成要素、プロトコルの役割や技術についての知識を持ち、社会における情報通信ネットワークの役割を説明できる。
  goals_shared: false
  guideline_raw: 【情報Ⅰ（4）情報通信ネットワークとデータの活用】ア(ア) 情報通信ネットワークの仕組みや構成要素、プロトコルの役割及び情報セキュリティを確保するための方法や技術について理解すること。ア(イ) データを蓄積、管理、提供する方法、情報通信ネットワークを介して情報システムがサービスを提供する仕組みと特徴について理解すること。イ(ア) 目的や状況に応じて、情報通信ネットワークにおける必要な構成要素を選択するとともに、情報セキュリティを確保する方法について考えること。イ(イ) 情報システムが提供するサービスの効果的な活用について考えること。
