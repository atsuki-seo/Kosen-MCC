    id: mcc2023:II-C:06
    method: content-name-in-section
  mcc_raw: ･ 原子の電子配置について電子殻を用いて書き表すことができる。･ 価電子の働きについて説明できる。
  goals_shared: false
  guideline_raw: 【化学基礎】㋑ 電子配置と周期表元素の周期律及び原子の電子配置と周期表の族や周期との関係について理解すること。代表的な典型元素を扱うこと。「元素の周期律」については、イオン化エネルギーの変化にも触れること。
