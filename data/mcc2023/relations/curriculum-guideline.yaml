- id: mcc2023:rel:guideline:IV-C-006
  type: curriculum-guideline
  row_kind: content
  section: Ⅳ-C 工学基礎（情報リテラシー）
  content:
    raw: 情報セキュリティ
    id: mcc2023:IV-C:05
    method: content-name-in-section
  mcc_raw: ･ 情報セキュリティの必要性を理解し、対策について説明できる。･ 情報セキュリティを支える暗号技術の基礎を説明できる。･ 情報セキュリティに基づいた情報へのアクセス方法を説明できる。･ 情報や通信に関連する法令や規則等と、その必要性について説明できる。･ 情報社会で生活する上でのマナー、モラルの重要性について説明できる。･ 情報セキュリティを運用するための考え方と方法を説明できる。
  goals_shared: false
  guideline_raw: 【情報Ⅰ(1) 情報社会の問題解決】ア(イ) 情報に関する法規や制度、情報セキュリティの重要性、情報社会における個人の責任及び情報モラルについて理解すること。イ(イ) 情報に関する法規や制度及びマナーの意義、情報社会において個人の果たす役割や責任、情報モラルなどについて、それらの背景を科学的に捉え、考察すること。【情報Ⅰ(4) 情報通信ネットワークとデータの活用】ア(ア) 情報通信ネットワークの仕組みや構成要素、プロトコルの役割及び情報セキュリティを確保するための方法や技術について理解すること。イ(ア) 目的や状況に応じて、情報通信ネットワークにおける必要な構成要素を選択するとともに、情報セキュリティを確保する方法について考えること。【情報Ⅱ(4) 情報システムとプログラミング】ア(ア) 情報システムにおける、情報の流れや処理の仕組み、情報セキュリティを確保する方法や技術について理解すること。イ(ア) 情報システム及びそれによって提供されるサービスについて、その在り方や社会に果たす役割と及ぼす影響について考察すること。
  guideline_shared: false
  targets:
  - raw: 情報セキュリティの必要性を理解し、対策について説明できる。
    id: mcc2023:IV-C:05.01
    method: text-exact-in-scope
  - raw: 情報セキュリティを支える暗号技術の基礎を説明できる。
    id: mcc2023:IV-C:05.02
    method: text-exact-in-scope
  - raw: 情報セキュリティに基づいた情報へのアクセス方法を説明できる。
    id: mcc2023:IV-C:05.03
    method: text-exact-in-scope
  - raw: 情報や通信に関連する法令や規則等と、その必要性について説明できる。
    id: mcc2023:IV-C:05.04
    method: text-exact-in-scope
  - raw: 情報社会で生活する上でのマナー、モラルの重要性について説明できる。
    id: mcc2023:IV-C:05.05
    method: text-exact-in-scope
  - raw: 情報セキュリティを運用するための考え方と方法を説明できる。
