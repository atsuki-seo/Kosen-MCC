- id: mcc2023:rel:guideline:I-004
  type: curriculum-guideline
  row_kind: content
  section: Ⅰ 数学
  content:
    raw: 関数とグラフ
    id: mcc2023:I:03
    method: content-name-in-section
  mcc_raw: ･ 二次関数の性質及びグラフを理解し、最大値や最小値を求めることができる。･ 分数関数や無理関数の性質及びグラフを理解し、分数関数や無理関数を含む不等式に応用できる。･ 与えられた関数の逆関数を求め、その性質を説明できる。
  goals_shared: false
  guideline_raw: 数学Ⅰ(3) 二次関数ア(ア) 二次関数の値の変化やグラフの特徴について理解すること。ア(イ) 二次関数の最大値や最小値を求めること。ア(ウ) 二次方程式の解と二次関数のグラフとの関係について理解すること。また、二次不等式の解と二次関数のグラフとの関係について理解し、二次関数のグラフを用いて二次不等式の解を求めること。数学Ⅲ(1) 極限ア(ウ) 簡単な分数関数と無理関数の値の変化やグラフの特徴について理解すること。ア(エ) 合成関数や逆関数の意味を理解し、簡単な場合についてそれらを求めること。
  guideline_shared: false
  targets:
  - raw: 二次関数の性質及びグラフを理解し、最大値や最小値を求めることができる。
    id: mcc2023:I:03.01
    method: text-exact-in-scope
  - raw: 分数関数や無理関数の性質及びグラフを理解し、分数関数や無理関数を含む不等式に応用できる。
    id: mcc2023:I:03.02
    method: text-exact-in-scope
  - raw: 与えられた関数の逆関数を求め、その性質を説明できる。
    id: mcc2023:I:03.03
