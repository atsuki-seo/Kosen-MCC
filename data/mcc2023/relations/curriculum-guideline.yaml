  type: curriculum-guideline
  row_kind: content
  section: Ⅰ 数学
  content:
    raw: 数列
    id: mcc2023:I:08
    method: content-name-in-section
  mcc_raw: ･ 等差数列・等比数列の一般項やその和を求めることができる。･ 数列の和を総和記号を用いて表し、その和を求めることができる。･ 数列の極限を求めることができる。･ 無限等比級数の収束・発散を調べ、その和を求めることができる。
  goals_shared: false
  guideline_raw: 数学 B (1) 数列ア(ア) 等差数列と等比数列について理解し、それらの一般項や和を求めること。ア(イ) いろいろな数列の一般項や和を求める方法について理解すること。数学Ⅲ(1) 極限ア(ア) 数列の極限について理解し、数列 {𝛾𝑛} の極限などを基に簡単な数列の極限を求めること。ア(イ) 無限級数の収束、発散について理解し、無限等比級数などの簡単な無限級数の和を求めること。
  guideline_shared: false
  targets:
