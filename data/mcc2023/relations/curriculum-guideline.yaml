- id: mcc2023:rel:guideline:III-A-010
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-A 国語
  content:
    raw: 表現・コミュニケーション
    id: mcc2023:III-A:03
    method: content-name-in-section
  mcc_raw: 実用的な文章（手紙・メール等）を、相手や目的に応じた体裁や語句を用いて作成できる。
  goals_shared: false
  guideline_raw: '[現代の国語 B 書くこと(1)]ウ 自分の考えや事柄が的確に伝わるよう、根拠の示し方や説明の仕方を考えるとともに、文章の種類や、文体、語句などの表現の仕方を工夫すること。[国語表現 〔知識及び技能〕(1)]エ 実用的な文章などの種類や特徴、構成や展開の仕方などについて理解を深めること。[国語表現 B 書くこと(1)]カ 読み手に対して自分の思いや考えが効果的に伝わるように書かれているかなどを吟味して、文章全体を整えたり、読み手からの助言などを踏まえて、自分の文章の特長や課題を捉え直したりすること。[国語表現 B 書くこと(2)]エ 紹介、連絡、依頼などの実務的な手紙や電子メールを書く活動。'
  guideline_shared: false
  targets:
  - raw: 実用的な文章（手紙・メール等）を、相手や目的に応じた体裁や語句を用いて作成できる。
