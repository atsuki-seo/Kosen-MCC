- id: mcc2023:rel:guideline:I-006
  type: curriculum-guideline
  row_kind: content
  section: Ⅰ 数学
  content:
    raw: 三角関数
    id: mcc2023:I:05
    method: content-name-in-section
  mcc_raw: ･ 角を弧度法で表現することができる。･ 鋭角の三角比及び一般角の三角関数の値を求めることができる。･ 三角関数の性質及びグラフを理解し、三角関数を含む方程式・不等式を解くことができる。･ 加法定理を利用できる。
  goals_shared: false
  guideline_raw: 数学Ⅰ(2) 図形と計量ア(ア） 鋭角の三角比の意味と相互関係について理解すること。ア(イ） 三角比を鈍角まで拡張する意義を理解し、鋭角の三角比の値を用いて鈍角の三角比の値を求める方法を理解すること。ア(ウ） 正弦定理や余弦定理について三角形の決定条件や三平方の定理と関連付けて理解し、三角形の辺の長さや角の大きさを求めること。数学Ⅱ(4) 三角関数ア(ア)角の概念を一般角まで拡張する意義や弧度法による角度の表し方について理解すること。ア(イ)三角関数の値の変化やグラフの特徴について理解すること。ア(ウ)三角関数の相互関係などの基本的な性質を理解すること。ア(エ)三角関数の加法定理や2倍角の公式、三角関数の合成について理解すること。
  guideline_shared: false
  targets:
  - raw: 角を弧度法で表現することができる。
    id: mcc2023:I:05.01
    method: text-exact-in-scope
  - raw: 鋭角の三角比及び一般角の三角関数の値を求めることができる。
    id: mcc2023:I:05.02
    method: text-exact-in-scope
  - raw: 三角関数の性質及びグラフを理解し、三角関数を含む方程式・不等式を解くことができる。
    id: mcc2023:I:05.03
    method: text-exact-in-scope
  - raw: 加法定理を利用できる。
