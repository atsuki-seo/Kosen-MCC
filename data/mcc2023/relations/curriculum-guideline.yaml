  mcc_raw: ･ 自然光と偏光の違いについて説明できる。･ 光の反射角、屈折角に関する計算ができる。･ 波長の違いによる分散現象によってスペクトルが生じることを説明できる。･ 光の回折及び干渉について、具体例を挙げて説明できる。
