- id: mcc2023:rel:guideline:II-C-001
  type: curriculum-guideline
  row_kind: objective
  section: Ⅱ-C 化学
  content:
    raw: Ⅱ-C 化学
    id: mcc2023:II-C
    method: code+name
  targets: []
  mcc_raw: 【教育領域の到達目標】化学の基本知識を修得し、自らの工学分野に応用できる。さらにその過程で、自然現象を系統的・論理的に考えていく能力を養い、広く自然の諸現象を科学的に解明するための化学的な見方、考え方を身に付ける。
  goals_shared: false
  guideline_raw: 【化学基礎】物質とその変化に関わり、理科の見方・考え方を働かせ、見通しをもって観察、実験を行うことなどを通して、物質とその変化を科学的に探究するために必要な資質・能力を次のとおり育成することを目指す。（1） 日常生活や社会との関連を図りながら、物質とその変化について理解するとともに、科学的に探究するために必要な観察、実験などに関する基本的な技能を身に付けるようにする。（2）観察、実験などを行い、科学的に探究する力を養う。（3）物質とその変化に主体的に関わり、科学的に探究しようとする態度を養う。【化学】化学的な事物・現象に関わり、理科の見方・考え方を働かせ、見通しをもって観察、実験を行うことなどを通して、化学的な事物・現象を科学的に探究するために必要な資質・能力を次のとおり育成することを目指す。（1）化学の基本的な概念や原理・法則の理解を深め、科学的に探究するために必要な観察、実験などに関する技能を身に付けるようにする。（2）観察、実験などを行い、科学的に探究する力を養う。（3）化学的な事物・現象に主体的に関わり、科学的に探究しようとする態度を養う
  guideline_shared: false
  source:
    page_pdf: 191
    page_printed: 173
  verification: machine
- id: mcc2023:rel:guideline:II-C-002
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-C 化学
  content:
    raw: 化学と人間生活のかかわり
    id: mcc2023:II-C:01
    method: content-name-in-section
  mcc_raw: ･ 化学と現代の社会課題との関連性について説明できる。
  goals_shared: false
  guideline_raw: 【化学基礎】㋐ 化学の特徴日常生活や社会を支える身近な物質の性質を調べる活動を通して、物質を対象とする科学である化学の特徴について理解すること。㋐ 化学が拓く世界この科目で学んだ事柄が、日常生活や社会を支えている科学技術と結び付いていることを理解すること。<解説：日常生活や社会で利用されている科学技術の具体的事例を取り上げること。【化学】㋐ 様々な物質と人間生活化学が果たしてきた役割として、無機物質、有機化合物及び高分子化合物がそれぞれの特徴を生かして人間生活の中で利用されていることを理解すること。人間生活に利用されている代表的な物質を扱うこと。㋑ 化学が築く未来化学の成果が様々な分野で利用され、未来を築く新しい科学技術の基盤となっていることを理解すること。化学の発展と科学技術の進展に対する興味を喚起するような成果を取り上げること。
  guideline_shared: false
  targets:
  - raw: 化学と現代の社会課題との関連性について説明できる。
    id: mcc2023:II-C:01.01
    method: text-exact-in-scope
  source:
    page_pdf: 191
    page_printed: 173
    pages_pdf:
    - 191
    - 192
    page_top: true
  verification: image
- id: mcc2023:rel:guideline:II-C-003
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-C 化学
  content:
    raw: 物質の成分
    id: mcc2023:II-C:02
    method: content-name-in-section
  mcc_raw: ･ 物質が原子からできていることについて説明できる。･ 単体と化合物について説明できる。･ 同素体について説明できる。･ 純物質と混合物の区別について説明できる。･ 混合物の分離法について理解し、適切な分離法を選択できる。
  goals_shared: false
  guideline_raw: 【化学基礎】ア 物質の構成粒子について、次のことを理解すること。また、物質と化学結合についての観察、実験などを通して、次のことを理解するとともに、それらの観察、実験などに関する技能を身に付けること。【化学基礎】㋒ 単体と化合物元素を確認する実験などを行い、単体、化合物について理解すること。炎色反応や沈殿反応を扱うこと。【化学基礎】㋑ 物質の分離・精製物質の分離や精製の実験などを行い、実験における基本操作と物質を探究する方法を身に付けること。ろ過、蒸留、抽出、再結晶及びクロマトグラフィーを扱うこと。
  guideline_shared: false
  targets:
  - raw: 物質が原子からできていることについて説明できる。
    id: mcc2023:II-C:02.01
    method: text-exact-in-scope
  - raw: 単体と化合物について説明できる。
    id: mcc2023:II-C:02.02
    method: text-exact-in-scope
  - raw: 同素体について説明できる。
    id: mcc2023:II-C:02.03
    method: text-exact-in-scope
  - raw: 純物質と混合物の区別について説明できる。
    id: mcc2023:II-C:02.04
    method: text-exact-in-scope
  - raw: 混合物の分離法について理解し、適切な分離法を選択できる。
    id: mcc2023:II-C:02.05
    method: text-exact-in-scope
  source:
    page_pdf: 192
    page_printed: 174
  verification: machine
- id: mcc2023:rel:guideline:II-C-004
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-C 化学
  content:
    raw: 物質の三態
    id: mcc2023:II-C:03
    method: content-name-in-section
  mcc_raw: ･ 物質を構成する分子・原子が常に熱運動していることについて説明できる。･ 水の状態変化について説明できる。･ 物質の三態とその状態変化について説明できる。
  goals_shared: false
  guideline_raw: 【化学基礎】㋓ 熱運動と物質の三態粒子の熱運動と温度との関係、粒子の熱運動と物質の三態変化との関係について理解すること。物理変化と化学変化の違いにも触れること。【化学】㋐ 状態変化物質の沸点、融点を分子間力や化学結合と関連付けて理解すること。また、状態変化に伴うエネルギーの出入り及び状態間の平衡と温度や圧力との関係について理解すること。融解熱や蒸発熱を扱うこと。「状態間の平衡」については、気液平衡や蒸気圧を扱うこと。
  guideline_shared: false
  targets:
  - raw: 物質を構成する分子・原子が常に熱運動していることについて説明できる。
    id: mcc2023:II-C:03.01
    method: text-exact-in-scope
  - raw: 水の状態変化について説明できる。
    id: mcc2023:II-C:03.02
    method: text-exact-in-scope
  - raw: 物質の三態とその状態変化について説明できる。
    id: mcc2023:II-C:03.03
    method: text-exact-in-scope
  source:
    page_pdf: 192
    page_printed: 174
  verification: machine
- id: mcc2023:rel:guideline:II-C-005
  type: curriculum-guideline
  row_kind: content
  section: Ⅱ-C 化学
  content:
    raw: 気体の状態方程式
    id: mcc2023:II-C:04
    method: content-name-in-section
  mcc_raw: ･ ボイル-シャルルの法則について説明でき、必要な計算ができる。･ 気体の状態方程式について説明でき、必要な計算ができる。
  goals_shared: false
  guideline_raw: 【化学】㋑ 気体の性質気体の体積と圧力や温度との関係を理解すること。ボイル・シャルルの法則や理想気体の状態方程式を扱うこと。その際、分子量測定にも触れること。また、混合気体、分圧の法則及び実在気体も扱うこと。気体分子のエネルギー分布と絶対温度にも触れること。
  guideline_shared: false
  targets:
  - raw: ボイル-シャルルの法則について説明でき、必要な計算ができる。
    id: mcc2023:II-C:04.01
    method: text-exact-in-scope
  - raw: 気体の状態方程式について説明でき、必要な計算ができる。
