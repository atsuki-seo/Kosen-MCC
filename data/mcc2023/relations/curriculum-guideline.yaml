    reason: mcc2023:I の下に同じ名称の学習内容がない
  mcc_raw: ･ 解の公式等を利用して、二次方程式を解くことができる。･ 因数定理等を利用して、高次方程式を解くことができる。･ 連立方程式を解くことができる。･ 無理方程式及び分数方程式を解くことができる。･ 一次不等式及び二次不等式を解くことができる。･ 恒等式の考え方を活用できる。
  goals_shared: false
  guideline_raw: 数学 I (1) 数と式ア(エ) 不等式の解の意味や不等式の性質について理解し、一次不等式の解を求めること。数学Ⅱ(1) いろいろな式ア(エ) 二次方程式の解の種類の判別及び解と係数の関係について理解すること。ア(オ) 因数定理について理解し、簡単な高次方程式の解を因数定理などを用いて求めること。
  guideline_shared: false
  targets:
  - raw: 解の公式等を利用して、二次方程式を解くことができる。
    id: mcc2023:I:02.01
