- id: mcc2023:rel:guideline:I-007
  type: curriculum-guideline
  row_kind: content
  section: Ⅰ 数学
  content:
    raw: 図形と式
    id: mcc2023:I:06
    method: content-name-in-section
  mcc_raw: ･ 与えられた二点から距離や内分点を求めることができる。･ 直線及び円の方程式を求めることができる。･ 二次曲線について、方程式とグラフの概形の関係を説明できる。･ 不等式の表す領域を図示できる。
  goals_shared: false
  guideline_raw: 数学Ⅱ(2) 図形と方程式ア(ア)座標を用いて、平面上の線分を内分する点、外分する点の位置や二点間の距離を表すこと。ア(イ)座標平面上の直線や円を方程式で表すこと。ア(ウ)軌跡について理解し、簡単な場合について軌跡を求めること。ア(エ)簡単な場合について、不等式の表す領域を求めたり領域を不等式で表したりすること。数C (2) 平面上の曲線と複素数平面ア(ア) 放物線、楕円、双曲線が二次式で表されること及びそれらの二次曲線の基本的な性質について理解すること。
  guideline_shared: false
  targets:
  - raw: 与えられた二点から距離や内分点を求めることができる。
    id: mcc2023:I:06.01
    method: text-exact-in-scope
  - raw: 直線及び円の方程式を求めることができる。
    id: mcc2023:I:06.02
    method: text-exact-in-scope
  - raw: 二次曲線について、方程式とグラフの概形の関係を説明できる。
