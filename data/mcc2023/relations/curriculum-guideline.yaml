- id: mcc2023:rel:guideline:I-013
  type: curriculum-guideline
  row_kind: content
  section: Ⅰ 数学
  content:
    raw: 微分法
    id: mcc2023:I:12
    method: content-name-in-section
  mcc_raw: ･ 関数の極限を求めることができる。･ 微分係数・導関数の意味を理解し、べき関数の導関数を求めることができる。･ 積及び商の導関数を求めることができる。･ 合成関数の微分法を利用した計算ができる。･ 三角関数・指数関数・対数関数・逆三角関数を含む関数の導関数を求めることができる。
  goals_shared: false
  guideline_raw: 数学Ⅱ(5）微分・積分の考えア(ア) 微分係数や導関数の意味について理解し、関数の定数倍、和及び差の導関数を求めること。ア(イ) 導関数を用いて関数の値の増減や極大・極小を調べ、グラフの概形をかく方法を理解すること。数学Ⅲ(1) 極限ア(オ) 関数の値の極限について理解すること。数学Ⅲ(2) 微分法ア(ア) 微分可能性、関数の積及び商の導関数について理解し、関数の和、差、積及び商の導関数を求めること。ア(イ) 合成関数の導関数について理解し、それを求めること。ア(ウ) 三角関数、指数関数及び対数関数の導関数について理解し、それらを求めること。ア(エ) 導関数を用いて、いろいろな曲線の接線の方程式を求めたり、いろいろな関数の値の増減、極大・極小、グラフの凹凸などを調べグラフの概形をかいたりすること。数C (2) 平面上の曲線と複素数平面ア(イ) 曲線の媒介変数表示について理解すること。
  guideline_shared: false
  targets:
  - raw: 関数の極限を求めることができる。
    id: mcc2023:I:12.01
    method: text-exact-in-scope
  - raw: 微分係数・導関数の意味を理解し、べき関数の導関数を求めることができる。
    id: mcc2023:I:12.02
    method: text-exact-in-scope
  - raw: 積及び商の導関数を求めることができる。
    id: mcc2023:I:12.03
    method: text-exact-in-scope
  - raw: 合成関数の微分法を利用した計算ができる。
    id: mcc2023:I:12.04
    method: text-exact-in-scope
  - raw: 三角関数・指数関数・対数関数・逆三角関数を含む関数の導関数を求めることができる。
    id: mcc2023:I:12.05
    method: text-exact-in-scope
  source:
