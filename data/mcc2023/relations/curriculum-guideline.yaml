  mcc_raw: ･ 累乗根や指数法則を利用した計算ができる。･ 指数関数の性質及びグラフを理解し、指数関数を含む方程式・不等式を解くことができる。･ 対数の性質を理解し、対数の計算ができる。･ 対数関数の性質及びグラフを理解し、対数関数を含む方程式・不等式を解くことができる。
  goals_shared: false
  guideline_raw: 数学Ⅱ(3) 指数関数・対数関数ア(ア) 指数を正の整数から有理数へ拡張する意義を理解し、指数法則を用いて数や式の計算をすること。ア(イ) 指数関数の値の変化やグラフの特徴について理解すること。ア(ウ) 対数の意味とその基本的な性質について理解し、簡単な対数の計算をすること。ア(エ) 対数関数の値の変化やグラフの特徴について理解すること。
  guideline_shared: false
