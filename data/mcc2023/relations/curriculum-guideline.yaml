  mcc_raw: ･ 運動の三法則について説明できる。･ 運動方程式を用いて、物体に生じる加速度や物体にはたらく力などを求めることができる。
  goals_shared: false
  guideline_raw: '[物理基礎] (1) (ｲ) ㋒ 物体に一定の力を加え続けたときの運動に関する実験などを行い、物体の質量、物体に働く力、物体に生じる加速度の関係を見いだして理解するとともに、運動の三法則を理解すること。（直線運動を中心に扱うこと。）'
