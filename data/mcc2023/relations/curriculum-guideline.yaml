- id: mcc2023:rel:guideline:I-001
  type: curriculum-guideline
  row_kind: objective
  section: Ⅰ 数学
  content:
    raw: Ⅰ 数学
    id: mcc2023:I
    method: code+name
  targets: []
  mcc_raw: 【教育領域の到達目標】工学の基本的問題を解決するために必要な数学の知識、計算技術及び応用能力を習得し、この知識及び技術等を工学における現象と関連づけて活用する能力を養う。
  goals_shared: false
  guideline_raw: 数学的な見方・考え方を働かせ、数学的活動を通して、数学的に考える資質・能力を次のとおり育成することを目指す。（1）数学における基本的な概念や原理・法則を体系的に理解するとともに、事象を数学化したり、数学的に解釈したり、数学的に表現・処理したりする技能を身に付けるようにする。（2）数学を活用して事象を論理的に考察する力、事象の本質や他の事象との関係を認識し統合的・発展的に考察する力、数学的な表現を用いて事象を簡潔・明瞭・的確に表現する力を養う。（3）数学のよさを認識し積極的に数学を活用しようとする態度、粘り強く考え数学的論拠に基づいて判断しようとする態度、問題解決の過程を振り返って考察を深めたり、評価・改善したりしようとする態度や創造性の基礎を養う。
  guideline_shared: false
  source:
    page_pdf: 186
    page_printed: 168
  verification: machine
- id: mcc2023:rel:guideline:I-002
  type: curriculum-guideline
  row_kind: content
  section: Ⅰ 数学
  content:
    raw: 数と式の計算
    id: mcc2023:I:01
    method: content-name-in-section
  mcc_raw: ･ 整式の加減乗除の計算、及び因数定理等を利用した簡単な因数分解ができる。･ 分数式の加減乗除の計算ができる。･ 実数の絶対値について理解し、計算ができる。･ 分母の有理化等の平方根の計算ができる。･ 複素数の相等を理解し、加減乗除及び絶対値の計算ができる。
  goals_shared: false
  guideline_raw: 数学 I (1) 数と式ア(ア） 数を実数まで拡張する意義を理解し、簡単な無理数の四則演算をすること。ア(ウ） 二次の乗法公式及び因数分解の公式の理解を深めること。数学Ⅱ(1) いろいろな式ア(ア) 三次の乗法公式及び因数分解の公式を理解し、それらを用いて式の展開や因数分解をすること。ア(イ) 多項式の除法や分数式の四則計算について理解し、簡単な場合について計算をすること。ア(ウ) 数を複素数まで拡張する意義を理解し、複素数の四則計算をすること。ア(オ) 因数定理について理解し、簡単な高次方程式の解を因数定理などを用いて求めること。
  guideline_shared: false
  targets:
  - raw: 整式の加減乗除の計算、及び因数定理等を利用した簡単な因数分解ができる。
    id: mcc2023:I:01.01
    method: text-exact-in-scope
  - raw: 分数式の加減乗除の計算ができる。
    id: mcc2023:I:01.02
    method: text-exact-in-scope
  - raw: 実数の絶対値について理解し、計算ができる。
    id: mcc2023:I:01.03
    method: text-exact-in-scope
  - raw: 分母の有理化等の平方根の計算ができる。
    id: mcc2023:I:01.04
    method: text-exact-in-scope
  - raw: 複素数の相等を理解し、加減乗除及び絶対値の計算ができる。
    id: mcc2023:I:01.05
    method: text-exact-in-scope
  source:
    page_pdf: 186
    page_printed: 168
  verification: machine
