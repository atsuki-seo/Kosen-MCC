  content:
    raw: 地理歴史的分野
    id: mcc2023:III-C:01
    method: content-name-in-section
  mcc_raw: 該当なし*地理情報システムの利用形態については、IV-C情報リテラシーの学習内容「情報基礎」を参照。
  goals_shared: false
  guideline_raw: '[地理総合]Ａ 地図や地理情報システムで捉える現代世界（1）地図や地理情報システムと現代世界位置や分布などに着目して、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識及び技能を身に付けること。（ｲ） 日常生活の中で見られる様々な地図の読図などを基に、地図や地理情報システムの役割や有用性などについて理解すること。（ｳ） 現代世界の様々な地理情報について、地図や地理情報システムなどを用いて、その情報を収集し、読み取り、まとめる基礎的・基本的な技能を身に付けること。'
  guideline_shared: false
  targets: []
  source:
    page_pdf: 214
    page_printed: 196
  verification: machine
- id: mcc2023:rel:guideline:III-C-060
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-C 社会
  group: MCCが対応していない新指導要領学習内容
  content:
    raw: 地理歴史的分野
    id: mcc2023:III-C:01
    method: content-name-in-section
  mcc_raw: 該当なし*IV-B技術者倫理の学習内容「社会や人類の問題・課題に対する工学や科学技術の貢献」を参照。
  goals_shared: false
  guideline_raw: '[地理総合]Ｃ 持続可能な地域づくりと私たち（1）自然環境と防災人間と自然環境との相互依存関係や地域などに着目して、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識及び技能を身に付けること。（ｱ） 我が国をはじめ世界で見られる自然災害や生徒の生活圏で見られる自然災害を基に、地域の自然環境の特色と自然災害への備えや対応との関わりとともに、自然災害の規模や頻度、地域性を踏まえた備えや対応の重要性などについて理解すること。（ｲ） 様々な自然災害に対応したハザードマップや新旧地形図をはじめとする各種の地理情報について、その情報を収集し、読み取り、まとめる地理的技能を身に付けること。'
  guideline_shared: false
  targets: []
  source:
    page_pdf: 214
    page_printed: 196
  verification: machine
