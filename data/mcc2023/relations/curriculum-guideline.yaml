  - raw: 因数定理等を利用して、高次方程式を解くことができる。
    id: mcc2023:I:02.02
    method: text-exact-in-scope
  - raw: 連立方程式を解くことができる。
    id: mcc2023:I:02.03
    method: text-exact-in-scope
  - raw: 無理方程式及び分数方程式を解くことができる。
    id: mcc2023:I:02.04
    method: text-exact-in-scope
  - raw: 一次不等式及び二次不等式を解くことができる。
    id: mcc2023:I:02.05
    method: text-exact-in-scope
  - raw: 恒等式の考え方を活用できる。
    id: mcc2023:I:02.06
