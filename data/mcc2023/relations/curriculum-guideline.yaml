  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-B 英語
  content:
    raw: 英語コミュニケーション（英語運用能力の基礎固め）
    id: mcc2023:III-B:04
    method: content-name-in-section
  mcc_raw: 日常的な話題や社会的な話題について、はっきりとした発音で、調整された速さで話された内容から、必要な情報を聞き取り、話し手の意図を把握できる。
  goals_shared: false
  guideline_raw: 第１ 英語コミュニケーションⅠ(3)言語活動及び言語の働きに関する事項 ①言語活動に関する事項(ｱ) 日常的な話題について、話される速さを調整されたり、基本的な語句や文での言い換えを十分に聞いたりしながら、対話や放送などから必要な情報を聞き取り、話し手の意図を把握する活動。また、聞き取った内容を話したり書いたりして伝え合う活動。(ｲ) 社会的な話題について、話される速さを調整されたり、基本的な語句や文での言い換えを十分に聞いたりしながら、対話や説明などから必要な情報を聞き取り、概要や要点を把握する活動。また、聞き取った内容を話したり書いたりして伝え合う活動。
  guideline_shared: false
  targets:
