  guideline_raw: '[世界史探究]Ｃ 諸地域の交流・再編（3）アジア諸地域とヨーロッパの再編諸資料を活用し、（1）で考察した観点を踏まえた問いを基に、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識を身に付けること。（ｱ） 西アジアや南アジアの諸帝国、清と日本・朝鮮などの動向を基に、アジア諸地域の特質を構造的に理解すること。（ｲ） 宗教改革とヨーロッパ諸国の抗争、大西洋三角貿易の展開、科学革命と啓蒙思想などを基に、主権国家体制の形成と地球規模での交易の拡大を構造的に理解すること。'
