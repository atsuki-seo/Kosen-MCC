- id: mcc2023:rel:guideline:IV-C-001
  type: curriculum-guideline
  row_kind: objective
  section: Ⅳ-C 工学基礎（情報リテラシー）
  content:
    raw: Ⅳ-C 工学基礎（情報リテラシー）
    id: mcc2023:IV-C
    method: code+parent-name+name
  targets: []
  mcc_raw: 【教育領域の到達目標】専門分野によらずセキュリティに配慮して情報を正しく取り扱い、情報技術を活用し、課題解決のための基本的なアルゴリズムを考えてプログラムを作成できることを目標とする。また、数理・データサイエンス・AIを日常の生活、仕事等の場で使いこなすことができる基礎的素養を身に付け、自らの専門分野に応じてこれらの知識・技能を説明し、活用できるようになることを目標とする。(1) 情報を収集、処理、発信するための基本的なハードウェア、ソフトウェア、ネットワークに関する知識を活用できる。(2) 特定の課題に対し、アルゴリズムを考え、記述できる。(3) 情報セキュリティに配慮して情報を正しく取扱うことができる。(4) 自らの専門分野に応じて情報技術の知識・技能を説明し、活用できる。(5) 数理・データサイエンス・AIを使う素養を身に付ける。
  goals_shared: false
  guideline_raw: 【情報Ⅰ】情報に関する科学的な見方・考え方を働かせ、情報技術を活用して問題の発見・解決を行う学習活動を通して、問題の発見・解決に向けて情報と情報技術を適切かつ効果的に活用し、情報社会に主体的に参画するための資質・能力を次のとおり育成することを目指す。（1）効果的なコミュニケーションの実現、コンピュータやデータの活用について理解を深め技能を習得するとともに、情報社会と人との関わりについて理解を深めるようにする。（2） 様々な事象を情報とその結び付きとして捉え、問題の発見・解決に向けて情報と情報技術を適切かつ効果的に活用する力を養う。（3） 情報と情報技術を適切に活用するとともに、情報社会に主体的に参画する態度を養う。【情報Ⅱ】情報に関する科学的な見方・考え方を働かせ、情報技術を活用して問題の発見・解決を行う学習活動を通して、問題の発見・解決に向けて情報と情報技術を適切かつ効果的、創造的に活用し、情報社会に主体的に参画し、その発展に寄与するための資質・能力を次のとおり育成することを目指す。（1） 多様なコミュニケーションの実現、情報システムや多様なデータの活用について理解を深め技能を習得するとともに、情報技術の発展と社会の変化について理解を深めるようにする。（2） 様々な事象を情報とその結び付きとして捉え、問題の発見・解決に向けて情報と情報技術を適切かつ効果的、創造的に活用する力を養う。（3） 情報と情報技術を適切に活用するとともに、新たな価値の創造を目指し、情報社会に主体的に参画し、その発展に寄与する態度を養う。
  guideline_shared: false
  source:
    page_pdf: 219
    page_printed: 201
  verification: machine
- id: mcc2023:rel:guideline:IV-C-002
  type: curriculum-guideline
  row_kind: content
  section: Ⅳ-C 工学基礎（情報リテラシー）
  content:
    raw: 情報基礎
    id: mcc2023:IV-C:01
    method: content-name-in-section
  mcc_raw: ･ 社会の情報化の進展と課題について理解し説明できる。･ 代表的な情報システムとその利用形態について説明できる。･ コンピュータの構成とオペレーティングシステム(OS)の役割を理解し、基本的な取扱いができる。･ アナログ情報とデジタル情報の違いと、コンピュータ内におけるデータ(数値、文字等)の表現方法について説明できる。･ 情報を適切に収集・取得できる。･ データベースの意義と概要について説明できる。
  goals_shared: false
  guideline_raw: 【情報Ⅰ(1) 情報社会の問題解決】情報と情報技術を活用した問題の発見・解決の方法に着目し、情報社会の問題を発見・解決する活動を通して、次の事項を身に付けることができるよう指導する。ア(ア) 情報やメディアの特性を踏まえ、情報と情報技術を活用して問題を発見・解決する方法を身に付けること。ア(ウ) 情報技術が人や社会に果たす役割と及ぼす影響について理解すること。イ(ア) 目的や状況に応じて、情報と情報技術を適切かつ効果的に活用して問題を発見・解決する方法について考えること。イ(ウ) 情報と情報技術の適切かつ効果的な活用と望ましい情報社会の構築について考察すること。【情報Ⅰ(2) コミュニケーションと情報デザイン】メディアとコミュニケーション手段及び情報デザインに着目し、目的や状況に応じて受け手に分かりやすく情報を伝える活動を通して、次の事項を身に付けることができるよう指導する。ア(ア) メディアの特性とコミュニケーション手段の特徴について、その変遷も踏まえて科学的に理解すること。ア(イ) 情報デザインが人や社会に果たしている役割を理解すること。ア(ウ) 効果的なコミュニケーションを行うための情報デザインの考え方や方法を理解し表現する技能を身に付けること。【情報Ⅰ(3) コンピュータとプログラミング】コンピュータで情報が処理される仕組みに着目し、プログラミングやシミュレーションによって問題を発見・解決する活動を通して、次の事項を身に付けることができるよう指導する。ア(ア) コンピュータや外部装置の仕組みや特徴、コンピュータでの情報の内部表現と計算に関する限界について理解すること。イ(ア) コンピュータで扱われる情報の特徴とコンピュータの能力との関係について考察すること。【情報Ⅰ(4) 情報通信ネットワークとデータの活用】情報通信ネットワークを介して流通するデータに着目し、情報通信ネットワークや情報システムにより提供されるサービスを活用し、問題を発見・解決する活動を通して、次の事項を身に付けることができるよう指導する。ア(イ) データを蓄積、管理、提供する方法、情報通信ネットワークを介して情報システムがサービスを提供する仕組みと特徴について理解すること。ア(ウ) データを表現、蓄積するための表し方と、データを収集、整理、分析する方法について理解し技能を身に付けること。イ(イ)
    情報システムが提供するサービスの効果的な活用について考えること。イ(ウ)データの収集、整理、分析及び結果の表現の方法を適切に選択し、実行し、評価し改善すること。【情報Ⅱ(1) 情報社会の進展と情報技術】情報技術の発展による人や社会への影響に着目し、情報社会の進展と情報技術の関係を歴史的に捉え、将来の情報技術を展望する活動を通して、次の事項を身に付けることができるよう指導する。ア(ア) 情報技術の発展の歴史を踏まえ、情報社会の進展について理解すること。ア(ウ) 情報技術の発展による人の知的活動への影響について理解すること。イ(ア) 情報技術の発展や情報社会の進展を踏まえ、将来の情報技術と情報社会の在り方について考察すること。イ(ウ) 人の知的活動が変化する社会における情報システムの創造やデータ活用の意義について考察すること。【情報Ⅱ(3) 情報とデータサイエンス】多様かつ大量のデータを活用することの有用性に着目し、データサイエンスの手法によりデータを分析し、その結果を読み取り解釈する活動を通して、次の事項を身に付けることができるよう指導する。ア(ア) 多様かつ大量のデータの存在やデータ活用の有用性、データサイエンスが社会に果たす役割について理解し、目的に応じた適切なデータの収集や整理、整形について理解し技能を身に付けること。イ(ア) 目的に応じて、適切なデータを収集し、整理し、整形すること。【情報Ⅱ(4) 情報システムとプログラミング】情報システムの在り方や社会生活に及ぼす影響、情報の流れや処理の仕組みに着目し、情報システムを協働して開発する活動を通して、次の事項を身に付けることができるよう指導する。ア(ア) 情報システムにおける、情報の流れや処理の仕組み、情報セキュリティを確保する方法や技術について理解すること。ア(イ) 情報システムの設計を表記する方法、設計、実装、テスト、運用等のソフトウェア開発のプロセスとプロジェクト・マネジメントについて理解すること。イ(ア) 情報システム及びそれによって提供されるサービスについて、その在り方や社会に果たす役割と及ぼす影響について考察すること。
  guideline_shared: false
  targets:
  - raw: 社会の情報化の進展と課題について理解し説明できる。
    id: mcc2023:IV-C:01.01
    method: text-exact-in-scope
  - raw: 代表的な情報システムとその利用形態について説明できる。
    id: mcc2023:IV-C:01.02
    method: text-exact-in-scope
  - raw: コンピュータの構成とオペレーティングシステム(OS)の役割を理解し、基本的な取扱いができる。
    id: mcc2023:IV-C:01.03
    method: text-exact-in-scope
  - raw: アナログ情報とデジタル情報の違いと、コンピュータ内におけるデータ(数値、文字等)の表現方法について説明できる。
    id: mcc2023:IV-C:01.04
    method: text-exact-in-scope
  - raw: 情報を適切に収集・取得できる。
    id: mcc2023:IV-C:01.05
    method: text-exact-in-scope
  - raw: データベースの意義と概要について説明できる。
    id: mcc2023:IV-C:01.06
    method: text-exact-in-scope
  source:
    page_pdf: 219
    page_printed: 201
    pages_pdf:
    - 219
    - 220
    page_top: true
  verification: image
- id: mcc2023:rel:guideline:IV-C-003
  type: curriculum-guideline
  row_kind: content
  section: Ⅳ-C 工学基礎（情報リテラシー）
  content:
    raw: プログラミングとアルゴリズム
    id: mcc2023:IV-C:02
    method: content-name-in-section
  mcc_raw: ･ 基礎的なプログラムを作成できる。･ 計算機を用いて数学的な処理を行うことができる。･ 基礎的なアルゴリズムについて理解し、任意のプログラミング言語を用いて記述できる。･ 同一の問題に対し、それを解決できる複数のアルゴリズムが存在しうることを説明できる。
  goals_shared: false
  guideline_raw: 【情報Ⅰ(3) コンピュータとプログラミング】ア(イ) アルゴリズムを表現する手段、プログラミングによってコンピュータや情報通信ネットワークを活用する方法について理解し技能を身に付けること。ア(ウ) 社会や自然などにおける事象をモデル化する方法、シミュレーションを通してモデルを評価し改善する方法について理解すること。イ(イ) 目的に応じたアルゴリズムを考え適切な方法で表現し、プログラミングによりコンピュータや情報通信ネットワークを活用するとともに、その過程を評価し改善すること。イ(ウ) 目的に応じたモデル化やシミュレーションを適切に行うとともに、その結果を踏まえて問題の適切な解決方法を考えること。【情報Ⅱ(4) 情報システムとプログラミング】ア(ア) 情報システムにおける、情報の流れや処理の仕組み、情報セキュリティを確保する方法や技術について理解すること。ア(イ) 情報システムの設計を表記する方法、設計、実装、テスト、運用等のソフトウェア開発のプロセスとプロジェクト・マネジメントについて理解すること。ア(ウ) 情報システムを構成するプログラムを制作する方法について理解し技能を身に付けること。イ(ア) 情報システム及びそれによって提供されるサービスについて、その在り方や社会に果たす役割と及ぼす影響について考察すること。イ(イ) 情報システムをいくつかの機能単位に分割して制作し統合するなど、開発の効率や運用の利便性などに配慮して設計すること。イ(ウ) 情報システムを構成するプログラムを制作し、その過程を評価し改善すること。
  guideline_shared: false
  targets:
  - raw: 基礎的なプログラムを作成できる。
    id: mcc2023:IV-C:02.01
    method: text-exact-in-scope
  - raw: 計算機を用いて数学的な処理を行うことができる。
    id: mcc2023:IV-C:02.02
    method: text-exact-in-scope
  - raw: 基礎的なアルゴリズムについて理解し、任意のプログラミング言語を用いて記述できる。
    id: mcc2023:IV-C:02.03
    method: text-exact-in-scope
  - raw: 同一の問題に対し、それを解決できる複数のアルゴリズムが存在しうることを説明できる。
    id: mcc2023:IV-C:02.04
    method: text-exact-in-scope
  source:
    page_pdf: 220
    page_printed: 202
  verification: machine
- id: mcc2023:rel:guideline:IV-C-004
  type: curriculum-guideline
  row_kind: content
  section: Ⅳ-C 工学基礎（情報リテラシー）
  content:
    raw: メディア
    id: mcc2023:IV-C:03
    method: content-name-in-section
  mcc_raw: ･ 情報の真偽について、根拠に基づいて検討する方法を説明できる。･ 情報の適切な表現方法と伝達手段を選択し、情報の送受信を行うことができる。
  goals_shared: false
  guideline_raw: 【情報Ⅰ(2) コミュニケーションと情報デザイン】ア(ア) メディアの特性とコミュニケーション手段の特徴について、その変遷も踏まえて科学的に理解すること。ア(イ) 情報デザインが人や社会に果たしている役割を理解すること。ア(ウ) 効果的なコミュニケーションを行うための情報デザインの考え方や方法を理解し表現する技能を身に付けること。イ(ア) メディアとコミュニケーション手段の関係を科学的に捉え、それらを目的や状況に応じて適切に選択すること。イ(イ) コミュニケーションの目的を明確にして、適切かつ効果的な情報デザインを考えること。イ(ウ) 効果的なコミュニケーションを行うための情報デザインの考え方や方法に基づいて表現し、評価し改善すること。【情報Ⅰ(4) 情報通信ネットワークとデータの活用】ア(ウ) データを表現、蓄積するための表し方と、データを収集、整理、分析する方法について理解し技能を身に付けること。イ(ウ)データの収集、整理、分析及び結果の表現の方法を適切に選択し、実行し、評価し改善すること。【情報Ⅱ(1) 情報社会の進展と情報技術】ア(イ) 情報技術の発展によるコミュニケーションの多様化について理解すること。イ(イ) コミュニケーションが多様化する社会におけるコンテンツの創造と活用の意義について考察すること。【情報Ⅱ(2) コミュニケーションとコンテンツ】多様なコミュニケーションの形態とメディアの特性に着目し、目的や状況に応じて情報デザインに配慮し、文字、音声、静止画、動画などを組み合わせたコンテンツを協働して制作し、様々な手段で発信する活動を通して、次の事項を身に付けることができるよう指導する。ア(ア) 多様なコミュニケーションの形態とメディアの特性との関係について理解すること。ア(イ) 文字、音声、静止画、動画などを組み合わせたコンテンツを制作する技能を身に付けること。ア(ウ) コンテンツを様々な手段で適切かつ効果的に社会に発信する方法を理解すること。イ(ア) 目的や状況に応じて、コミュニケーションの形態を考え、文字、音声、静止画、動画などを選択し、組合せを考えること。イ(イ) 情報デザインに配慮してコンテンツを制作し、評価し改善すること。イ(ウ) コンテンツを社会に発信したときの効果や影響を考え、発信の手段やコンテンツを評価し改善すること。
  guideline_shared: false
  targets:
  - raw: 情報の真偽について、根拠に基づいて検討する方法を説明できる。
    id: mcc2023:IV-C:03.01
    method: text-exact-in-scope
