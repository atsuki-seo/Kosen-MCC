  mcc_raw: 近代化を遂げた欧米諸国が、19 世紀に至るまでに、日本を含む世界を一体化していく過程について、その概要を説明できる。
  goals_shared: true
  guideline_raw: '[世界史探究]Ｄ 諸地域の結合・変容（2）世界市場の形成と諸地域の結合諸資料を活用し、（1）で考察した観点を踏まえた問いを基に、課題を追究したり解決したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識を身に付けること。（ｱ） 産業革命と環大西洋革命、自由主義とナショナリズム、南北戦争の展開などを基に、国民国家と近代民主主義社会の形成を構造的に理解すること。（ｲ） 国際的な分業体制と労働力の移動、イギリスを中心とした自由貿易体制、アジア諸国の植民地化と諸改革などを基に、世界市場の形成とアジア諸国の変容を構造的に理解すること。'
  guideline_shared: false
  targets:
  - raw: 近代化を遂げた欧米諸国が、19 世紀に至るまでに、日本を含む世界を一体化していく過程について、その概要を説明できる。
