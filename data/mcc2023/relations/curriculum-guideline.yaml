- id: mcc2023:rel:guideline:III-C-045
  type: curriculum-guideline
  row_kind: content
  section: Ⅲ-C 社会
  content:
    raw: 公民的分野
    id: mcc2023:III-C:02
    method: content-name-in-section
  mcc_raw: 自己が主体的に参画していく社会について、基本的人権や民主主義などの基本原理と基礎的な政治・法・経済の仕組みを理解し、現代社会の諸課題について考察できる。
  goals_shared: true
  guideline_raw: '[政治・経済]Ａ 現代日本における政治・経済の諸課題（1）現代日本の政治・経済個人の尊厳と基本的人権の尊重、対立、協調、効率、公正などに着目して、現代の諸課題を追究したり解決に向けて構想したりする活動を通して、次の事項を身に付けることができるよう指導する。ア 次のような知識及び技能を身に付けること。（ｱ） 政治と法の意義と機能、基本的人権の保障と法の支配、権利と義務との関係、議会制民主主義、地方自治について、現実社会の諸事象を通して理解を深めること。（ｲ） 経済活動と市場、経済主体と経済循環、国民経済の大きさと経済成長、物価と景気変動、財政の働きと仕組み及び租税などの意義、金融の働きと仕組みについて、現実社会の諸事象を通して理解を深めること。（ｳ） 現代日本の政治・経済に関する諸資料から、課題の解決に向けて考察、構想する際に必要な情報を適切かつ効果的に収集し、読み取る技能を身に付けること。'
  guideline_shared: false
  targets:
  - raw: 自己が主体的に参画していく社会について、基本的人権や民主主義などの基本原理と基礎的な政治・法・経済の仕組みを理解し、現代社会の諸課題について考察できる。
    id: mcc2023:III-C:02.02
    method: text-exact-in-scope
