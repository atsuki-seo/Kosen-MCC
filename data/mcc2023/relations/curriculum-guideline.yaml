  mcc_raw: （該当なし）
  goals_shared: false
  guideline_raw: '[物理] (4) (ｱ) ㋐ 電子の電荷と質量について理解すること。（電子に関する歴史的な実験にも触れること。）(4) (ｱ) ㋑ 電子や光の粒子性と波動性について理解すること。（光電効果、電子線回折などを扱い、Ｘ線にも触れること。）(4) (ｲ) ㋐ 原子の構造及びスペクトルと電子のエネルギー準位との関係について理解すること。（水素原子の構造を中心にスペクトルと関連させて扱うこと。）(4) (ｲ) ㋑ 原子核の構成、原子核の崩壊及び核反応について理解すること。（質量とエネルギーの等価性にも触れること。）(4) (ｲ) ㋒ 素粒子の存在について知ること。'
