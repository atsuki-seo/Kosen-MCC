  goals_shared: true
  guideline_raw: '[政治・経済]Ａ 現代日本における政治・経済の諸課題（2）現代日本における政治・経済の諸課題の探究社会的な見方・考え方を総合的に働かせ、他者と協働して持続可能な社会の形成が求められる現代日本社会の諸課題を探究する活動を通して、次の事項を身に付けることができるよう指導する。ア 少子高齢社会における社会保障の充実・安定化、地域社会の自立と政府、多様な働き方・生き方を可能にする社会、産業構造の変化と起業、歳入・歳出両面での財政健全化、食料の安定供給の確保と持続可能な農業構造の実現、防災と安全・安心な社会の実現などについて、取り上げた課題の解決に向けて政治と経済とを関連させて多面的・多角的に考察、構想し、よりよい社会の在り方についての自分の考えを説明、論述すること。'
