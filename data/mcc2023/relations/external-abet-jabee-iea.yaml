  type: external-standard
  standard: ABET-JABEE-IEA
  row: 1
  items:
    ABET:
    - label: '1.'
      text: 1. an ability to identify, formulate, and solve complex engineering problems by applying principles of engineering, science, and mathematics.
    JABEE:
    - label: (c)
      text: (c) 数学、自然科学及び情報技術に関する知識とそれらを応用する能力
    - label: (d)
      text: (d) 当該分野において必要とされる専門的知識とそれらを応用する能力
    IEA-WK:
    - label: WK1
      text: 'WK1: A systematic, theory-based understanding of the natural sciences applicable to the discipline and awareness of relevant social sciences'
    - label: WK2
      text: 'WK2: Conceptually-based mathematics, numerical analysis, data analysis, statistics and formal aspects of computer and information science to support detailed analysis and modelling applicable to the discipline'
    - label: WK3
      text: 'WK3: A systematic, theory-based formulation of engineering fundamentals required in the engineering discipline'
    - label: WK4
      text: 'WK4: Engineering specialist knowledge that provides theoretical frameworks and bodies of knowledge for the accepted practice areas in the engineering discipline; much is at the forefront of the discipline.'
    - label: WK5
      text: 'WK5: Knowledge, including efficient resource use, environmental impacts, whole-life cost, re-use of resources, net zero carbon, and similar concepts, that supports engineering design and operations in a practice area'
    - label: WK6
      text: 'WK6: Knowledge of engineering practice (technology) in the practice areas in the engineering discipline'
    IEA-WA:
    - label: WA1
      text: 'WA1: Apply knowledge of mathematics, natural science, computing and engineering fundamentals, and an engineering specialization as specified in WK1 to WK4 respectively to develop solutions to complex engineering problems'
      title: Engineering Knowledge
    - label: WA3
      text: 'WA3: Design creative solutions for complex engineering problems and design systems, components or processes to meet identified needs with appropriate consideration for public health and safety, whole-life cost, net zero carbon as well as resource, cultural, societal, and environmental considerations as required (WK5)'
      title: Design/development of solutions
