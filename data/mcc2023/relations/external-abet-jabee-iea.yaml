- id: mcc2023:rel:abet:04
  type: external-standard
  standard: ABET-JABEE-IEA
  row: 4
  items:
    ABET:
    - label: '4.'
      text: 4. an ability to recognize ethical and professional responsibilities in engineering situations and make informed judgments, which must consider the impact of engineering solutions in global, economic, environmental, and societal contexts.
    JABEE:
    - label: (a)
      text: (a) 地球的視点から多面的に物事を考える能力とその素養
    - label: (b)
      text: (b) 技術が社会や自然に及ぼす影響や効果、及び技術者の社会に対する貢献と責任に関する理解
    - label: (h)
      text: (h) 与えられた制約の下で計画的に仕事を進め、まとめる能力
    IEA-WK:
    - label: WK5
      text: 'WK5: Knowledge, including efficient resource use, environmental impacts, whole-life cost, re-use of resources, net zero carbon, and similar concepts, that supports engineering design and operations in a practice area'
    - label: WK7
      text: 'WK7: Knowledge of the role of engineering in society and identified issues in engineering practice in the discipline, such as the professional responsibility of an engineer to public safety and sustainable development*'
    - label: WK9
      text: 'WK9: Ethics, inclusive behavior and conduct. Knowledge of professional ethics, responsibilities, and norms of engineering practice. Awareness of the need for diversity by reason of ethnicity, gender, age, physical ability etc. with mutual understanding and respect, and of inclusive attitudes'
    IEA-WA:
    - label: WA6
      text: 'WA6: When solving complex engineering problems, analyze and evaluate sustainable development impacts* to: society, the economy, sustainability, health and safety, legal frameworks, and the environment (WK1, WK5, and WK7)'
      title: The Engineer and the World
    - label: WA7
      text: 'WA7: Apply ethical principles and commit to professional ethics and norms of engineering practice and adhere to relevant national and international laws. Demonstrate an understanding of the need for diversity and inclusion (WK9)'
      title: Ethics
