- id: mcc2023:V-F-7
  type: area
  parent: mcc2023:V-F
  code: V-F-7
  name: 計画
  heading_raw: V-F-7 計画
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 計画系領域は、国土・地域・都市の成り立ちを理解し、都市と交通の計画を立案するための方法論と統計的計
    - 算手法を習得し、その知識を社会基盤の整備計画に使うことができる能力を養う。
    - (1) 計画分野は、国土・地域・都市の各計画の歴史を理解し、今後の土地利用・交通・防災の各計画を立案す
    - る方法について、説明できること。
    - (2) 道路分野は、交通の特性を理解し、道路設計に必要な基準について、説明できること。
    - (3) 数理計画分野は、都市計画と交通計画に必要な統計的計算手法について、説明できること。
    - 2 一般的な科目名
    - 都市計画、地域計画、計画数理学、道路工学、交通計画、舗装工学
    pages_pdf:
    - 108
  source:
    page_pdf: 108
    page_printed: 94
  verification: machine
