- id: mcc2023:V-F-5
  type: area
  parent: mcc2023:V-F
  code: V-F-5
  name: 水理
  heading_raw: V-F-5 水理
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 水理系領域は、水の物理的性質及び静水力学と流体力学の基礎理論と計算理論を理解し、流れの計算方法を習
    - 得し、その知識を治水・利水・環境に関する課題に使うことができる能力を養う。
    - (1) 水理分野は、静水圧及び管水路と開水路の流れの理論について、説明できること。
    - (2) 河川分野は、川の流れの基本的性質を理解し、流出量や水文量が計算でき、治水・利水・環境に関する河川
    - の諸問題について、説明できること。
    - (3) 海岸分野は、波の基本的性質について、説明できること。
    - 2 一般的な科目名
    - 水理学、河川工学、水文学、水資源工学、海岸工学
    pages_pdf:
    - 106
  source:
    page_pdf: 106
    page_printed: 92
  verification: machine
