  name: 製図
  heading_raw: V-F-9 製図
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 製図系領域は、製図の基礎知識と土木規約を理解し、図面の描き方と設計計算法を習得し、その知識・技術を
    - 構造物の設計・製図に使うことができる能力を養う。
    - (1) 図学・製図分野は、製図用具又はCADを使用し、線の描き分け、寸法・文字の記入方法、構造物の表
    - 現・投影方法について、説明できること。
    - (2) CAD分野は、ソフトウェアの基本的な操作方法を理解し、二次元の図面の作成、修正、印刷ができるこ
    - と。
    - (3) 設計製図分野では、土木製図の規約を理解し、構造物の設計製図を指針を基に表現できること。
    - 2 一般的な科目名
    - 図学、製図
    pages_pdf:
    - 109
  source:
    page_pdf: 109
    page_printed: 95
  verification: machine
