    - 1 目標
    - 材料系領域は、土木工学に使用されるおもな材料の製造方法、組成、性質などを理解し、使用目的に応じて適
    - 切に材料を選定し、計画的、経済的に材料を活用することができる能力を養う。
    - (1) 材料分野では、建設工事に使用される主な材料全般に関して、上に示した能力を持つこと。
    - (2) コンクリート分野では、特にコンクリートに関して、より深く上の目標を達成することに加えて、コンク
    - リート構造物の設計計算ができること。
    - 2 一般的な科目名
    - 建設材料学、コンクリート工学、建設複合材料、コンクリート構造学、鉄筋コンクリート
