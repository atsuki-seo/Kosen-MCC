  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 施工系領域は、土木工事における各種の建設機械や材料及び施工法や法規を理解し、品質、原価、工程、安全
    - 衛生、環境の管理方法を習得し、工事施工の指導・監督に使うことができる能力を養う。
    - (1) 管理分野は、品質、原価、工程、安全衛生、環境の管理方法について、説明できること。
    - (2) 施工分野は、土工、基礎工、コンクリート工、トンネル工の概要について、説明できること。
    - 2 一般的な科目名
    - 施工管理、土木施工、施工管理学
