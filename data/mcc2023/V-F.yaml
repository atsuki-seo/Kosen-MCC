  heading_raw: V-F-1 測量
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 測量系領域は、各種測量器械、器具の構造、調整方法及び使用方法を理解し、基礎的な各種測量の学習により
    - 測量の基礎的な知識、技能を習得するとともに、工事の設計、施工に応用できる能力を養う。
    - (1) 測量分野では、主に平面測量で用いられる各種測量方法に関して、上に示した能力を持つこと。
    - (2) 応用測量分野では、主に測地学的測量で用いられる各種測量方法に関して、上に示した能力を持つこと。
    - 2 一般的な科目名
    - 測量学、応用測量学、空間情報工学、リモートセンシング、応用数学
    pages_pdf:
    - 102
  source:
    page_pdf: 102
    page_printed: 88
  verification: machine
