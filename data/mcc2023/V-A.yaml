    - とを目標とする。
    - (1) 機械製図の規格を理解し、機械部品等の製作図を正確に作成できる。
    - (2) 各種の機械・装置について、その仕様に基づいて主要部を設計し、製作図を作成できる。
    - 2 一般的な科目名
    - 機械製図、機械設計製図
