    - 【教育領域の到達目標】
    - 1 目標
    - 計測制御領域は、計測の基礎と各種物理量の計測方法、制御系の数学的表現とその特性を解析するための基礎
    - 的知識を習得することを目標とする。
    - (1) 計測の基礎を理解し、代表的な物理量の計測方法を説明できる。
    - (2) 制御の概念を理解し、数学モデルを用いて制御系を表現できる。
    - (3) 時間応答及び周波数応答を計算し、その特性を説明できる。
    - (4) 制御系の安定性を判別できる。
    - 2 一般的な科目名
    - 計測工学、制御工学
