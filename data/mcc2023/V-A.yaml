    - 1 目標
    - 力学系領域は、物体に作用する力によって、物体に生じる様々な現象を理解するための基礎的知識を習得する
    - ことを目標とする。
    - (1) 物体に作用する力、物体の運動、力と運動状態の変化を説明できる。
    - (2) 材料に作用する荷重と変形の関係を説明できる。
    - (3) 一自由度系の振動を運動方程式で表し、系の運動を説明できる。
    - 2 一般的な科目名
    - 工業力学、材料力学、機械力学
    pages_pdf:
