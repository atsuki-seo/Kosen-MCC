  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - 実験・実習系領域は、ものづくりの基礎及び材料工学の理論や観察・分析・評価法を理解して基本操作ができ
    - ることを目標とする。
    - (1) 機械工作実習では、各種工作法の技能・技術を習得するとともに、技術者として望ましい態度や習慣を身
    - に付けることも併せて目標とする。
    - (2) 材料工学実験では、実験装置の原理と操作方法を理解し、実験の過程及び結果を説明できる能力を養うこ
    - とを目標とする。
    - 2 一般的な科目名
    - 材料工学実験、工作実習、機器分析実験
