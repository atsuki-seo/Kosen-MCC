  name: 創造性
  heading_raw: 5-1.1 IX-A 創造性
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - それぞれの専門分野における知識、技能を駆使して、あらかじめ回答が与えられていない問題に取り組み、多
    - 様な観点から検討した上で対応すべき問題を定義して、解決策を創造することができる。また、クライアント
    - やユーザの視点に立って工学的な要件を定義し、これを実現するための工程を考え、実践することができる。
    - 2 授業設計の考え方
    - 創造性、エンジニアリングデザイン能力の育成を図る科目などにおいて、複合的な事象（現実の問題や初見の
    - 事例など）を題材に問題解決や課題達成を目指す学修活動の設計を想定している。グループでの活動や、地域
    - 社会や企業などとの協働教育、社会実装教育などの学修活動を通した育成、評価が求められる。なお、この
    - 「創造性」「エンジニアリングデザイン」を取り入れた学修活動を通して、各高専の専門分野における学修目
    - 標がレベル4に到達するものと想定している。
