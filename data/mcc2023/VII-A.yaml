  name: コミュニケーションスキル
  heading_raw: 4-1.1 VII-A コミュニケーションスキル
  description:
    lines:
    - 【教育領域の到達目標】
    - 1 目標
    - あらゆる分野の基盤的技能について、大きく（１）対人関係技能（Interpersonal Skills）、（２）個人的技能
    - （Personal Skills）に分類している。（１）対人関係技能には「コミュニケーションスキル」及び「チームワ
    - ークとリーダーシップ」が含まれ、（２）個人的技能には「情報収集・活用・発信力」、「思考力」及び「課題
    - 発見力・問題解決力」が含まれる。学修やその他の活動を通してこれらの技能を習得、発展させることを目標
    - とする。
    - 2 授業設計の考え方
    - あらゆる科目で、その分野の知識・技能に加え、この領域に含まれる技能を組み合わせた到達目標及び学習内
    - 容を設定した上で、学生の学修活動や学修成果の振り返りを通して到達状況を測定・評価することを想定して
    - いる。
    - 特に高等学校学習指導要領において学力の三要素として「知識・技能」、「思考力・判断力・表現力」及び「学
    - 習に向かう態度」が挙げられ、各科目においてこれらの学力の発達を促す授業設計が要求されていることを踏
    - まえ、高等専門学校においても「基礎的能力」及び「分野別専門的能力」の各項目とこの領域に示す汎用的技
    - 能の伸長を図る授業設計を行うことが求められる。
